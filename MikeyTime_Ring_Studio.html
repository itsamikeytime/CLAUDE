  <resources>${objectsXml}
  </resources>
  <build>${buildItemsXml}</build>
</model>`;

  const contentTypesXml = `<?xml version="1.0" encoding="UTF-8"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
  <Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml" />
  <Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml" />
</Types>`;

  const relsXml = `<?xml version="1.0" encoding="UTF-8"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
  <Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel" />
</Relationships>`;

  const encoder = new TextEncoder();
  const files = [
    { name: '[Content_Types].xml', data: encoder.encode(contentTypesXml) },
    { name: '_rels/.rels', data: encoder.encode(relsXml) },
    { name: '3D/3dmodel.model', data: encoder.encode(modelXml) }
  ];

  const crcTable = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
    crcTable[n] = c;
  }
  const crc32 = (bytes) => {
    let crc = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) crc = (crc >>> 8) ^ crcTable[(crc ^ bytes[i]) & 0xff];
    return (crc ^ 0xffffffff) >>> 0;
  };

  let localSize = 0;
  let centralSize = 0;
  files.forEach(f => {
    f.nameBytes = encoder.encode(f.name);
    f.crc = crc32(f.data);
    localSize += 30 + f.nameBytes.length + f.data.length;
    centralSize += 46 + f.nameBytes.length;
  });

  const totalZipSize = localSize + centralSize + 22;
  const zipBuf = new ArrayBuffer(totalZipSize);
  const view = new DataView(zipBuf);
  const uint8 = new Uint8Array(zipBuf);

  let offset = 0;
  files.forEach(f => {
    f.localOffset = offset;
    view.setUint32(offset, 0x04034b50, true);
    view.setUint16(offset + 4, 20, true);
    view.setUint16(offset + 6, 0, true);
    view.setUint16(offset + 8, 0, true);
    view.setUint16(offset + 10, 0, true);
    view.setUint16(offset + 12, 0, true);
    view.setUint32(offset + 14, f.crc, true);
    view.setUint32(offset + 18, f.data.length, true);
    view.setUint32(offset + 22, f.data.length, true);
    view.setUint16(offset + 26, f.nameBytes.length, true);
    view.setUint16(offset + 28, 0, true);
    uint8.set(f.nameBytes, offset + 30);
    uint8.set(f.data, offset + 30 + f.nameBytes.length);
    offset += 30 + f.nameBytes.length + f.data.length;
  });

  const centralDirOffset = offset;
  files.forEach(f => {
    view.setUint32(offset, 0x02014b50, true);
    view.setUint16(offset + 4, 20, true);
    view.setUint16(offset + 6, 20, true);
    view.setUint16(offset + 8, 0, true);
    view.setUint16(offset + 10, 0, true);
    view.setUint16(offset + 12, 0, true);
    view.setUint16(offset + 14, 0, true);
    view.setUint32(offset + 16, f.crc, true);
    view.setUint32(offset + 20, f.data.length, true);
    view.setUint32(offset + 24, f.data.length, true);
    view.setUint16(offset + 28, f.nameBytes.length, true);
    view.setUint16(offset + 30, 0, true);
    view.setUint16(offset + 32, 0, true);
    view.setUint16(offset + 34, 0, true);
    view.setUint16(offset + 36, 0, true);
    view.setUint32(offset + 38, 0, true);
    view.setUint32(offset + 42, f.localOffset, true);
    uint8.set(f.nameBytes, offset + 46);
    offset += 46 + f.nameBytes.length;
  });

  view.setUint32(offset, 0x06054b50, true);
  view.setUint16(offset + 4, 0, true);
  view.setUint16(offset + 6, 0, true);
  view.setUint16(offset + 8, files.length, true);
  view.setUint16(offset + 10, files.length, true);
  view.setUint32(offset + 12, centralSize, true);
  view.setUint32(offset + 16, centralDirOffset, true);
  view.setUint16(offset + 20, 0, true);

  return new Blob([zipBuf], { type: 'model/3mf' });
};

// Exploded view: every part moves as one rigid piece, outward along its
// stone's direction from the ring's center. Offsets come from the parts' real
// radial extents so nothing overlaps: a stone's metal (prongs, bezel, halo
// base) lifts until its lowest point clears the band, and the stone (and any
// halo gems) lifts until it clears the top of that metal, each with a gap.
const computeExplodeShifts = (shells, amount) => {
  const shifts = shells.map(() => null);
  if (!amount || shells.length < 2) return shifts;
  const GAP = 1.2;
  const radial = (p) => Math.hypot(p.x, p.z);
  const info = shells.map((shell) => {
    let minR = Infinity, maxR = -Infinity, sx = 0, sz = 0;
    shell.triangles.forEach((t) => {
      [t.v1, t.v2, t.v3].forEach((p) => {
        const r = radial(p);
        if (r < minR) minR = r;
        if (r > maxR) maxR = r;
        sx += p.x; sz += p.z;
      });
    });
    const m = /Stone_(\d+)_/.exec(shell.name || '');
    return { minR, maxR, sx, sz, group: m ? m[1] : null };
  });
  const bandTop = info[0].maxR;
  const groups = {};
  info.forEach((it, i) => {
    if (i === 0 || it.group === null) return;
    (groups[it.group] = groups[it.group] || []).push(i);
  });
  Object.values(groups).forEach((idxs) => {
    const gem = idxs.find(i => !shells[i].isMetal) ?? idxs[0];
    const dLen = Math.hypot(info[gem].sx, info[gem].sz) || 1;
    const dir = { x: info[gem].sx / dLen, z: info[gem].sz / dLen };
    const metal = idxs.filter(i => shells[i].isMetal);
    const metalLift = metal.length ? Math.max(0, ...metal.map(i => bandTop - info[i].minR)) + GAP : 0;
    const metalTop = metal.length ? Math.max(...metal.map(i => info[i].maxR)) + metalLift : bandTop;
    idxs.forEach((i) => {
      const lift = shells[i].isMetal ? metalLift : Math.max(0, metalTop - info[i].minR) + GAP;
      shifts[i] = { x: dir.x * lift * amount, z: dir.z * lift * amount };
    });
  });
  return shifts;
};

const Ring3DPreviewCanvas = ({
  shells,
  externalCameraRequest,
  explodeParts
}) => {
  const canvasRef = useRef(null);
  const [rotX, setRotX] = useState(35);
  const [rotY, setRotY] = useState(-22);
  const [camZoom, setCamZoom] = useState(1.18);
  const [isDragging, setIsDragging] = useState(false);
  const lastPosRef = useRef({ x: 0, y: 0 });
  // Pixel buffer matched to the canvas's on-screen box. A fixed 920x360
  // buffer gets stretched unevenly once maxHeight caps the displayed height,
  // turning round stones into ovals, so the buffer follows the real size.
  const [canvasSize, setCanvasSize] = useState({ width: 920, height: 360 });

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas || typeof ResizeObserver === 'undefined') return;
    const syncSize = () => {
      const rect = canvas.getBoundingClientRect();
      if (rect.width < 1 || rect.height < 1) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const width = Math.round(rect.width * dpr);
      const height = Math.round(rect.height * dpr);
      setCanvasSize(prev => (prev.width === width && prev.height === height ? prev : { width, height }));
    };
    syncSize();
    const observer = new ResizeObserver(syncSize);
    observer.observe(canvas);
    return () => observer.disconnect();
  }, []);

  useEffect(() => {
    if (!externalCameraRequest) return;
    setRotX(externalCameraRequest.rotX);
    setRotY(externalCameraRequest.rotY);
    setCamZoom(externalCameraRequest.camZoom);
  }, [externalCameraRequest]);

  const parseHexRGB = (hex) => {
    const clean = (hex || '#ffffff').replace('#', '');
    const num = parseInt(clean, 16);
    return {
      r: ((num >> 16) & 255) || 220,
      g: ((num >> 8) & 255) || 220,
      b: (num & 255) || 220
    };
  };

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const width = canvas.width;
    const height = canvas.height;

    const imgData = ctx.createImageData(width, height);
    const data = imgData.data;
    const zBuffer = new Float32Array(width * height);
    zBuffer.fill(-1e9);

    const cx = width * 0.5, cy = height * 0.5;
    const maxR = width * 0.65;
    for (let py = 0; py < height; py++) {
      const dy = py - cy;
      const rowOffset = py * width;
      for (let px = 0; px < width; px++) {
        const dx = px - cx;
        const t = Math.min(1, Math.sqrt(dx * dx + dy * dy) / maxR);
        const idx = (rowOffset + px) * 4;
        data[idx] = Math.round(38 * (1 - t) + 20 * t);
        data[idx + 1] = Math.round(41 * (1 - t) + 22 * t);
        data[idx + 2] = Math.round(49 * (1 - t) + 27 * t);
        data[idx + 3] = 255;
      }
    }

    const rx = (rotX * Math.PI) / 180;
    const ry = (rotY * Math.PI) / 180;
    const cosX = Math.cos(rx), sinX = Math.sin(rx);
    const cosY = Math.cos(ry), sinY = Math.sin(ry);

    const mmScale = 12.2 * camZoom * (height / 360);
    const fov = 165;

    // explodeShift moves a whole shell as one rigid piece. Pushing each
    // vertex out along its own radial direction instead fanned flat gems
    // apart and stretched them along the ring.
    const project3D = (pt, explodeShift = null) => {
      let x = pt.x;
      let y = pt.y;
      let z = pt.z;

      if (explodeShift) {
        x += explodeShift.x;
        z += explodeShift.z;
      }

      const x1 = x * cosY + z * sinY;
      const z1 = -x * sinY + z * cosY;
      const y2 = y * cosX - z1 * sinX;
      const z2 = y * sinX + z1 * cosX;

      const persp = fov / Math.max(30, fov - z2 * 0.75);
      return {
        sx: cx + x1 * mmScale * persp,
        sy: cy - y2 * mmScale * persp,
        z: z2
      };
    };

    const lightDir1 = { x: 0.34, y: 0.56, z: 0.75 };
    const lightDir2 = { x: -0.45, y: -0.25, z: 0.85 };
    const creaseLines = [];

    const explodeShifts = computeExplodeShifts(shells, explodeParts);

    shells.forEach((shell, sIdx) => {
      const baseRGB = parseHexRGB(shell.color);
      const explodeShift = explodeShifts[sIdx];

      shell.triangles.forEach(tri => {
        let nx1 = tri.normal.x * cosY + tri.normal.z * sinY;
        const nz1 = -tri.normal.x * sinY + tri.normal.z * cosY;
        let ny2 = tri.normal.y * cosX - nz1 * sinX;
        let nz2 = tri.normal.y * sinX + nz1 * cosX;

        if (nz2 < 0) {
          nx1 = -nx1;
          ny2 = -ny2;
          nz2 = -nz2;
        }

        const p1 = project3D(tri.v1, explodeShift);
        const p2 = project3D(tri.v2, explodeShift);
        const p3 = project3D(tri.v3, explodeShift);

        const minX = Math.max(0, Math.floor(Math.min(p1.sx, p2.sx, p3.sx)));
        const maxX = Math.min(width - 1, Math.ceil(Math.max(p1.sx, p2.sx, p3.sx)));
        const minY = Math.max(0, Math.floor(Math.min(p1.sy, p2.sy, p3.sy)));
        const maxY = Math.min(height - 1, Math.ceil(Math.max(p1.sy, p2.sy, p3.sy)));
        if (minX > maxX || minY > maxY) return;

        const denom = (p2.sy - p3.sy) * (p1.sx - p3.sx) + (p3.sx - p2.sx) * (p1.sy - p3.sy);
        if (Math.abs(denom) < 1e-4) return;
        const invDenom = 1.0 / denom;

        const dot1 = Math.max(0, nx1 * lightDir1.x + ny2 * lightDir1.y + nz2 * lightDir1.z);
        const dot2 = Math.max(0, nx1 * lightDir2.x + ny2 * lightDir2.y + nz2 * lightDir2.z) * 0.28;
        const isPocketWall = tri.shadeTag === 'pocket_wall';
        const isPocketFloor = tri.shadeTag === 'pocket_floor';
        const cavityAO = isPocketFloor ? 0.48 : (isPocketWall ? 0.64 : 1.0);

        const specPower = shell.isMetal ? 18 : 34;
        const specStrength = isPocketFloor ? 0.1 : (shell.isMetal ? 0.46 : 0.92);
        const spec = Math.pow(Math.max(0, nz2), specPower) * specStrength;
        const lum = (0.34 + dot1 * 0.58 + dot2) * cavityAO;

        const rCol = Math.min(255, Math.round(baseRGB.r * lum + 255 * spec));
        const gCol = Math.min(255, Math.round(baseRGB.g * lum + 255 * spec));
        const bCol = Math.min(255, Math.round(baseRGB.b * lum + 255 * spec));

        const zBias = sIdx === 0 ? 0 : (shell.isMetal ? 0.08 : 0.05);

        for (let py = minY; py <= maxY; py++) {
          const rowIdx = py * width;
          const pyCenter = py + 0.5;
          for (let px = minX; px <= maxX; px++) {
            const pxCenter = px + 0.5;
            const w1 = ((p2.sy - p3.sy) * (pxCenter - p3.sx) + (p3.sx - p2.sx) * (pyCenter - p3.sy)) * invDenom;
            if (w1 < -0.0005) continue;
            const w2 = ((p3.sy - p1.sy) * (pxCenter - p3.sx) + (p1.sx - p3.sx) * (pyCenter - p3.sy)) * invDenom;
            if (w2 < -0.0005) continue;
            const w3 = 1.0 - w1 - w2;
            if (w3 < -0.0005) continue;

            const zVal = w1 * p1.z + w2 * p2.z + w3 * p3.z + zBias;
            const bIdx = rowIdx + px;
            if (zVal > zBuffer[bIdx]) {
              zBuffer[bIdx] = zVal;
              const pIdx = bIdx * 4;
              data[pIdx] = rCol;
              data[pIdx + 1] = gCol;
              data[pIdx + 2] = bCol;
              data[pIdx + 3] = 255;
            }
          }
        }

        if (!shell.isMetal || isPocketWall) {
          creaseLines.push({
            p1, p2, p3,
            zBias: zBias + 0.08,
            color: isPocketWall ? [18, 24, 38] : [255, 255, 255],
            alpha: isPocketWall ? 0.45 : 0.32
          });
        }
      });
    });

    const drawDepthLine = (a, b, zBias, rgb, alpha) => {
      const steps = Math.max(1, Math.ceil(Math.hypot(b.sx - a.sx, b.sy - a.sy)));
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        const px = Math.round(a.sx + (b.sx - a.sx) * t);
        const py = Math.round(a.sy + (b.sy - a.sy) * t);
        if (px < 0 || px >= width || py < 0 || py >= height) continue;
        const z = a.z + (b.z - a.z) * t + zBias;
        const bIdx = py * width + px;
        if (z >= zBuffer[bIdx] - 0.12) {
          const pIdx = bIdx * 4;
          data[pIdx] = Math.round(data[pIdx] * (1 - alpha) + rgb[0] * alpha);
          data[pIdx + 1] = Math.round(data[pIdx + 1] * (1 - alpha) + rgb[1] * alpha);
          data[pIdx + 2] = Math.round(data[pIdx + 2] * (1 - alpha) + rgb[2] * alpha);
        }
      }
    };

    creaseLines.forEach(cl => {
      drawDepthLine(cl.p1, cl.p2, cl.zBias, cl.color, cl.alpha);
      drawDepthLine(cl.p2, cl.p3, cl.zBias, cl.color, cl.alpha);
    });

    ctx.putImageData(imgData, 0, 0);
  }, [shells, rotX, rotY, camZoom, explodeParts, canvasSize]);

  const handlePointerDown = (e) => {
    setIsDragging(true);
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    lastPosRef.current = { x: clientX, y: clientY };
  };

  const handlePointerMove = (e) => {
    if (!isDragging) return;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const dx = clientX - lastPosRef.current.x;
    const dy = clientY - lastPosRef.current.y;
    lastPosRef.current = { x: clientX, y: clientY };
    setRotY(prev => prev + dx * 0.65);
    setRotX(prev => Math.max(-89, Math.min(89, prev + dy * 0.65)));
  };

  const handlePointerUp = () => setIsDragging(false);

  const handleWheel = (e) => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.1 : -0.1;
    setCamZoom(prev => Math.max(0.5, Math.min(3.2, Number((prev + delta).toFixed(2)))));
  };

  return (
    <div className="relative w-full max-w-5xl">
      <canvas
        ref={canvasRef}
        width={canvasSize.width}
        height={canvasSize.height}
        onMouseDown={handlePointerDown}
        onMouseMove={handlePointerMove}
        onMouseUp={handlePointerUp}
        onMouseLeave={handlePointerUp}
        onTouchStart={handlePointerDown}
        onTouchMove={handlePointerMove}
        onTouchEnd={handlePointerUp}
        onWheel={handleWheel}
        aria-label="3D ring preview. Drag to rotate, scroll to zoom."
        className="block w-full h-auto rounded-lg ring-1 ring-stage-line shadow-sm bg-stage cursor-grab active:cursor-grabbing"
        style={{ maxHeight: '35vh', aspectRatio: '920 / 360' }}
      />
    </div>
  );
};

function App() {
  const [canvasViewMode, setCanvasViewMode] = useState('2d');
  const [zoom, setZoom] = useState(1);
  const [bandColor, setBandColor] = useState('gold');
  const [bandWidth, setBandWidth] = useState(4);
  const [isFlatBand, setIsFlatBand] = useState(false);
  const [layoutMode, setLayoutMode] = useState('cluster');

  const [showSeparation, setShowSeparation] = useState(false);
  const [showWidth, setShowWidth] = useState(false);
  const [showVertical, setShowVertical] = useState(false);
  const [verticalFrom, setVerticalFrom] = useState('top');

  const [measTextSize, setMeasTextSize] = useState(0.45);
  const [showRuler, setShowRuler] = useState(true);
  const [rulerScale, setRulerScale] = useState(1);
  const [rulerOffset, setRulerOffset] = useState(0);

  const [ringSize, setRingSize] = useState(7);
  const [bandThickness, setBandThickness] = useState(1.8);
  const [gemRelief, setGemRelief] = useState(1.2);
  const [pocketDepthInput, setPocketDepthInput] = useState(0.75);
  const [uniqueStone3D, setUniqueStone3D] = useState(false);
  const [include3DSettings, setInclude3DSettings] = useState(true);
  const [cutoutMode, setCutoutMode] = useState('pocket_and_gem');
  const [bandProfile, setBandProfile] = useState('flat');
  const [bandProfileSize, setBandProfileSize] = useState(null);


  const [isGlobalSettingsOpen, setIsGlobalSettingsOpen] = useState(true);
  const [is3DSettingsOpen, setIs3DSettingsOpen] = useState(true);
  const [explode3DParts, setExplode3DParts] = useState(0);
  const [externalCameraRequest, setExternalCameraRequest] = useState({
    rotX: 35,
    rotY: -22,
    camZoom: 1.18,
    presetName: '3/4',
    timestamp: 0
  });

  const apply3DCameraPreset = (presetName, rotX, rotY, camZoom) => {
    setCanvasViewMode('3d');
    setExternalCameraRequest({
      rotX,
      rotY,
      camZoom,
      presetName,
      timestamp: Date.now()
    });
  };

  const [errorMessage, setErrorMessage] = useState('');
  const fileInputRef = useRef(null);
  const svgRef = useRef(null);

  const [stones, setStones] = useState([
    {
      id: 1, linkedTo: null, colorMode: 'preset', preset: 'Diamond', color: PRESET_STONES['Diamond'],
      shape: 'Round Brilliant', settingStyle: '4-Prong', bezelSize: 0.5, bezelColor: 'gold',
      width: 6, heightOffset: 0, rotation: 0, gap: 0, side: 'right', centerOffset: 5,
      haloSize: 1.0, haloPreset: 'Diamond', haloColor: PRESET_STONES['Diamond'], haloUniqueStones: false, haloOverrides: {},
      reliefOverride: '', pocketDepthOverride: ''
    },
  ]);

  // ---- Undo / redo -------------------------------------------------------
  // History covers the design itself (stones, band, 3D print settings), not
  // view settings like zoom, rulers or overlays. Changes are committed after
  // a short pause, so one slider drag or typed number is one undo step.
  const designSnapshot = {
    stones, bandColor, bandWidth, layoutMode, ringSize, bandThickness, gemRelief,
    pocketDepthInput, uniqueStone3D, include3DSettings, cutoutMode, bandProfile, bandProfileSize
  };
  const designKey = JSON.stringify(designSnapshot);
  const historyRef = useRef({ past: [], presentKey: null, present: null, future: [] });
  const restoringRef = useRef(false);
  const latestDesignRef = useRef({ key: designKey, snap: designSnapshot });
  latestDesignRef.current = { key: designKey, snap: designSnapshot };
  const [historyCounts, setHistoryCounts] = useState({ undo: 0, redo: 0 });
  const HISTORY_LIMIT = 100;

  const syncHistoryCounts = () => {
    const h = historyRef.current;
    setHistoryCounts({ undo: h.past.length, redo: h.future.length });
  };

  const commitPendingChange = () => {
    const h = historyRef.current;
    const { key, snap } = latestDesignRef.current;
    if (h.presentKey === null) { h.present = snap; h.presentKey = key; return; }
    if (key === h.presentKey) return;
    h.past.push({ snap: h.present, key: h.presentKey });
    if (h.past.length > HISTORY_LIMIT) h.past.shift();
    h.present = snap; h.presentKey = key; h.future = [];
  };

  useEffect(() => {
    const h = historyRef.current;
    if (h.presentKey === null) { h.present = latestDesignRef.current.snap; h.presentKey = designKey; return; }
    if (restoringRef.current) { restoringRef.current = false; h.present = latestDesignRef.current.snap; h.presentKey = designKey; return; }
    const timer = setTimeout(() => { commitPendingChange(); syncHistoryCounts(); }, 400);
    return () => clearTimeout(timer);
  }, [designKey]);

  const applyDesign = (d) => {
    setStones(d.stones);
    setBandColor(d.bandColor);
    setBandWidth(d.bandWidth);
    setLayoutMode(d.layoutMode);
    setRingSize(d.ringSize);
    setBandThickness(d.bandThickness);
    setGemRelief(d.gemRelief);
    setPocketDepthInput(d.pocketDepthInput);
    setUniqueStone3D(d.uniqueStone3D);
    setInclude3DSettings(d.include3DSettings);
    setCutoutMode(d.cutoutMode);
    setBandProfile(d.bandProfile);
    setBandProfileSize(d.bandProfileSize);
  };

  const undo = () => {
    commitPendingChange();
    const h = historyRef.current;
    if (!h.past.length) { syncHistoryCounts(); return; }
    h.future.push({ snap: h.present, key: h.presentKey });
    const prev = h.past.pop();
    h.present = prev.snap; h.presentKey = prev.key;
    restoringRef.current = true;
    applyDesign(prev.snap);
    syncHistoryCounts();
  };

  const redo = () => {
    commitPendingChange();
    const h = historyRef.current;
    if (!h.future.length) { syncHistoryCounts(); return; }
    h.past.push({ snap: h.present, key: h.presentKey });
    const next = h.future.pop();
    h.present = next.snap; h.presentKey = next.key;
    restoringRef.current = true;
    applyDesign(next.snap);
    syncHistoryCounts();
  };

  const undoRef = useRef(undo);
  const redoRef = useRef(redo);
  undoRef.current = undo;
  redoRef.current = redo;
  useEffect(() => {
    const onKey = (e) => {
      if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
      const t = e.target;
      const isTextField = t && (t.tagName === 'TEXTAREA' || (t.tagName === 'INPUT' && ['text', 'number', 'search'].includes(t.type)) || t.isContentEditable);
      if (isTextField) return;
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undoRef.current(); }
      else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); redoRef.current(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const addStone = () => {
    setStones(prevStones => {
      const lastStone = prevStones[prevStones.length - 1];
      const newId = prevStones.length > 0 ? Math.max(...prevStones.map(s => s.id)) + 1 : 1;

      if (!lastStone) {
        return [{
          id: newId, linkedTo: null, colorMode: 'preset', preset: 'Diamond', color: PRESET_STONES['Diamond'],
          shape: 'Round Brilliant', settingStyle: '4-Prong', bezelSize: 0.5, bezelColor: 'gold',
          width: 6, heightOffset: 0, rotation: 0, gap: 0, side: 'right', centerOffset: 5,
          haloSize: 1.0, haloPreset: 'Diamond', haloColor: PRESET_STONES['Diamond'], haloUniqueStones: false, haloOverrides: {},
          reliefOverride: '', pocketDepthOverride: ''
        }];
      }

      return [
        ...prevStones,
        {
          id: newId,
          linkedTo: null,
          colorMode: lastStone.colorMode,
          preset: lastStone.preset,
          color: lastStone.color,
          shape: lastStone.shape || 'Round Brilliant',
          settingStyle: lastStone.settingStyle || '4-Prong',
          bezelSize: lastStone.bezelSize || 0.5,
          bezelColor: lastStone.bezelColor || 'gold',
          width: lastStone.width,
          heightOffset: lastStone.heightOffset || 0,
          rotation: lastStone.rotation || 0,
          gap: prevStones.length === 1 ? 1 : lastStone.gap,
          side: prevStones.length === 1 ? 'right' : lastStone.side,
          centerOffset: prevStones.length === 1 ? ((lastStone.width / 2) + 2) : lastStone.centerOffset,
          haloSize: lastStone.haloSize || 1.0,
          haloPreset: lastStone.haloPreset || 'Diamond',
          haloColor: lastStone.haloColor || PRESET_STONES['Diamond'],
          haloUniqueStones: lastStone.haloUniqueStones || false,
          haloOverrides: lastStone.haloOverrides || {},
          reliefOverride: lastStone.reliefOverride ?? '',
          pocketDepthOverride: lastStone.pocketDepthOverride ?? ''
        }
      ];
    });
  };

  const removeSpecificStone = (idToRemove) => {
    if (stones.length <= 1) return;
    setStones(prev => prev.filter(s => s.id !== idToRemove).map(s => s.linkedTo === idToRemove ? { ...s, linkedTo: null } : s));
  };

  const updateStone = (index, updates) => {
    setStones(prevStones => {
      const newStones = [...prevStones];
      newStones[index] = { ...newStones[index], ...updates };
      return newStones;
    });
  };

  const triggerDownload = (blob, filename) => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleExportConfig = () => {
    const config = {
      appVersion: APP_VERSION,
      zoom, bandColor, bandWidth, isFlatBand, layoutMode,
      showSeparation, showWidth, showVertical, verticalFrom,
      measTextSize, showRuler, rulerScale, rulerOffset,
      ringSize, bandThickness, gemRelief, pocketDepthInput, uniqueStone3D, include3DSettings, cutoutMode, bandProfile, bandProfileSize,
      stones
    };
    const blob = new Blob([JSON.stringify(config, null, 2)], { type: 'text/plain' });
    triggerDownload(blob, 'ring-config.txt');
  };

  const handleImportConfig = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const config = JSON.parse(event.target.result);
        if (config && Array.isArray(config.stones)) {
          setZoom(config.zoom || 1);
          setBandColor(config.bandColor || 'gold');
          setBandWidth(config.bandWidth || 4);
          setIsFlatBand(config.isFlatBand || false);
          setLayoutMode(config.layoutMode || 'cluster');
          setShowSeparation(config.showSeparation || false);
          setShowWidth(config.showWidth || false);
          setShowVertical(config.showVertical || false);
          setVerticalFrom(config.verticalFrom || 'top');

          setMeasTextSize(config.measTextSize ?? 0.45);
          setShowRuler(config.showRuler ?? true);
          setRulerScale(config.rulerScale ?? 1);
          setRulerOffset(config.rulerOffset ?? 0);

          setRingSize(config.ringSize ?? 7);
          setBandThickness(config.bandThickness ?? 1.8);
          setGemRelief(config.gemRelief ?? 1.2);
          setPocketDepthInput(config.pocketDepthInput ?? 0.75);
          setUniqueStone3D(config.uniqueStone3D ?? false);
          setInclude3DSettings(config.include3DSettings ?? true);
          setCutoutMode(config.cutoutMode ?? 'pocket_and_gem');
          setBandProfile(BAND_PROFILES.some(bp => bp.id === config.bandProfile) ? config.bandProfile : 'flat');
          setBandProfileSize(Number.isFinite(config.bandProfileSize) ? config.bandProfileSize : null);

          setStones(config.stones);
          // "1.31" was this release's name for a short while before it became 1.3.1.
          const savedVersion = config.appVersion === '1.31' ? '1.3.1' : config.appVersion;
          if (savedVersion && compareVersions(savedVersion, APP_VERSION) > 0) {
            setErrorMessage(`This design was saved with v${config.appVersion}; some newer settings may not load in v${APP_VERSION}.`);
            setTimeout(() => setErrorMessage(''), 6000);
          } else {
            setErrorMessage('');
          }
        } else throw new Error("Invalid structure");
      } catch (error) {
        setErrorMessage('Failed to load file. Ensure it is a valid Ring Config format.');
        setTimeout(() => setErrorMessage(''), 4000);
      }
    };
    reader.readAsText(file);
    if (fileInputRef.current) fileInputRef.current.value = '';
  };

  const effectiveStones = useMemo(() => {
    return stones.map(stone => {
      if (stone.linkedTo) {
        const target = stones.find(s => s.id === stone.linkedTo);
        if (target) {
          return {
            ...stone,
            shape: target.shape,
            colorMode: target.colorMode,
            preset: target.preset,
            color: target.color,
            settingStyle: target.settingStyle,
            bezelColor: target.bezelColor,
            bezelSize: target.bezelSize,
            width: target.width,
            heightOffset: target.heightOffset,
            rotation: (360 - (target.rotation || 0)) % 360,
            gap: target.gap,
            centerOffset: target.centerOffset,
            side: target.side === 'left' ? 'right' : 'left',
            haloSize: target.haloSize,
            haloPreset: target.haloPreset,
            haloColor: target.haloColor,
            haloUniqueStones: target.haloUniqueStones,
            haloOverrides: target.haloOverrides,
            reliefOverride: target.reliefOverride,
            pocketDepthOverride: target.pocketDepthOverride
          };
        }
      }
      return stone;
    });
  }, [stones]);

  const renderedStones = useMemo(() => {
    const positions = [];

    if (layoutMode === 'scatter') {
      let currentX = 0;
      const relativePositions = effectiveStones.map((stone, index) => {
        if (index === 0) return 0;
        const prevWidth = Number(effectiveStones[index - 1].width) || 0;
        currentX += (prevWidth / 2) + (Number(stone.gap) || 0) + (Number(stone.width) || 0) / 2;
        return currentX;
      });

      const firstSize = Number(effectiveStones[0]?.width) || 0;
      const lastSize = Number(effectiveStones[effectiveStones.length - 1]?.width) || 0;
      const leftEdge = relativePositions[0] - (firstSize / 2);
      const rightEdge = relativePositions[relativePositions.length - 1] + (lastSize / 2);
      const clusterCenter = (leftEdge + rightEdge) / 2;
      positions.push(...relativePositions.map(pos => pos - clusterCenter));
    } else {
      effectiveStones.forEach((stone, index) => {
        if (index === 0) {
          positions.push(0);
        } else {
          const offset = Number(stone.centerOffset) || 0;
          positions.push(stone.side === 'left' ? -offset : offset);
        }
      });
    }

    const mappedStones = effectiveStones.map((stone, index) => ({
      ...stone,
      x: positions[index],
      y: -(Number(stone.heightOffset) || 0),
      originalIndex: index
    }));

    if (layoutMode === 'cluster') {
      mappedStones.sort((a, b) => Math.abs(b.x) - Math.abs(a.x));
    }
    return mappedStones;
  }, [effectiveStones, layoutMode]);

  const ring3DData = useMemo(() => {
    return build3DRingShells({
      renderedStones,
      bandWidth,
      bandColor,
      ringSize,
      bandThickness,
      gemRelief,
      pocketDepthInput,
      uniqueStone3D,
      include3DSettings,
      cutoutMode,
      bandProfile,
      bandProfileSize
    });
  }, [renderedStones, bandWidth, bandColor, ringSize, bandThickness, gemRelief, pocketDepthInput, uniqueStone3D, include3DSettings, cutoutMode, bandProfile, bandProfileSize]);

  const handleExportSTL = useCallback(() => {
    const blob = generateBinarySTLBlob(ring3DData.shells, bandWidth);
    triggerDownload(blob, `mikeytime-ring-size-${ringSize}-welded.stl`);
  }, [ring3DData, ringSize, bandWidth]);

  const handleExport3MF = useCallback(() => {
    const blob = generate3MFBlob(ring3DData.shells, bandWidth);
    triggerDownload(blob, `mikeytime-ring-size-${ringSize}-multiobject.3mf`);
  }, [ring3DData, ringSize, bandWidth]);

  // Serializes a copy of the blueprint without the hiding it gets in 3D view,
  // so an export taken from either view opens as a visible drawing.
  const serializeBlueprint = () => {
    const clone = svgRef.current.cloneNode(true);
    clone.style.display = '';
    clone.removeAttribute('aria-hidden');
    return new XMLSerializer().serializeToString(clone);
  };

  const handleExportSVG = () => {
    if (!svgRef.current) return;
    const svgData = serializeBlueprint();
    const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    triggerDownload(blob, 'ring-design.svg');
  };

  const handleExportPNG = () => {
    if (!svgRef.current) return;
    const svgData = serializeBlueprint();
    const canvas = document.createElement("canvas");
    canvas.width = 1920;
    canvas.height = 960;
    const ctx = canvas.getContext("2d");
    const img = new Image();
    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(svgBlob);

    img.onload = () => {
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);

      canvas.toBlob((blob) => {
        triggerDownload(blob, 'ring-design.png');
      }, 'image/png');
    };
    img.src = url;
  };

  const handleExportCSV = () => {
    // One table, band first, then each stone followed by its halo stones
    // grouped by color, so it doubles as an order list.
    const csvCell = (v) => {
      const str = v === null || v === undefined ? '' : String(v);
      return /[",\n]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str;
    };
    const mm = (n) => Number(n).toFixed(2);
    const stoneName = (hex) => Object.keys(PRESET_STONES).find(k => PRESET_STONES[k] === hex) || `Custom ${hex}`;
    const headers = ['Item', 'Qty', 'Part', 'Shape', 'Size (mm)', 'Stone / Metal', 'Setting', 'Relief (mm)', 'Socket Depth (mm)', 'Notes'];
    const rows = [];

    const halfBW = (Number(bandWidth) || 4) / 2;
    const thick = Math.max(1.2, Number(bandThickness) || 1.8);
    const profileLabel = BAND_PROFILES.find(bp => bp.id === bandProfile)?.label || 'Flat';
    const profileSize = bandProfile === 'flat' ? '' : ` (${bandProfile === 'bevel' ? 'bevel' : 'dome'} ${mm(getBandProfile(bandProfile, halfBW, thick, bandProfileSize).edge)} mm)`;
    rows.push([
      'Band', 1, 'Ring band', `${profileLabel} profile${profileSize}`,
      `US ${ringSize}, bore Ø ${mm(ring3DData.innerDiameter)}, ${mm(bandWidth)} wide × ${mm(thick)} thick`,
      `${bandColor.charAt(0).toUpperCase()}${bandColor.slice(1)} metal`, '', '', '',
      cutoutMode === 'pocket_and_gem' ? 'Carved sockets + stones' : cutoutMode === 'sockets_only' ? 'Empty sockets only' : 'Solid band (no sockets)'
    ]);

    effectiveStones.forEach((stone, i) => {
      const w = Number(stone.width) || 0;
      const h = w * (SHAPE_RATIOS[stone.shape] || 1);
      const role = layoutMode === 'cluster' ? (i === 0 ? 'center anchor' : `${stone.side} side`) : 'scatter row';
      const stRelief = (uniqueStone3D && stone.reliefOverride !== '' && stone.reliefOverride !== undefined && stone.reliefOverride !== null) ? stone.reliefOverride : gemRelief;
      const stDepth = (uniqueStone3D && stone.pocketDepthOverride !== '' && stone.pocketDepthOverride !== undefined && stone.pocketDepthOverride !== null) ? stone.pocketDepthOverride : pocketDepthInput;
      const setting = stone.settingStyle === 'Bezel'
        ? `Bezel ${mm(stone.bezelSize || 0.5)} mm, ${stone.bezelColor || bandColor}`
        : stone.settingStyle === 'Halo' ? `Halo (${mm(stone.haloSize || 1)} mm stones)` : stone.settingStyle;
      rows.push([
        `Stone ${i + 1}`, 1, `Stone (${role})`, stone.shape, `${mm(w)} × ${mm(h)}`,
        stone.colorMode === 'preset' ? stone.preset : `Custom ${stone.color}`,
        setting, mm(stRelief), mm(stDepth),
        (ring3DData.stoneNotes?.[stone.id] || []).map(n => n.text).join(' ')
      ]);

      if (stone.settingStyle === 'Halo') {
        const hSize = Number(stone.haloSize) || 1.0;
        const hData = getHaloData(stone.shape, w / 2, h / 2, hSize);
        const byColor = new Map();
        hData.stones.forEach((_, hIdx) => {
          const c = getHaloStoneColor(stone, hIdx);
          byColor.set(c, (byColor.get(c) || 0) + 1);
        });
        byColor.forEach((count, hex) => {
          rows.push([
            `Stone ${i + 1} halo`, count, 'Halo stone', 'Round Brilliant', `Ø ${mm(hSize)}`,
            stoneName(hex), `Halo around stone ${i + 1}`, '', '', ''
          ]);
        });
      }
    });

    rows.push([]);
    rows.push([`Generated by MikeyTime Ring Studio v${APP_VERSION}`]);
    const csv = [headers, ...rows].map(r => r.map(csvCell).join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    triggerDownload(blob, 'ring-bom.csv');
  };

  const svgWidthMM = 100;
  const svgHeightMM = 50;

  const getShapePath = (shape, hw, hh) => {
    switch(shape) {
      case 'Oval': return `M 0 ${-hh} A ${hw} ${hh} 0 1 1 0 ${hh} A ${hw} ${hh} 0 1 1 0 ${-hh}`;
      case 'Cushion': {
        const rx = hw * 0.4;
        return `M ${-hw+rx} ${-hh} H ${hw-rx} A ${rx} ${rx} 0 0 1 ${hw} ${-hh+rx} V ${hh-rx} A ${rx} ${rx} 0 0 1 ${hw-rx} ${hh} H ${-hw+rx} A ${rx} ${rx} 0 0 1 ${-hw} ${hh-rx} V ${-hh+rx} A ${rx} ${rx} 0 0 1 ${-hw+rx} ${-hh} Z`;
      }
      case 'Emerald': {
        const ce = hw * 0.3;
        return `M ${-hw+ce} ${-hh} L ${hw-ce} ${-hh} L ${hw} ${-hh+ce} L ${hw} ${hh-ce} L ${hw-ce} ${hh} L ${-hw+ce} ${hh} L ${-hw} ${hh-ce} L ${-hw} ${-hh+ce} Z`;
      }
      case 'Princess': return `M ${-hw} ${-hh} H ${hw} V ${hh} H ${-hw} Z`;
      case 'Hexagon': {
        const sx = hw * 0.866025;
        return `M 0 ${-hh} L ${sx} ${-hh*0.5} L ${sx} ${hh*0.5} L 0 ${hh} L ${-sx} ${hh*0.5} L ${-sx} ${-hh*0.5} Z`;
      }
      case 'Pear':
        return `M 0 ${-hh} C ${hw*1.15} ${-hh*0.1}, ${hw*1.15} ${hh}, 0 ${hh} C ${-hw*1.15} ${hh}, ${-hw*1.15} ${-hh*0.1}, 0 ${-hh} Z`;
      case 'Radiant': {
        const cr = hw * 0.2;
        return `M ${-hw+cr} ${-hh} L ${hw-cr} ${-hh} L ${hw} ${-hh+cr} L ${hw} ${hh-cr} L ${hw-cr} ${hh} L ${-hw+cr} ${hh} L ${-hw} ${hh-cr} L ${-hw} ${-hh+cr} Z`;
      }
      case 'Marquise':
        return `M 0 ${-hh} C ${hw*1.1} ${-hh*0.3}, ${hw*1.1} ${hh*0.3}, 0 ${hh} C ${-hw*1.1} ${hh*0.3}, ${-hw*1.1} ${-hh*0.3}, 0 ${-hh} Z`;
      case 'Asscher': {
        const ca = hw * 0.5;
        return `M ${-hw+ca} ${-hh} L ${hw-ca} ${-hh} L ${hw} ${-hh+ca} L ${hw} ${hh-ca} L ${hw-ca} ${hh} L ${-hw+ca} ${hh} L ${-hw} ${hh-ca} L ${-hw} ${-hh+ca} Z`;
      }
      case 'Heart':
      case 'Crescent Moon':
        // Same outline as the 3D model, so 2D and 3D always match.
        return pointsToSVGPath(getShapeOutlinePoints(shape, hw, hh, 240));
      case 'Round Brilliant':
      default: return `M 0 ${-hw} A ${hw} ${hw} 0 1 1 0 ${hw} A ${hw} ${hw} 0 1 1 0 ${-hw}`;
    }
  };

  const renderSetting = (stone, hw, hh, pSize, basePath) => {
    const { settingStyle: style, shape, bezelSize = 0.5, bezelColor = 'gold' } = stone;

    const mColorBand = METAL_COLORS[bandColor];
    const bandFill = isFlatBand ? mColorBand.flat : mColorBand.gradient;
    const mColorBezel = METAL_COLORS[bezelColor];
    const bezelFill = isFlatBand ? mColorBezel.flat : mColorBezel.gradient;
    const bezelOutline = isFlatBand ? mColorBezel.dark : 'none';

    if (style === 'Halo') {
      const hSize = stone.haloSize || 1.0;
      const hData = getHaloData(shape, hw, hh, hSize);
      const r = hSize / 2;
      const metalCenterLine = hData.stones.map(p => `${p.x},${p.y}`).join(' L ');

      return (
        <g>
          <path d={`M ${metalCenterLine} Z`} fill="none" stroke={bandFill} strokeWidth={hSize * 1.2} strokeLinejoin="round" filter={isFlatBand ? undefined : "url(#part-shadow)"} />
          {hData.stones.map((p, i) => {
            const fill = getHaloStoneColor(stone, i);
            return (
              <g key={i} transform={`translate(${p.x}, ${p.y})`}>
                <circle cx="0" cy="0" r={r} fill={fill} filter={isFlatBand ? undefined : "url(#part-shadow)"} />
                <circle cx="0" cy="0" r={r*0.7} fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth={r*0.1} />
                <circle cx="0" cy="0" r={r*0.3} fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth={r*0.1} />
              </g>
            );
          })}
        </g>
      );
    }

    if (style === 'Bezel') {
      const contourPts = getShapeOutlinePoints(shape, hw, hh, 96);
      const outerBezelPts = offsetPolygon2D(contourPts, bezelSize, shape);
      const outerBezelPath = pointsToSVGPath(outerBezelPts);
      const compoundBezelPath = `${outerBezelPath} ${basePath}`;

      return (
        <g>
          <path
            d={compoundBezelPath}
            fill={bezelFill}
            fillRule="evenodd"
            stroke={isFlatBand ? bezelOutline : 'none'}
            strokeWidth={isFlatBand ? 0.15 : 0}
            filter={isFlatBand ? undefined : "url(#drop-shadow)"}
          />
        </g>
      );
    }

    if (style === 'Flush') {
      return (
        <g>
          <path d={basePath} stroke="rgba(0,0,0,0.45)" strokeWidth={0.28} fill="none" />
          <path d={basePath} stroke={bandFill} strokeWidth={0.14} strokeDasharray="0.4,0.2" fill="none" />
        </g>
      );
    }

    if (style === '4-Prong' || style === '6-Prong') {
      const prongs = getProngPositions(style, shape, hw, hh);
      return prongs.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r={pSize} fill={bandFill} filter={isFlatBand ? undefined : "url(#part-shadow)"} />);
    }

    if (style === 'V-Prong') {
      const strokeW = Math.max(0.2, hw * 0.1);
      const vProngSpec = getVProngData(shape, hw, hh);
      return (
        <g>
          <g stroke={bandFill} strokeWidth={strokeW} fill="none" strokeLinejoin="miter" strokeLinecap="square" filter={isFlatBand ? undefined : "url(#part-shadow)"}>
            {vProngSpec.chevrons.map((c, i) => (
              <polyline key={`vchev-${i}`} points={`${c.a.x},${c.a.y} ${c.v.x},${c.v.y} ${c.b.x},${c.b.y}`} />
            ))}
          </g>
          {vProngSpec.roundProngs.map((p, i) => (
            <circle key={`vrnd-${i}`} cx={p.x} cy={p.y} r={pSize} fill={bandFill} filter={isFlatBand ? undefined : "url(#part-shadow)"} />
          ))}
        </g>
      );
    }
    return null;
  };

  const viewBoxWidth = svgWidthMM / zoom;
  const viewBoxHeight = svgHeightMM / zoom;
  const viewBoxX = -viewBoxWidth / 2;
  const viewBoxY = -viewBoxHeight / 2;
  const viewBottom = viewBoxHeight / 2;

  const rulerTicks = [];
  if (showRuler) {
    const startX = Math.floor(viewBoxX);
    const endX = Math.ceil(viewBoxX + viewBoxWidth);
    for (let i = startX - 2; i <= endX + 2; i++) {
      if (i < -(svgWidthMM/2) || i > (svgWidthMM/2)) continue;
      const isMajor = i % 10 === 0;
      const isMedium = i % 5 === 0;
      const height = (isMajor ? 3 : isMedium ? 2 : 1) * rulerScale;
      rulerTicks.push(
        <g key={`tick-${i}`}>
          <line x1={i} y1={viewBottom} x2={i} y2={viewBottom - height} stroke="rgba(0,0,0,0.4)" strokeWidth={0.2 * rulerScale} />
          {isMajor && (
            <text x={i} y={viewBottom - height - (0.5 * rulerScale)} fontSize={2.5 * rulerScale} textAnchor="middle" fill="rgba(0,0,0,0.5)" fontWeight="bold">
              {Math.abs(i)}
            </text>
          )}
        </g>
      );
    }
  }

  return (
    <div className="h-screen bg-gray-100 flex flex-col font-sans overflow-hidden">

      <div className="shrink-0 z-10 flex flex-col relative">
        {errorMessage && (
          <div role="alert" className="absolute top-full left-1/2 -translate-x-1/2 mt-3 px-4 py-2 bg-red-600 text-white text-sm font-semibold rounded-lg shadow-lg flex items-center gap-2 z-50">
            <AlertCircle className="w-4 h-4" /> {errorMessage}
          </div>
        )}

        <header className="bg-gray-900 text-white px-4 sm:px-6 py-2.5 flex flex-wrap items-center gap-x-4 gap-y-2">
          <div className="flex items-center gap-2.5 mr-auto">
            <span className="w-7 h-7 rounded-md bg-emerald-400/10 ring-1 ring-emerald-300/30 flex items-center justify-center">
              <Gem className="w-4 h-4 text-emerald-300" />
            </span>
            <h1 className="text-[15px] font-semibold tracking-tight">
              MikeyTime <span className="font-normal text-gray-400">Ring Studio</span>
            </h1>
            <span className="text-[10px] font-mono tabular text-gray-400 ring-1 ring-white/15 rounded px-1.5 py-0.5" title="App version">v{APP_VERSION}</span>
          </div>

          <div className="flex flex-wrap items-center gap-2">
            <div className="flex items-center rounded-md ring-1 ring-white/15 overflow-hidden divide-x divide-white/15">
              <button
                onClick={undo}
                disabled={historyCounts.undo === 0 && (historyRef.current.presentKey === null || designKey === historyRef.current.presentKey)}
                title="Undo (Ctrl/⌘+Z)"
                aria-label="Undo"
                className="flex items-center px-2.5 py-1.5 text-gray-200 hover:bg-white/10 disabled:opacity-35 disabled:hover:bg-transparent transition-colors"
              >
                <Undo2 className="w-3.5 h-3.5" />
              </button>
              <button
                onClick={redo}
                disabled={historyCounts.redo === 0}
                title="Redo (Ctrl/⌘+Shift+Z)"
                aria-label="Redo"
                className="flex items-center px-2.5 py-1.5 text-gray-200 hover:bg-white/10 disabled:opacity-35 disabled:hover:bg-transparent transition-colors"
              >
                <Redo2 className="w-3.5 h-3.5" />
              </button>
            </div>

            <div className="flex items-center rounded-md ring-1 ring-white/15 overflow-hidden divide-x divide-white/15">
              <button onClick={handleExportConfig} title="Save this design as a file" className="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-medium text-gray-200 hover:bg-white/10 transition-colors">
                <Download className="w-3.5 h-3.5" /> Save
              </button>
              <button onClick={() => fileInputRef.current?.click()} title="Load a saved design" className="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-medium text-gray-200 hover:bg-white/10 transition-colors">
                <Upload className="w-3.5 h-3.5" /> Load
              </button>
              <input type="file" accept=".txt" ref={fileInputRef} onChange={handleImportConfig} className="hidden" />
            </div>

            <div className="flex items-center rounded-md ring-1 ring-white/15 overflow-hidden divide-x divide-white/15">
              <button onClick={handleExportPNG} title="Export the 2D blueprint as a PNG image" className="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-medium text-gray-200 hover:bg-white/10 transition-colors">
                <ImageIcon className="w-3.5 h-3.5" /> PNG
              </button>
              <button onClick={handleExportSVG} title="Export the 2D blueprint as an SVG vector" className="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-medium text-gray-200 hover:bg-white/10 transition-colors">
                <FileCode2 className="w-3.5 h-3.5" /> SVG
              </button>
              <button onClick={handleExportCSV} title="Export the bill of materials as CSV" className="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-medium text-gray-200 hover:bg-white/10 transition-colors">
                <Table className="w-3.5 h-3.5" /> BOM
              </button>
            </div>

            <div className="flex items-center gap-1.5">
              <button
                onClick={handleExport3MF}
                title="Export a multi-object 3MF with named parts (OrcaSlicer, Bambu Studio, Anycubic)"
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-white/10 hover:bg-white/15 ring-1 ring-white/15 text-xs font-semibold text-white transition-colors"
              >
                <PackageCheck className="w-3.5 h-3.5" /> 3MF
              </button>
              <button
                onClick={handleExportSTL}
                title="Export a welded multi-shell STL (band with carved sockets plus each stone)"
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-emerald-500 hover:bg-emerald-400 text-xs font-semibold text-white shadow-sm transition-colors"
              >
                <Printer className="w-3.5 h-3.5" /> STL
              </button>
            </div>
          </div>
        </header>

        <section aria-label="Ring preview" className="bg-white border-b border-gray-200 shadow-[0_1px_0_rgba(23,25,30,0.04),0_8px_24px_-18px_rgba(23,25,30,0.35)] px-3 sm:px-6 pt-3 pb-2.5">
          <div className="max-w-5xl mx-auto flex flex-col gap-2.5">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div role="tablist" aria-label="Preview mode" className="inline-flex p-1 rounded-lg bg-gray-100 ring-1 ring-gray-200">
                {[
                  { id: '2d', label: '2D Blueprint', Icon: Compass },
                  { id: '3d', label: '3D Model', Icon: Box }
                ].map(({ id, label, Icon }) => (
                  <button
                    key={id}
                    role="tab"
                    aria-selected={canvasViewMode === id}
                    onClick={() => setCanvasViewMode(id)}
                    className={`flex items-center gap-1.5 px-3.5 py-1.5 rounded-md text-[13px] font-semibold transition-colors ${
                      canvasViewMode === id ? 'bg-gray-900 text-white shadow-sm' : 'text-gray-600 hover:text-gray-900 hover:bg-white'
                    }`}
                  >
                    <Icon className="w-4 h-4" /> {label}
                  </button>
                ))}
              </div>

              {canvasViewMode === '3d' ? (
                <div className="flex flex-wrap items-center gap-1.5">
                  <span className="text-[11px] font-medium uppercase tracking-wider text-gray-500 mr-0.5">Camera</span>
                  {[
                    { name: 'Crown', label: 'Top', args: [0, 0, 1.35] },
                    { name: '3/4', label: '3/4', args: [35, -22, 1.2] },
                    { name: 'Profile', label: 'Profile', args: [82, 0, 1.15] }
                  ].map(({ name, label, args }) => (
                    <button
                      key={name}
                      onClick={() => apply3DCameraPreset(name, ...args)}
                      className="px-2.5 py-1 rounded-md bg-white ring-1 ring-gray-200 hover:ring-gray-300 hover:bg-gray-50 text-xs font-medium text-gray-700 transition-colors"
                    >
                      {label}
                    </button>
                  ))}
                  <span className="w-px h-5 bg-gray-300 mx-1" aria-hidden="true" />
                  <button
                    aria-pressed={explode3DParts > 0}
                    onClick={() => setExplode3DParts(prev => (prev === 0 ? 1 : 0))}
                    title="Pull stones and settings away from the band to inspect the separate print parts"
                    className={`flex items-center gap-1.5 px-2.5 py-1 rounded-md text-xs font-semibold ring-1 transition-colors ${
                      explode3DParts > 0 ? 'bg-emerald-600 ring-emerald-600 text-white' : 'bg-white ring-gray-200 text-gray-700 hover:bg-gray-50'
                    }`}
                  >
                    <Layers className="w-3.5 h-3.5" /> {explode3DParts > 0 ? 'Exploded' : 'Explode parts'}
                  </button>
                </div>
              ) : (
                <div className="flex items-center gap-1.5">
                  <span className="text-[11px] font-medium uppercase tracking-wider text-gray-500 mr-0.5">Zoom</span>
                  <div className="flex items-center rounded-md bg-white ring-1 ring-gray-200 overflow-hidden divide-x divide-gray-200">
                    <button onClick={() => setZoom(z => Math.max(1, Number((Number(z) - 0.5).toFixed(2))))} aria-label="Zoom out" className="px-2.5 py-1 text-sm font-semibold text-gray-700 hover:bg-gray-50">−</button>
                    <span className="px-2 py-1 text-xs font-mono tabular text-gray-700 min-w-[3.25rem] text-center">{Number(zoom).toFixed(2)}×</span>
                    <button onClick={() => setZoom(z => Number((Number(z) + 0.5).toFixed(2)))} aria-label="Zoom in" className="px-2.5 py-1 text-sm font-semibold text-gray-700 hover:bg-gray-50">+</button>
                  </div>
                </div>
              )}
            </div>

            <div className="relative w-full flex justify-center">
          {canvasViewMode === '3d' && (
            <Ring3DPreviewCanvas
              shells={ring3DData.shells}
              externalCameraRequest={externalCameraRequest}
              explodeParts={explode3DParts}
            />
          )}
            {/* The blueprint stays on the page in 3D view (just hidden), so the
                PNG and SVG exports work from either view. */}
            <svg
              xmlns="http://www.w3.org/2000/svg"
              ref={svgRef}
              viewBox={`${viewBoxX} ${viewBoxY} ${viewBoxWidth} ${viewBoxHeight}`}
              className="w-full max-w-5xl h-auto bg-gray-50 ring-1 ring-gray-200 rounded-lg cursor-crosshair"
              style={{ maxHeight: '35vh', display: canvasViewMode === '3d' ? 'none' : undefined }}
              aria-hidden={canvasViewMode === '3d' ? true : undefined}
            >
              <defs>
                <pattern id="smallGrid" width="1" height="1" patternUnits="userSpaceOnUse" x="-50" y="-25">
                  <path d="M 1 0 L 0 0 0 1" fill="none" stroke="rgba(16, 185, 129, 0.1)" strokeWidth="0.05" />
                </pattern>
                <pattern id="largeGrid" width="10" height="10" patternUnits="userSpaceOnUse" x="-50" y="-25">
                  <rect width="10" height="10" fill="url(#smallGrid)" />
                  <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(16, 185, 129, 0.3)" strokeWidth="0.1" />
                </pattern>

                <linearGradient id="band-gold" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#c5a059" />
                  <stop offset="20%" stopColor="#f4e0a6" />
                  <stop offset="50%" stopColor="#d4af37" />
                  <stop offset="80%" stopColor="#8a6b1c" />
                  <stop offset="100%" stopColor="#c5a059" />
                </linearGradient>
                <linearGradient id="band-silver" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#b5b6b8" />
                  <stop offset="20%" stopColor="#ffffff" />
                  <stop offset="50%" stopColor="#e3e4e5" />
                  <stop offset="80%" stopColor="#8f9193" />
                  <stop offset="100%" stopColor="#b5b6b8" />
                </linearGradient>
                <linearGradient id="band-black" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#333333" />
                  <stop offset="20%" stopColor="#666666" />
                  <stop offset="50%" stopColor="#222222" />
                  <stop offset="80%" stopColor="#0a0a0a" />
                  <stop offset="100%" stopColor="#222222" />
                </linearGradient>

                <linearGradient id="band-dome-shade" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="rgba(0,0,0,0.30)" />
                  <stop offset="12%" stopColor="rgba(255,255,255,0.05)" />
                  <stop offset="32%" stopColor="rgba(255,255,255,0.42)" />
                  <stop offset="50%" stopColor="rgba(255,255,255,0.12)" />
                  <stop offset="78%" stopColor="rgba(0,0,0,0.12)" />
                  <stop offset="100%" stopColor="rgba(0,0,0,0.42)" />
                </linearGradient>

                <radialGradient id="gemShade" cx="30%" cy="30%" r="70%">
                  <stop offset="0%" stopColor="rgba(255,255,255,0.8)" />
                  <stop offset="40%" stopColor="rgba(255,255,255,0)" />
                  <stop offset="100%" stopColor="rgba(0,0,0,0.6)" />
                </radialGradient>

                <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
                  <feDropShadow dx="0" dy="0.5" stdDeviation="0.5" floodOpacity="0.4" />
                </filter>
                {/* Prongs, halo stones and claws are tiny next to the 0.5mm
                    blur above, so a +30% filter region clipped their shadow
                    into a visible square. This one leaves room for the blur. */}
                <filter id="part-shadow" x="-150%" y="-150%" width="400%" height="400%">
                  <feDropShadow dx="0" dy="0.18" stdDeviation="0.16" floodOpacity="0.35" />
                </filter>
              </defs>

              <rect x={-svgWidthMM/2} y={-svgHeightMM/2} width={svgWidthMM} height={svgHeightMM} fill="url(#largeGrid)" />

              <line x1={0} y1={-svgHeightMM/2} x2={0} y2={svgHeightMM/2} stroke="rgba(255,0,0,0.2)" strokeWidth="0.2" strokeDasharray="1,1" />
              <line x1={-svgWidthMM/2} y1={0} x2={svgWidthMM/2} y2={0} stroke="rgba(255,0,0,0.2)" strokeWidth="0.2" strokeDasharray="1,1" />

              <rect
                x={-svgWidthMM/2}
                y={-(Number(bandWidth) / 2)}
                width={svgWidthMM}
                height={Number(bandWidth) || 0}
                fill={isFlatBand ? METAL_COLORS[bandColor].flat : `url(#band-${bandColor})`}
                filter={isFlatBand ? undefined : "url(#drop-shadow)"}
              />

              {(() => {
                // Top-down shading for the band's cross-section, using the same
                // profile as the 3D model (light comes from the top of the view).
                const halfBW = (Number(bandWidth) || 0) / 2;
                const prof = getBandProfile(bandProfile, halfBW, Math.max(1.2, Number(bandThickness) || 1.8), bandProfileSize);
                const x0 = -svgWidthMM / 2;
                if (bandProfile === 'bevel') {
                  const b = prof.edge;
                  return (
                    <g>
                      {!isFlatBand && (
                        <>
                          <rect x={x0} y={-halfBW + b + 0.15} width={svgWidthMM} height={(halfBW - b) * 0.18} fill="rgba(255,255,255,0.35)" />
                          <rect x={x0} y={-halfBW} width={svgWidthMM} height={b} fill="rgba(255,255,255,0.32)" />
                          <rect x={x0} y={halfBW - b} width={svgWidthMM} height={b} fill="rgba(0,0,0,0.28)" />
                        </>
                      )}
                      <line x1={x0} x2={-x0} y1={-halfBW + b} y2={-halfBW + b} stroke={isFlatBand ? 'rgba(0,0,0,0.35)' : 'rgba(0,0,0,0.18)'} strokeWidth="0.06" />
                      <line x1={x0} x2={-x0} y1={halfBW - b} y2={halfBW - b} stroke={isFlatBand ? 'rgba(0,0,0,0.35)' : 'rgba(0,0,0,0.25)'} strokeWidth="0.06" />
                    </g>
                  );
                }
                if (bandProfile === 'round') {
                  return isFlatBand ? (
                    <g stroke="rgba(0,0,0,0.25)" strokeWidth="0.05" strokeDasharray="0.6,0.4">
                      <line x1={x0} x2={-x0} y1={-halfBW * 0.6} y2={-halfBW * 0.6} />
                      <line x1={x0} x2={-x0} y1={halfBW * 0.6} y2={halfBW * 0.6} />
                    </g>
                  ) : (
                    <rect x={x0} y={-halfBW} width={svgWidthMM} height={halfBW * 2} fill="url(#band-dome-shade)" />
                  );
                }
                return !isFlatBand && (
                  <>
                    <rect x={x0} y={-halfBW + 0.2} width={svgWidthMM} height={halfBW * 2 * 0.1} fill="rgba(255,255,255,0.4)" />
                    <rect x={x0} y={halfBW - (halfBW * 2 * 0.15)} width={svgWidthMM} height={halfBW * 2 * 0.1} fill="rgba(0,0,0,0.2)" />
                  </>
                );
              })()}

              {renderedStones.map((stone) => {
                const w = Number(stone.width) || 0;
                const shape = stone.shape || 'Round Brilliant';
                const ratio = SHAPE_RATIOS[shape] || 1;
                const h = w * ratio;
                const hw = w / 2;
                const hh = h / 2;
                const rotation = Number(stone.rotation) || 0;

                const basePath = getShapePath(shape, hw, hh);
                const pSize = hw * 0.15;

                return (
                  <g
                    key={`stone-svg-${stone.id}`}
                    transform={`translate(${stone.x}, ${stone.y})`}
                    filter={isFlatBand ? undefined : "url(#drop-shadow)"}
                  >
                    <g transform={`rotate(${rotation})`}>
                      <path d={basePath} fill={stone.color} />
                      {(() => {
                        const facets = getFacetGeometry(shape, hw, hh);
                        const lineW = Math.min(hw, hh) * 0.025;
                        return (
                          <g stroke="rgba(255,255,255,0.5)" strokeWidth={lineW} fill="none" strokeLinejoin="round" clipPath={`url(#facet-clip-${stone.id})`}>
                            <clipPath id={`facet-clip-${stone.id}`}><path d={basePath} /></clipPath>
                            <path d={pointsToSVGPath(facets.girdle)} strokeWidth={lineW * 0.7} />
                            {facets.rings.map((ring, i) => <path key={`ring-${i}`} d={pointsToSVGPath(ring)} />)}
                            <path d={pointsToSVGPath(facets.table)} fill="rgba(255,255,255,0.12)" />
                            {facets.lines.map(([p1, p2], i) => (
                              <line key={`facet-${i}`} x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} />
                            ))}
                          </g>
                        );
                      })()}
                      {stone.settingStyle && stone.settingStyle !== 'None' && renderSetting(stone, hw, hh, pSize, basePath)}
                    </g>

                    <g clipPath={`url(#clip-${stone.id})`}>
                      <rect x={-hw * 2} y={-hh * 2} width={hw * 4} height={hh * 4} fill="url(#gemShade)" pointerEvents="none" />
                    </g>
                    <clipPath id={`clip-${stone.id}`}>
                      <path d={basePath} transform={`rotate(${rotation})`} />
                    </clipPath>
                  </g>
                );
              })}

              <g id="measurements">
                {showVertical && renderedStones.map((stone) => {
                  const targetY = verticalFrom === 'top' ? -(Number(bandWidth) / 2) : (Number(bandWidth) / 2);
                  const startY = stone.y;
                  const endY = targetY;
                  const midY = (startY + endY) / 2;
                  const dist = Math.abs(startY - endY);
                  const textStr = `${dist.toFixed(1)}mm`;
                  const boxW = textStr.length * (measTextSize * 0.62) + 0.4;
                  const boxH = measTextSize * 1.45 + 0.2;

                  return (
                    <g key={`v-meas-${stone.id}`}>
                      <line x1={stone.x} y1={startY} x2={stone.x} y2={endY} stroke="#ec4899" strokeWidth="0.08" strokeDasharray="0.5,0.5" />
                      <line x1={stone.x - 0.5} y1={endY} x2={stone.x + 0.5} y2={endY} stroke="#ec4899" strokeWidth="0.08" />
                      <line x1={stone.x - 0.5} y1={startY} x2={stone.x + 0.5} y2={startY} stroke="#ec4899" strokeWidth="0.08" />
                      <rect x={stone.x - boxW/2} y={midY - boxH/2} width={boxW} height={boxH} fill="rgba(255,255,255,0.9)" stroke="#fbcfe8" strokeWidth="0.04" rx="0.25" />
                      <text x={stone.x} y={midY + (measTextSize * 0.35)} fontSize={measTextSize} textAnchor="middle" fill="#ec4899" fontWeight="bold">
                        {textStr}
                      </text>
                    </g>
                  );
                })}

                {showWidth && (() => {
                  const maxY = renderedStones.length > 0 ? Math.max(...renderedStones.map(s => s.y + (s.width * (SHAPE_RATIOS[s.shape] || 1)) / 2)) : 0;
                  const bandBottom = Number(bandWidth) / 2;
                  const widthMeasY = Math.max(bandBottom, maxY) + 3.2;

                  const widthItems = renderedStones.map(stone => {
                    const textStr = `${stone.width.toFixed(1)}mm`;
                    const boxW = textStr.length * (measTextSize * 0.62) + 0.4;
                    const spanW = Math.max(stone.width, boxW);
                    return {
                      ...stone,
                      textStr,
                      boxW,
                      boxH: measTextSize * 1.45 + 0.2,
                      leftX: stone.x - spanW / 2,
                      rightX: stone.x + spanW / 2,
                      gemBottom: stone.y + (stone.width * (SHAPE_RATIOS[stone.shape] || 1)) / 2
                    };
                  }).sort((a, b) => a.x - b.x);

                  const tiers = [];
                  widthItems.forEach(item => {
                    let placed = false;
                    for (let t = 0; t < tiers.length; t++) {
                      if (item.leftX > tiers[t] + (measTextSize * 0.9)) {
                        item.tier = t;
                        tiers[t] = item.rightX;
                        placed = true;
                        break;
                      }
                    }
                    if (!placed) {
                      item.tier = tiers.length;
                      tiers.push(item.rightX);
                    }
                  });

                  return widthItems.map(item => {
                    const yPos = widthMeasY + (item.tier * (measTextSize * 2.2 + 0.9));
                    const extLeftX = item.x - item.width / 2;
                    const extRightX = item.x + item.width / 2;

                    return (
                      <g key={`w-meas-${item.id}`}>
                        <line x1={extLeftX} y1={yPos} x2={extRightX} y2={yPos} stroke="#10b981" strokeWidth="0.08" strokeDasharray="0.8,0.8" />
                        <line x1={extLeftX} y1={yPos - 0.8} x2={extLeftX} y2={yPos + 0.8} stroke="#10b981" strokeWidth="0.08" />
                        <line x1={extRightX} y1={yPos - 0.8} x2={extRightX} y2={yPos + 0.8} stroke="#10b981" strokeWidth="0.08" />

                        <line x1={extLeftX} y1={item.gemBottom} x2={extLeftX} y2={yPos} stroke="#10b981" strokeWidth="0.05" strokeDasharray="0.4,0.4" opacity="0.55" />
                        <line x1={extRightX} y1={item.gemBottom} x2={extRightX} y2={yPos} stroke="#10b981" strokeWidth="0.05" strokeDasharray="0.4,0.4" opacity="0.55" />

                        <rect x={item.x - item.boxW/2} y={yPos - item.boxH/2} width={item.boxW} height={item.boxH} fill="rgba(255,255,255,0.92)" stroke="#a7f3d0" strokeWidth="0.04" rx="0.25" />
                        <text x={item.x} y={yPos + (measTextSize * 0.35)} fontSize={measTextSize} textAnchor="middle" fill="#10b981" fontWeight="bold">
                          {item.textStr}
                        </text>
                      </g>
                    );
                  });
                })()}

                {showSeparation && (() => {
                  const sortedStones = [...renderedStones].sort((a, b) => a.x - b.x);
                  const gapItems = [];

                  for (let i = 0; i < sortedStones.length - 1; i++) {
                    const s1 = sortedStones[i];
                    const s2 = sortedStones[i+1];
                    const rightEdge1 = s1.x + s1.width / 2;
                    const leftEdge2 = s2.x - s2.width / 2;
                    const gap = leftEdge2 - rightEdge1;
                    const midX = (rightEdge1 + leftEdge2) / 2;

                    const y1 = s1.y - (s1.width * (SHAPE_RATIOS[s1.shape] || 1)) / 2;
                    const y2 = s2.y - (s2.width * (SHAPE_RATIOS[s2.shape] || 1)) / 2;
                    const baseMidY = Math.min(y1, y2) - 3.2;

                    const textStr = `${gap.toFixed(1)}mm`;
                    const boxW = textStr.length * (measTextSize * 0.62) + 0.4;
                    const boxH = measTextSize * 1.45 + 0.2;
                    const spanW = Math.max(gap, boxW);

                    if (gap > 0.01) {
                      gapItems.push({
                        id: `gap-${i}`, rightEdge1, leftEdge2, midX, baseMidY,
                        textStr, boxW, boxH, s1, s2, gap,
                        leftX: midX - spanW / 2, rightX: midX + spanW / 2
                      });
                    }
                  }

                  const tiers = [];
                  gapItems.forEach(item => {
                    let placed = false;
                    for (let t = 0; t < tiers.length; t++) {
                      if (item.leftX > tiers[t] + (measTextSize * 0.9)) {
                        item.tier = t;
                        tiers[t] = item.rightX;
                        placed = true;
                        break;
                      }
                    }
                    if (!placed) {
                      item.tier = tiers.length;
                      tiers.push(item.rightX);
                    }
                  });

                  return gapItems.map(item => {
                    const midY = item.baseMidY - (item.tier * (measTextSize * 2.2 + 0.9));
                    return (
                      <g key={item.id}>
                        <line x1={item.rightEdge1} y1={midY} x2={item.leftEdge2} y2={midY} stroke="#0ea5e9" strokeWidth="0.08" strokeDasharray="0.8,0.8" />
                        <line x1={item.rightEdge1} y1={midY - 0.8} x2={item.rightEdge1} y2={midY + 0.8} stroke="#0ea5e9" strokeWidth="0.08" />
                        <line x1={item.leftEdge2} y1={midY - 0.8} x2={item.leftEdge2} y2={midY + 0.8} stroke="#0ea5e9" strokeWidth="0.08" />

                        <line x1={item.rightEdge1} y1={midY} x2={item.rightEdge1} y2={item.s1.y} stroke="#0ea5e9" strokeWidth="0.05" strokeDasharray="0.4,0.4" opacity="0.6" />
                        <line x1={item.leftEdge2} y1={midY} x2={item.leftEdge2} y2={item.s2.y} stroke="#0ea5e9" strokeWidth="0.05" strokeDasharray="0.4,0.4" opacity="0.6" />

                        <rect x={item.midX - item.boxW/2} y={midY - item.boxH/2} width={item.boxW} height={item.boxH} fill="rgba(255,255,255,0.92)" stroke="#bae6fd" strokeWidth="0.04" rx="0.25" />
                        <text x={item.midX} y={midY + (measTextSize * 0.35)} fontSize={measTextSize} textAnchor="middle" fill="#0ea5e9" fontWeight="bold">
                          {item.textStr}
                        </text>
                      </g>
                    );
                  });
                })()}
              </g>

              {showRuler && (
                <g transform={`translate(0, ${rulerOffset})`}>
                  <rect x={viewBoxX} y={viewBottom - (7 * rulerScale)} width={viewBoxWidth} height={7 * rulerScale} fill="rgba(255,255,255,0.75)" />
                  <line x1={viewBoxX} y1={viewBottom - 0.1} x2={viewBoxX + viewBoxWidth} y2={viewBottom - 0.1} stroke="rgba(0,0,0,0.3)" strokeWidth={0.2 * rulerScale} />
                  {rulerTicks}
                </g>
              )}
            </svg>
            </div>

            <div className="flex flex-wrap items-center gap-x-4 gap-y-1 px-1 text-[11px] text-gray-500">
              <span className="font-mono tabular">US {ringSize}</span>
              <span className="font-mono tabular">Bore Ø {ring3DData.innerDiameter.toFixed(2)} mm</span>
              <span className="font-mono tabular">Outer Ø {ring3DData.outerDiameter.toFixed(2)} mm</span>
              <span className="font-mono tabular">Band {Number(bandWidth).toFixed(2)} × {Number(bandThickness).toFixed(1)} mm{bandProfile !== 'flat' ? ` · ${BAND_PROFILES.find(bp => bp.id === bandProfile)?.label.toLowerCase()}` : ''}</span>
              <span className="font-mono tabular">{stones.length} {stones.length === 1 ? 'stone' : 'stones'} · {ring3DData.shells.length} print parts</span>
              <span className="sm:ml-auto text-gray-400">
                {canvasViewMode === '3d' ? 'Drag to rotate · scroll to zoom' : 'Grid: 1 mm minor, 10 mm major'}
              </span>
            </div>
          </div>
        </section>
      </div>

      <div className="flex-1 overflow-y-auto p-4 sm:p-6 scroll-smooth">
        <div className="max-w-7xl mx-auto space-y-6">

          <section className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden transition-all">
            <div
              onClick={() => setIsGlobalSettingsOpen(prev => !prev)}
              className="flex flex-col md:flex-row md:items-center justify-between px-5 py-3.5 bg-white hover:bg-gray-50/80 cursor-pointer select-none border-b border-gray-100 gap-3 transition-colors"
            >
              <div className="flex flex-wrap items-center gap-3">
                <div className="flex items-center gap-2">
                  <Layers className="w-5 h-5 text-emerald-500" />
                  <h2 className="text-[15px] font-semibold text-gray-900">
                    Band &amp; Blueprint
                  </h2>
                </div>
                <div className="flex flex-wrap items-center gap-1.5">
                  <span className="text-[11px] font-mono tabular text-gray-600 bg-gray-100 border border-gray-200 px-2 py-0.5 rounded-md capitalize flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full ring-1 ring-black/10" style={{ backgroundColor: METAL_COLORS[bandColor]?.hex }} />
                    {bandColor}
                  </span>
                  <span className="text-[11px] font-mono tabular text-gray-600 bg-gray-100 border border-gray-200 px-2 py-0.5 rounded-md">{bandWidth} mm band</span>
                </div>
              </div>

              <div className="flex items-center justify-between md:justify-end gap-3" onClick={(e) => e.stopPropagation()}>
                <button
                  onClick={() => setIsGlobalSettingsOpen(prev => !prev)}
                  className="flex items-center gap-1 text-xs font-bold text-gray-500 hover:text-emerald-600 bg-gray-100 hover:bg-emerald-50 border border-gray-200 hover:border-emerald-200 px-2.5 py-1.5 rounded-lg transition-colors"
                >
                  <span>{isGlobalSettingsOpen ? 'Hide' : 'Show'}</span>
                  {isGlobalSettingsOpen ? <ChevronUp className="w-4 h-4" /> : <ChevronDown className="w-4 h-4" />}
                </button>
              </div>
            </div>

            {isGlobalSettingsOpen && (
              <div className="p-5 grid grid-cols-1 md:grid-cols-3 gap-6 items-start bg-white">
                <div className="md:pr-6 md:border-r border-gray-100 flex flex-col gap-3.5">
                  <div>
                    <label className="text-[11px] font-semibold uppercase tracking-wider text-gray-500 block mb-2">Metal</label>
                    <div className="flex gap-2">
                      {['gold', 'silver', 'black'].map((metal) => (
                        <button
                          key={metal}
                          onClick={() => setBandColor(metal)}
                          className={`flex-1 py-1.5 px-3 rounded-md font-medium text-sm capitalize transition-all border-2 ${
                            bandColor === metal
                              ? 'border-emerald-600 bg-emerald-50 text-emerald-700 shadow-sm'
                              : 'border-gray-200 bg-white text-gray-600 hover:border-gray-300 hover:bg-gray-50'
                          }`}
                        >
                          <span className="inline-flex items-center justify-center gap-1.5">
                            <span className="w-2.5 h-2.5 rounded-full ring-1 ring-black/10" style={{ backgroundColor: METAL_COLORS[metal]?.hex }} />
                            {metal}
                          </span>
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="flex items-center justify-between bg-gray-50 p-2.5 rounded-lg border border-gray-200">
                    <label className="text-xs font-bold text-gray-700 cursor-pointer select-none" htmlFor="flat-band">
                      Flat Band (No 3D/Shadow)
                    </label>
                    <input
                      id="flat-band"
                      type="checkbox"
                      checked={isFlatBand}
                      onChange={(e) => setIsFlatBand(e.target.checked)}
                      className="w-4 h-4 text-emerald-600 bg-white border-gray-300 rounded focus:ring-emerald-500 cursor-pointer"
                    />
                  </div>

                  <div className="flex items-center justify-between bg-gray-50 p-2.5 rounded-lg border border-gray-200">
                    <label className="text-xs font-bold text-gray-700 cursor-pointer select-none" htmlFor="show-bottom-ruler">
                      Show Bottom Ruler
                    </label>
                    <input
                      id="show-bottom-ruler"
                      type="checkbox"
                      checked={showRuler}
                      onChange={(e) => setShowRuler(e.target.checked)}
                      className="w-4 h-4 text-emerald-600 bg-white border-gray-300 rounded focus:ring-emerald-500 cursor-pointer"
                    />
                  </div>
                </div>

                <div className="md:pr-6 md:border-r border-gray-100 flex flex-col gap-3">
                  <label className="text-[11px] font-semibold uppercase tracking-wider text-gray-500 border-b border-gray-200 pb-1.5">
                    Band &amp; Viewport Dimensions
                  </label>
                  <ControlSlider label="Band Width" icon={ArrowUpDown} value={bandWidth} min={1} max={10} step={0.25} onChange={setBandWidth} />
                  <ControlSlider label="Canvas Zoom" icon={ZoomIn} value={zoom} min={1} max={10} step={0.25} onChange={setZoom} unit="x" />
                  {showRuler && (
                    <div className="bg-gray-50 p-2.5 rounded-lg border border-gray-200 flex flex-col gap-2">
                      <ControlSlider label="Ruler Scale" value={rulerScale} min={0.4} max={2.5} step={0.1} onChange={setRulerScale} unit="x" />
                      <ControlSlider label="Ruler Offset" value={rulerOffset} min={-15} max={15} step={0.5} onChange={setRulerOffset} unit="mm" />
                    </div>
                  )}
                </div>

                <div className="flex flex-col gap-3">
                  <label className="text-[11px] font-semibold uppercase tracking-wider text-gray-500 border-b border-gray-200 pb-1.5">
                    Measurement Overlays
