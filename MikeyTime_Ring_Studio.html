  const getShapePath = (shape, hw, hh) => {
    switch(shape) {
      case 'Oval': return `M 0 ${-hh} A ${hw} ${hh} 0 1 1 0 ${hh} A ${hw} ${hh} 0 1 1 0 ${-hh}`;
      case 'Cushion': {
        const rx = hw * 0.4;
        return `M ${-hw+rx} ${-hh} H ${hw-rx} A ${rx} ${rx} 0 0 1 ${hw} ${-hh+rx} V ${hh-rx} A ${rx} ${rx} 0 0 1 ${hw-rx} ${hh} H ${-hw+rx} A ${rx} ${rx} 0 0 1 ${-hw} ${hh-rx} V ${-hh+rx} A ${rx} ${rx} 0 0 1 ${-hw+rx} ${-hh} Z`;
      }
      case 'Emerald': {
        const ce = hw * 0.3;
        return `M ${-hw+ce} ${-hh} L ${hw-ce} ${-hh} L ${hw} ${-hh+ce} L ${hw} ${hh-ce} L ${hw-ce} ${hh} L ${-hw+ce} ${hh} L ${-hw} ${hh-ce} L ${-hw} ${-hh+ce} Z`;
      }
      case 'Princess': return `M ${-hw} ${-hh} H ${hw} V ${hh} H ${-hw} Z`;
      case 'Hexagon': {
        const sx = hw * 0.866025;
        return `M 0 ${-hh} L ${sx} ${-hh*0.5} L ${sx} ${hh*0.5} L 0 ${hh} L ${-sx} ${hh*0.5} L ${-sx} ${-hh*0.5} Z`;
      }
      case 'Pear':
        return `M 0 ${-hh} C ${hw*1.15} ${-hh*0.1}, ${hw*1.15} ${hh}, 0 ${hh} C ${-hw*1.15} ${hh}, ${-hw*1.15} ${-hh*0.1}, 0 ${-hh} Z`;
      case 'Radiant': {
        const cr = hw * 0.2;
        return `M ${-hw+cr} ${-hh} L ${hw-cr} ${-hh} L ${hw} ${-hh+cr} L ${hw} ${hh-cr} L ${hw-cr} ${hh} L ${-hw+cr} ${hh} L ${-hw} ${hh-cr} L ${-hw} ${-hh+cr} Z`;
      }
      case 'Marquise':
        return `M 0 ${-hh} C ${hw*1.1} ${-hh*0.3}, ${hw*1.1} ${hh*0.3}, 0 ${hh} C ${-hw*1.1} ${hh*0.3}, ${-hw*1.1} ${-hh*0.3}, 0 ${-hh} Z`;
      case 'Asscher': {
        const ca = hw * 0.5;
        return `M ${-hw+ca} ${-hh} L ${hw-ca} ${-hh} L ${hw} ${-hh+ca} L ${hw} ${hh-ca} L ${hw-ca} ${hh} L ${-hw+ca} ${hh} L ${-hw} ${hh-ca} L ${-hw} ${-hh+ca} Z`;
      }
      case 'Heart':
        return `M 0 ${-hh*0.2} C ${hw*1.2} ${-hh*1.2}, ${hw*1.2} ${hh*0.4}, 0 ${hh} C ${-hw*1.2} ${hh*0.4}, ${-hw*1.2} ${-hh*1.2}, 0 ${-hh*0.2} Z`;
      case 'Crescent Moon':
        return `M ${-hw*0.25} ${-hh} A ${hw} ${hh} 0 0 1 ${-hw*0.25} ${hh} A ${hw*0.5} ${hh} 0 0 0 ${-hw*0.25} ${-hh} Z`;
      case 'Round Brilliant':
      default: return `M 0 ${-hw} A ${hw} ${hw} 0 1 1 0 ${hw} A ${hw} ${hw} 0 1 1 0 ${-hw}`;
    }
  };

  const renderSetting = (stone, hw, hh, pSize, basePath) => {
    const { settingStyle: style, shape, bezelSize = 0.5, bezelColor = 'gold' } = stone;

    const mColorBand = METAL_COLORS[bandColor];
    const bandFill = isFlatBand ? mColorBand.flat : mColorBand.gradient;
    const mColorBezel = METAL_COLORS[bezelColor];
    const bezelFill = isFlatBand ? mColorBezel.flat : mColorBezel.gradient;
    const bezelOutline = isFlatBand ? mColorBezel.dark : 'none';

    if (style === 'Halo') {
      const hSize = stone.haloSize || 1.0;
      const hData = getHaloData(shape, hw, hh, hSize);
      const r = hSize / 2;
      const metalCenterLine = hData.stones.map(p => `${p.x},${p.y}`).join(' L ');

      return (
        <g>
          <path d={`M ${metalCenterLine} Z`} fill="none" stroke={bandFill} strokeWidth={hSize * 1.2} strokeLinejoin="round" filter={isFlatBand ? undefined : "url(#drop-shadow)"} />
          {hData.stones.map((p, i) => {
            const fill = stone.haloOverrides?.[i] || stone.haloColor || '#fbfbfb';
            return (
              <g key={i} transform={`translate(${p.x}, ${p.y})`}>
                <circle cx="0" cy="0" r={r} fill={fill} filter={isFlatBand ? undefined : "url(#drop-shadow)"} />
                <circle cx="0" cy="0" r={r*0.7} fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth={r*0.1} />
                <circle cx="0" cy="0" r={r*0.3} fill="none" stroke="rgba(255,255,255,0.4)" strokeWidth={r*0.1} />
              </g>
            );
          })}
        </g>
      );
    }

    if (style === 'Bezel') {
      const contourPts = getShapeOutlinePoints(shape, hw, hh, 96);
      const outerBezelPts = offsetPolygon2D(contourPts, bezelSize, shape);
      const outerBezelPath = pointsToSVGPath(outerBezelPts);
      const compoundBezelPath = `${outerBezelPath} ${basePath}`;

      return (
        <g>
          <path
            d={compoundBezelPath}
            fill={bezelFill}
            fillRule="evenodd"
            stroke={isFlatBand ? bezelOutline : 'none'}
            strokeWidth={isFlatBand ? 0.15 : 0}
            filter={isFlatBand ? undefined : "url(#drop-shadow)"}
          />
        </g>
      );
    }

    if (style === 'Flush') {
      return (
        <g>
          <path d={basePath} stroke="rgba(0,0,0,0.45)" strokeWidth={0.28} fill="none" />
          <path d={basePath} stroke={bandFill} strokeWidth={0.14} strokeDasharray="0.4,0.2" fill="none" />
        </g>
      );
    }

    if (style === '4-Prong' || style === '6-Prong') {
      const prongs = getProngPositions(style, shape, hw, hh);
      return prongs.map((p, i) => <circle key={i} cx={p.x} cy={p.y} r={pSize} fill={bandFill} filter={isFlatBand ? undefined : "url(#drop-shadow)"} />);
    }

    if (style === 'V-Prong') {
      const strokeW = Math.max(0.2, hw * 0.1);
      const vProngSpec = getVProngData(shape, hw, hh);
      return (
        <g>
          <g stroke={bandFill} strokeWidth={strokeW} fill="none" strokeLinejoin="miter" strokeLinecap="square" filter={isFlatBand ? undefined : "url(#drop-shadow)"}>
            {vProngSpec.chevrons.map((c, i) => (
              <polyline key={`vchev-${i}`} points={`${c.a.x},${c.a.y} ${c.v.x},${c.v.y} ${c.b.x},${c.b.y}`} />
            ))}
          </g>
          {vProngSpec.roundProngs.map((p, i) => (
            <circle key={`vrnd-${i}`} cx={p.x} cy={p.y} r={pSize} fill={bandFill} filter={isFlatBand ? undefined : "url(#drop-shadow)"} />
          ))}
        </g>
      );
    }
    return null;
  };

  const viewBoxWidth = svgWidthMM / zoom;
  const viewBoxHeight = svgHeightMM / zoom;
  const viewBoxX = -viewBoxWidth / 2;
  const viewBoxY = -viewBoxHeight / 2;
  const viewBottom = viewBoxHeight / 2;

  const rulerTicks = [];
  if (showRuler) {
    const startX = Math.floor(viewBoxX);
    const endX = Math.ceil(viewBoxX + viewBoxWidth);
    for (let i = startX - 2; i <= endX + 2; i++) {
      if (i < -(svgWidthMM/2) || i > (svgWidthMM/2)) continue;
      const isMajor = i % 10 === 0;
      const isMedium = i % 5 === 0;
      const height = (isMajor ? 3 : isMedium ? 2 : 1) * rulerScale;
      rulerTicks.push(
        <g key={`tick-${i}`}>
          <line x1={i} y1={viewBottom} x2={i} y2={viewBottom - height} stroke="rgba(0,0,0,0.4)" strokeWidth={0.2 * rulerScale} />
          {isMajor && (
            <text x={i} y={viewBottom - height - (0.5 * rulerScale)} fontSize={2.5 * rulerScale} textAnchor="middle" fill="rgba(0,0,0,0.5)" fontWeight="bold">
              {Math.abs(i)}
            </text>
          )}
        </g>
      );
    }
  }

  return (
    <div className="h-screen bg-gray-100 flex flex-col font-sans overflow-hidden">

      <div className="bg-white shadow-md z-10 shrink-0 border-b border-gray-200 flex flex-col relative">
        {errorMessage && (
          <div className="absolute top-full left-1/2 -translate-x-1/2 mt-4 px-4 py-2 bg-red-600 text-white text-sm font-bold rounded shadow-lg flex items-center gap-2 z-50 animate-bounce">
            <AlertCircle className="w-4 h-4" /> {errorMessage}
          </div>
        )}
        <div className="px-4 sm:px-6 py-3 flex flex-wrap justify-between items-center bg-purple-950 text-white gap-3">
          <div className="flex items-center gap-3">
            <Gem className="w-6 h-6 text-emerald-400" />
            <h1 className="text-base sm:text-lg font-bold tracking-wide">MikeyTime Ring Studio</h1>
          </div>

          <div className="flex bg-purple-900/90 p-1 rounded-lg border border-purple-800">
            <button
              onClick={() => setCanvasViewMode('2d')}
              className={`flex items-center gap-1.5 px-3 py-1 rounded-md text-xs font-bold transition-all ${
                canvasViewMode === '2d' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-purple-200 hover:text-white'
              }`}
            >
              <Compass className="w-3.5 h-3.5" /> 2D Blueprint
            </button>
            <button
              onClick={() => setCanvasViewMode('3d')}
              className={`flex items-center gap-1.5 px-3 py-1 rounded-md text-xs font-bold transition-all ${
                canvasViewMode === '3d' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-purple-200 hover:text-white'
              }`}
            >
              <Box className="w-3.5 h-3.5" /> 3D Ring Preview ({ring3DData.shells.length} Shells)
            </button>
          </div>

          <div className="flex flex-wrap items-center gap-2 ml-auto">
            <button
              onClick={handleExportSTL}
              title="Export Welded Multi-Shell STL (1 Band with Carved Sockets + Individual Gems)"
              className="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold shadow transition-colors"
            >
              <Printer className="w-3.5 h-3.5" />
              <span>3D STL</span>
            </button>

            <button
              onClick={handleExport3MF}
              title="Export Native Multi-Object 3MF (Pre-Named Objects for OrcaSlicer / Bambu / Anycubic)"
              className="flex items-center gap-1.5 px-3 py-1.5 rounded-md bg-cyan-400 hover:bg-cyan-300 text-slate-950 text-xs font-bold shadow transition-colors"
            >
              <PackageCheck className="w-3.5 h-3.5" />
              <span>3D 3MF</span>
            </button>

            <div className="flex bg-purple-900 rounded-md border border-purple-800 overflow-hidden divide-x divide-purple-800">
              <button onClick={handleExportPNG} title="Export as PNG Image" className="flex items-center gap-1.5 px-2.5 py-1.5 hover:bg-purple-800 text-xs font-semibold transition-colors">
                <ImageIcon className="w-3.5 h-3.5" /> <span className="hidden lg:inline">PNG</span>
              </button>
              <button onClick={handleExportSVG} title="Export as SVG Vector" className="flex items-center gap-1.5 px-2.5 py-1.5 hover:bg-purple-800 text-xs font-semibold transition-colors">
                <FileCode2 className="w-3.5 h-3.5" /> <span className="hidden lg:inline">SVG</span>
              </button>
              <button onClick={handleExportCSV} title="Export Bill of Materials (CSV)" className="flex items-center gap-1.5 px-2.5 py-1.5 hover:bg-purple-800 text-xs font-semibold transition-colors">
                <Table className="w-3.5 h-3.5" /> <span className="hidden lg:inline">BOM</span>
              </button>
            </div>

            <div className="flex bg-purple-900 rounded-md border border-purple-800 overflow-hidden divide-x divide-purple-800">
              <button onClick={handleExportConfig} className="flex items-center gap-1.5 px-2.5 py-1.5 hover:bg-purple-800 text-xs font-semibold transition-colors">
                <Download className="w-3.5 h-3.5" /> <span className="hidden md:inline">Save</span>
              </button>
              <button onClick={() => fileInputRef.current?.click()} className="flex items-center gap-1.5 px-2.5 py-1.5 hover:bg-purple-800 text-xs font-semibold transition-colors">
                <Upload className="w-3.5 h-3.5" /> <span className="hidden md:inline">Load</span>
              </button>
              <input type="file" accept=".txt" ref={fileInputRef} onChange={handleImportConfig} className="hidden" />
            </div>
          </div>
        </div>

        <div className="w-full bg-slate-50 relative flex justify-center items-center py-4 px-4 shadow-inner overflow-hidden">
          {canvasViewMode === '3d' ? (
            <Ring3DPreviewCanvas
              shells={ring3DData.shells}
              innerDiameter={ring3DData.innerDiameter}
              outerDiameter={ring3DData.outerDiameter}
              onExportSTL={handleExportSTL}
              onExport3MF={handleExport3MF}
              externalCameraRequest={externalCameraRequest}
              explodeParts={explode3DParts}
              setExplodeParts={setExplode3DParts}
            />
          ) : (
            <svg
              xmlns="http://www.w3.org/2000/svg"
              ref={svgRef}
              viewBox={`${viewBoxX} ${viewBoxY} ${viewBoxWidth} ${viewBoxHeight}`}
              className="w-full max-w-5xl h-auto drop-shadow-2xl bg-white border border-gray-300 rounded shadow-xl transition-all duration-300 ease-out cursor-crosshair"
              style={{ maxHeight: '35vh' }}
            >
              <defs>
                <pattern id="smallGrid" width="1" height="1" patternUnits="userSpaceOnUse" x="-50" y="-25">
                  <path d="M 1 0 L 0 0 0 1" fill="none" stroke="rgba(16, 185, 129, 0.1)" strokeWidth="0.05" />
                </pattern>
                <pattern id="largeGrid" width="10" height="10" patternUnits="userSpaceOnUse" x="-50" y="-25">
                  <rect width="10" height="10" fill="url(#smallGrid)" />
                  <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(16, 185, 129, 0.3)" strokeWidth="0.1" />
                </pattern>

                <linearGradient id="band-gold" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#c5a059" />
                  <stop offset="20%" stopColor="#f4e0a6" />
                  <stop offset="50%" stopColor="#d4af37" />
                  <stop offset="80%" stopColor="#8a6b1c" />
                  <stop offset="100%" stopColor="#c5a059" />
                </linearGradient>
                <linearGradient id="band-silver" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#b5b6b8" />
                  <stop offset="20%" stopColor="#ffffff" />
                  <stop offset="50%" stopColor="#e3e4e5" />
                  <stop offset="80%" stopColor="#8f9193" />
                  <stop offset="100%" stopColor="#b5b6b8" />
                </linearGradient>
                <linearGradient id="band-black" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stopColor="#333333" />
                  <stop offset="20%" stopColor="#666666" />
                  <stop offset="50%" stopColor="#222222" />
                  <stop offset="80%" stopColor="#0a0a0a" />
                  <stop offset="100%" stopColor="#222222" />
                </linearGradient>

                <radialGradient id="gemShade" cx="30%" cy="30%" r="70%">
                  <stop offset="0%" stopColor="rgba(255,255,255,0.8)" />
                  <stop offset="40%" stopColor="rgba(255,255,255,0)" />
                  <stop offset="100%" stopColor="rgba(0,0,0,0.6)" />
                </radialGradient>

                <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
                  <feDropShadow dx="0" dy="0.5" stdDeviation="0.5" floodOpacity="0.4" />
                </filter>
              </defs>

              <rect x={-svgWidthMM/2} y={-svgHeightMM/2} width={svgWidthMM} height={svgHeightMM} fill="url(#largeGrid)" />

              <line x1={0} y1={-svgHeightMM/2} x2={0} y2={svgHeightMM/2} stroke="rgba(255,0,0,0.2)" strokeWidth="0.2" strokeDasharray="1,1" />
              <line x1={-svgWidthMM/2} y1={0} x2={svgWidthMM/2} y2={0} stroke="rgba(255,0,0,0.2)" strokeWidth="0.2" strokeDasharray="1,1" />

              <rect
                x={-svgWidthMM/2}
                y={-(Number(bandWidth) / 2)}
                width={svgWidthMM}
                height={Number(bandWidth) || 0}
                fill={isFlatBand ? METAL_COLORS[bandColor].flat : `url(#band-${bandColor})`}
                filter={isFlatBand ? undefined : "url(#drop-shadow)"}
              />

              {!isFlatBand && (
                <>
                  <rect x={-svgWidthMM/2} y={-(Number(bandWidth) / 2) + 0.2} width={svgWidthMM} height={(Number(bandWidth) || 0) * 0.1} fill="rgba(255,255,255,0.4)" />
                  <rect x={-svgWidthMM/2} y={(Number(bandWidth) / 2) - ((Number(bandWidth) || 0) * 0.15)} width={svgWidthMM} height={(Number(bandWidth) || 0) * 0.1} fill="rgba(0,0,0,0.2)" />
                </>
              )}

              {renderedStones.map((stone) => {
                const w = Number(stone.width) || 0;
                const shape = stone.shape || 'Round Brilliant';
                const ratio = SHAPE_RATIOS[shape] || 1;
                const h = w * ratio;
                const hw = w / 2;
                const hh = h / 2;
                const rotation = Number(stone.rotation) || 0;

                const basePath = getShapePath(shape, hw, hh);
                const isStep = shape === 'Emerald' || shape === 'Asscher';
                const pSize = hw * 0.15;

                return (
                  <g
                    key={`stone-svg-${stone.id}`}
                    transform={`translate(${stone.x}, ${stone.y})`}
                    filter={isFlatBand ? undefined : "url(#drop-shadow)"}
                  >
                    <g transform={`rotate(${rotation})`}>
                      <path d={basePath} fill={stone.color} />
                      <g stroke="rgba(255,255,255,0.5)" strokeWidth={hw * 0.04} fill="none">
                        {isStep ? (
                          <>
                            <path d={getShapePath(shape, hw*0.75, hh*0.75)} fill="rgba(255,255,255,0.1)" />
                            <path d={getShapePath(shape, hw*0.5, hh*0.5)} />
                            <path d={getShapePath(shape, hw*0.25, hh*0.25)} />
                            <line x1={-hw} y1={-hh} x2={0} y2={0} />
                            <line x1={hw} y1={-hh} x2={0} y2={0} />
                            <line x1={-hw} y1={hh} x2={0} y2={0} />
                            <line x1={hw} y1={hh} x2={0} y2={0} />
                          </>
                        ) : shape === 'Heart' || shape === 'Crescent Moon' ? (
                          <>
                            <path d={getShapePath(shape, hw*0.8, hh*0.8)} strokeWidth={hw * 0.02} />
                            <path d={getShapePath(shape, hw*0.5, hh*0.5)} strokeWidth={hw * 0.015} fill="rgba(255,255,255,0.1)" />
                          </>
                        ) : shape === 'Hexagon' ? (
                          <>
                            <path d={getShapePath('Hexagon', hw*0.6, hh*0.6)} fill="rgba(255,255,255,0.1)" strokeWidth={hw * 0.02} />
                            <line x1={0} y1={-hh} x2={0} y2={-hh*0.6} />
                            <line x1={hw*0.866} y1={-hh*0.5} x2={hw*0.52} y2={-hh*0.3} />
                            <line x1={hw*0.866} y1={hh*0.5} x2={hw*0.52} y2={hh*0.3} />
                            <line x1={0} y1={hh} x2={0} y2={hh*0.6} />
                            <line x1={-hw*0.866} y1={hh*0.5} x2={-hw*0.52} y2={hh*0.3} />
                            <line x1={-hw*0.866} y1={-hh*0.5} x2={-hw*0.52} y2={-hh*0.3} />
                            <path d={getShapePath('Hexagon', hw*0.9, hh*0.9)} strokeWidth={hw * 0.02} />
                          </>
                        ) : (
                          <>
                            <polygon points={`${-hw*0.2},${-hh*0.5} ${hw*0.2},${-hh*0.5} ${hw*0.5},${-hh*0.2} ${hw*0.5},${hh*0.2} ${hw*0.2},${hh*0.5} ${-hw*0.2},${hh*0.5} ${-hw*0.5},${hh*0.2} ${-hw*0.5},${-hh*0.2}`} fill="rgba(255,255,255,0.15)" />
                            <line x1={-hw*0.2} y1={-hh*0.5} x2={-hw*0.6} y2={-hh*0.6} />
                            <line x1={hw*0.2} y1={-hh*0.5} x2={hw*0.6} y2={-hh*0.6} />
                            <line x1={hw*0.5} y1={-hh*0.2} x2={hw*0.8} y2={0} />
                            <line x1={hw*0.5} y1={hh*0.2} x2={hw*0.8} y2={0} />
                            <line x1={hw*0.2} y1={hh*0.5} x2={hw*0.6} y2={hh*0.6} />
                            <line x1={-hw*0.2} y1={hh*0.5} x2={-hw*0.6} y2={hh*0.6} />
                            <line x1={-hw*0.5} y1={hh*0.2} x2={-hw*0.8} y2={0} />
                            <line x1={-hw*0.5} y1={-hh*0.2} x2={-hw*0.8} y2={0} />
                            <path d={getShapePath(shape, hw*0.9, hh*0.9)} strokeWidth={hw * 0.02} />
                          </>
                        )}
                      </g>
                      {stone.settingStyle && stone.settingStyle !== 'None' && renderSetting(stone, hw, hh, pSize, basePath)}
                    </g>

                    <g clipPath={`url(#clip-${stone.id})`}>
                      <rect x={-hw * 2} y={-hh * 2} width={hw * 4} height={hh * 4} fill="url(#gemShade)" pointerEvents="none" />
                    </g>
                    <clipPath id={`clip-${stone.id}`}>
                      <path d={basePath} transform={`rotate(${rotation})`} />
                    </clipPath>
                  </g>
                );
              })}

              <g id="measurements">
                {showVertical && renderedStones.map((stone) => {
                  const targetY = verticalFrom === 'top' ? -(Number(bandWidth) / 2) : (Number(bandWidth) / 2);
                  const startY = stone.y;
                  const endY = targetY;
                  const midY = (startY + endY) / 2;
                  const dist = Math.abs(startY - endY);
                  const textStr = `${dist.toFixed(1)}mm`;
                  const boxW = textStr.length * (measTextSize * 0.62) + 0.4;
                  const boxH = measTextSize * 1.45 + 0.2;

                  return (
                    <g key={`v-meas-${stone.id}`}>
                      <line x1={stone.x} y1={startY} x2={stone.x} y2={endY} stroke="#ec4899" strokeWidth="0.08" strokeDasharray="0.5,0.5" />
                      <line x1={stone.x - 0.5} y1={endY} x2={stone.x + 0.5} y2={endY} stroke="#ec4899" strokeWidth="0.08" />
                      <line x1={stone.x - 0.5} y1={startY} x2={stone.x + 0.5} y2={startY} stroke="#ec4899" strokeWidth="0.08" />
                      <rect x={stone.x - boxW/2} y={midY - boxH/2} width={boxW} height={boxH} fill="rgba(255,255,255,0.9)" stroke="#fbcfe8" strokeWidth="0.04" rx="0.25" />
                      <text x={stone.x} y={midY + (measTextSize * 0.35)} fontSize={measTextSize} textAnchor="middle" fill="#ec4899" fontWeight="bold">
                        {textStr}
                      </text>
                    </g>
                  );
                })}

                {showWidth && (() => {
                  const maxY = renderedStones.length > 0 ? Math.max(...renderedStones.map(s => s.y + (s.width * (SHAPE_RATIOS[s.shape] || 1)) / 2)) : 0;
                  const bandBottom = Number(bandWidth) / 2;
                  const widthMeasY = Math.max(bandBottom, maxY) + 3.2;

                  const widthItems = renderedStones.map(stone => {
                    const textStr = `${stone.width.toFixed(1)}mm`;
                    const boxW = textStr.length * (measTextSize * 0.62) + 0.4;
                    const spanW = Math.max(stone.width, boxW);
                    return {
                      ...stone,
                      textStr,
                      boxW,
                      boxH: measTextSize * 1.45 + 0.2,
                      leftX: stone.x - spanW / 2,
                      rightX: stone.x + spanW / 2,
                      gemBottom: stone.y + (stone.width * (SHAPE_RATIOS[stone.shape] || 1)) / 2
                    };
                  }).sort((a, b) => a.x - b.x);

                  const tiers = [];
                  widthItems.forEach(item => {
                    let placed = false;
                    for (let t = 0; t < tiers.length; t++) {
                      if (item.leftX > tiers[t] + (measTextSize * 0.9)) {
                        item.tier = t;
                        tiers[t] = item.rightX;
                        placed = true;
                        break;
                      }
                    }
                    if (!placed) {
                      item.tier = tiers.length;
                      tiers.push(item.rightX);
                    }
                  });

                  return widthItems.map(item => {
                    const yPos = widthMeasY + (item.tier * (measTextSize * 2.2 + 0.9));
                    const extLeftX = item.x - item.width / 2;
                    const extRightX = item.x + item.width / 2;

                    return (
                      <g key={`w-meas-${item.id}`}>
                        <line x1={extLeftX} y1={yPos} x2={extRightX} y2={yPos} stroke="#10b981" strokeWidth="0.08" strokeDasharray="0.8,0.8" />
                        <line x1={extLeftX} y1={yPos - 0.8} x2={extLeftX} y2={yPos + 0.8} stroke="#10b981" strokeWidth="0.08" />
                        <line x1={extRightX} y1={yPos - 0.8} x2={extRightX} y2={yPos + 0.8} stroke="#10b981" strokeWidth="0.08" />

                        <line x1={extLeftX} y1={item.gemBottom} x2={extLeftX} y2={yPos} stroke="#10b981" strokeWidth="0.05" strokeDasharray="0.4,0.4" opacity="0.55" />
                        <line x1={extRightX} y1={item.gemBottom} x2={extRightX} y2={yPos} stroke="#10b981" strokeWidth="0.05" strokeDasharray="0.4,0.4" opacity="0.55" />

                        <rect x={item.x - item.boxW/2} y={yPos - item.boxH/2} width={item.boxW} height={item.boxH} fill="rgba(255,255,255,0.92)" stroke="#a7f3d0" strokeWidth="0.04" rx="0.25" />
                        <text x={item.x} y={yPos + (measTextSize * 0.35)} fontSize={measTextSize} textAnchor="middle" fill="#10b981" fontWeight="bold">
                          {item.textStr}
                        </text>
                      </g>
                    );
                  });
                })()}

                {showSeparation && (() => {
                  const sortedStones = [...renderedStones].sort((a, b) => a.x - b.x);
                  const gapItems = [];

                  for (let i = 0; i < sortedStones.length - 1; i++) {
                    const s1 = sortedStones[i];
                    const s2 = sortedStones[i+1];
                    const rightEdge1 = s1.x + s1.width / 2;
                    const leftEdge2 = s2.x - s2.width / 2;
                    const gap = leftEdge2 - rightEdge1;
                    const midX = (rightEdge1 + leftEdge2) / 2;

                    const y1 = s1.y - (s1.width * (SHAPE_RATIOS[s1.shape] || 1)) / 2;
                    const y2 = s2.y - (s2.width * (SHAPE_RATIOS[s2.shape] || 1)) / 2;
                    const baseMidY = Math.min(y1, y2) - 3.2;

                    const textStr = `${gap.toFixed(1)}mm`;
                    const boxW = textStr.length * (measTextSize * 0.62) + 0.4;
                    const boxH = measTextSize * 1.45 + 0.2;
                    const spanW = Math.max(gap, boxW);

                    if (gap > 0.01) {
                      gapItems.push({
                        id: `gap-${i}`, rightEdge1, leftEdge2, midX, baseMidY,
                        textStr, boxW, boxH, s1, s2, gap,
                        leftX: midX - spanW / 2, rightX: midX + spanW / 2
                      });
                    }
                  }

                  const tiers = [];
                  gapItems.forEach(item => {
                    let placed = false;
                    for (let t = 0; t < tiers.length; t++) {
                      if (item.leftX > tiers[t] + (measTextSize * 0.9)) {
                        item.tier = t;
                        tiers[t] = item.rightX;
                        placed = true;
                        break;
                      }
                    }
                    if (!placed) {
                      item.tier = tiers.length;
                      tiers.push(item.rightX);
                    }
                  });

                  return gapItems.map(item => {
                    const midY = item.baseMidY - (item.tier * (measTextSize * 2.2 + 0.9));
                    return (
                      <g key={item.id}>
                        <line x1={item.rightEdge1} y1={midY} x2={item.leftEdge2} y2={midY} stroke="#0ea5e9" strokeWidth="0.08" strokeDasharray="0.8,0.8" />
                        <line x1={item.rightEdge1} y1={midY - 0.8} x2={item.rightEdge1} y2={midY + 0.8} stroke="#0ea5e9" strokeWidth="0.08" />
                        <line x1={item.leftEdge2} y1={midY - 0.8} x2={item.leftEdge2} y2={midY + 0.8} stroke="#0ea5e9" strokeWidth="0.08" />

                        <line x1={item.rightEdge1} y1={midY} x2={item.rightEdge1} y2={item.s1.y} stroke="#0ea5e9" strokeWidth="0.05" strokeDasharray="0.4,0.4" opacity="0.6" />
                        <line x1={item.leftEdge2} y1={midY} x2={item.leftEdge2} y2={item.s2.y} stroke="#0ea5e9" strokeWidth="0.05" strokeDasharray="0.4,0.4" opacity="0.6" />

                        <rect x={item.midX - item.boxW/2} y={midY - item.boxH/2} width={item.boxW} height={item.boxH} fill="rgba(255,255,255,0.92)" stroke="#bae6fd" strokeWidth="0.04" rx="0.25" />
                        <text x={item.midX} y={midY + (measTextSize * 0.35)} fontSize={measTextSize} textAnchor="middle" fill="#0ea5e9" fontWeight="bold">
                          {item.textStr}

                  </div>
                </div>
              </div>
            )}
          </section>

          <section>
            <div className="flex justify-between items-center mb-4 border-b border-gray-200 pb-2">
              <h2 className="text-base sm:text-lg font-bold text-gray-800 flex items-center gap-2">
                <Settings className="w-5 h-5 text-emerald-500" />
                Individual Stones Configurator
              </h2>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
              {effectiveStones.map((stone, index) => {
                const isLinked = !!stones[index].linkedTo;
                const haloData = stone.settingStyle === 'Halo' ? getHaloData(stone.shape, stone.width/2, (stone.width*(SHAPE_RATIOS[stone.shape]||1))/2, stone.haloSize||1.0) : null;

                return (
                  <div key={stone.id} className="flex flex-col gap-1.5 relative">
                    <div className="flex justify-between items-center px-1">
                      <span className="font-bold text-gray-700 text-sm flex items-center gap-2">
                        <div className="w-3 h-3 rounded-full shadow-inner border border-gray-300" style={{ backgroundColor: stone.color }} />
                        Stone {index + 1} {index === 0 && layoutMode === 'cluster' && <span className="text-gray-400 font-normal ml-0.5">(Anchor)</span>}
                      </span>
                      <div className="flex items-center gap-3">
                        {index > 0 && (
                          <div className="flex items-center gap-1">
                            <LinkIcon className={`w-3.5 h-3.5 ${isLinked ? 'text-emerald-500' : 'text-gray-400'}`} />
                            <select
                              value={stones[index].linkedTo || ''}
                              onChange={(e) => updateStone(index, { linkedTo: e.target.value ? Number(e.target.value) : null })}
                              className={`text-[10px] font-semibold rounded py-0.5 px-1 outline-none transition-colors cursor-pointer border ${
                                isLinked ? 'bg-emerald-50 border-emerald-200 text-emerald-700' : 'bg-gray-50 border-gray-200 text-gray-500'
                              }`}
                            >
                              <option value="">No Link</option>
                              {stones.filter(s => s.id !== stone.id).map((s) => {
                                const sIndex = stones.findIndex(st => st.id === s.id);
                                return <option key={s.id} value={s.id}>Mirror Stone {sIndex + 1}</option>;
                              })}
                            </select>
                          </div>
                        )}

                        {stones.length > 1 && (
                          <button
                            onClick={() => removeSpecificStone(stone.id)}
                            className="text-gray-400 hover:text-red-600 hover:bg-red-50 rounded px-2 py-0.5 text-xs font-semibold flex items-center gap-1 transition-colors"
                          >
                            <X className="w-3 h-3" /> Remove
                          </button>
                        )}
                      </div>
                    </div>

                    <div className={`bg-white rounded-xl p-4 shadow-sm border transition-all flex flex-col gap-4 relative overflow-hidden ${isLinked ? 'border-emerald-200 bg-emerald-50/10' : 'border-gray-200 hover:border-emerald-300'}`}>
                      {isLinked && (
                        <div className="absolute inset-0 bg-gray-50/40 z-10 pointer-events-none" />
                      )}

                      <div className="grid grid-cols-3 gap-2">
                        <div className="flex flex-col gap-1.5">
                          <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wide">Shape</span>
                          <select
                            disabled={isLinked}
                            value={stone.shape || 'Round Brilliant'}
                            onChange={(e) => updateStone(index, { shape: e.target.value })}
                            className="w-full text-[11px] border border-gray-200 rounded text-gray-700 py-1.5 px-1 bg-gray-50 focus:ring-1 focus:ring-emerald-500 outline-none disabled:opacity-75 disabled:bg-gray-100"
                          >
                            {Object.keys(SHAPE_RATIOS).map(s => <option key={s} value={s}>{s}</option>)}
                          </select>
                        </div>

                        <div className="flex flex-col gap-1.5">
                          <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wide">Mode</span>
                          <div className={`flex bg-gray-100 p-0.5 rounded border border-gray-200 h-[28px] ${isLinked ? 'opacity-75' : ''}`}>
                            <button
                              disabled={isLinked}
                              className={`flex-1 text-[9px] font-bold rounded uppercase transition-colors ${stone.colorMode === 'preset' ? 'bg-white shadow-sm text-emerald-600' : 'text-gray-500 hover:text-gray-700'}`}
                              onClick={() => updateStone(index, { colorMode: 'preset' })}
                            >
                              STONE
                            </button>
                            <button
                              disabled={isLinked}
                              className={`flex-1 text-[9px] font-bold rounded uppercase transition-colors ${stone.colorMode === 'custom' ? 'bg-white shadow-sm text-emerald-600' : 'text-gray-500 hover:text-gray-700'}`}
                              onClick={() => updateStone(index, { colorMode: 'custom' })}
                            >
                              COLOR
                            </button>
                          </div>
                        </div>

                        <div className="flex flex-col gap-1.5">
                          <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wide truncate">
                            {stone.colorMode === 'preset' ? 'Gemstone' : 'Custom'}
                          </span>
                          {stone.colorMode === 'preset' ? (
                            <select
                              disabled={isLinked}
                              value={stone.preset || 'Diamond'}
                              onChange={(e) => updateStone(index, { preset: e.target.value, color: PRESET_STONES[e.target.value] })}
                              className="w-full text-[11px] border border-gray-200 rounded text-gray-700 py-1.5 px-1 bg-gray-50 focus:ring-1 focus:ring-emerald-500 outline-none disabled:opacity-75 disabled:bg-gray-100"
                            >
                              {Object.keys(PRESET_STONES).map(p => <option key={p} value={p}>{p}</option>)}
                            </select>
                          ) : (
                            <div className={`flex items-center gap-2 w-full border border-gray-200 rounded bg-gray-50 p-1 h-[28px] ${isLinked ? 'opacity-75' : ''}`}>
                              <input
                                type="color" value={stone.color} disabled={isLinked}
                                onChange={(e) => updateStone(index, { color: e.target.value })}
                                className="w-5 h-5 p-0 border border-gray-300 rounded cursor-pointer shrink-0 bg-transparent disabled:cursor-not-allowed"
                              />
                              <span className="text-[10px] font-mono font-semibold text-gray-600 uppercase truncate">{stone.color}</span>
                            </div>
                          )}
                        </div>
                      </div>

                      <div className={`grid ${stone.settingStyle === 'Bezel' ? 'grid-cols-3' : 'grid-cols-1'} gap-2`}>
                        <div className="flex flex-col gap-1.5 justify-center">
                          <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wide flex items-center gap-1">
                            <Crown className="w-3 h-3" /> Setting Style
                          </span>
                          <select
                            disabled={isLinked}
                            value={stone.settingStyle || '4-Prong'}
                            onChange={(e) => updateStone(index, { settingStyle: e.target.value })}
                            className="w-full text-xs border border-gray-200 rounded text-gray-700 py-1.5 px-2 bg-gray-50 focus:ring-1 focus:ring-emerald-500 outline-none h-[28px] disabled:opacity-75 disabled:bg-gray-100"
                          >
                            {SETTING_STYLES.map(s => <option key={s} value={s}>{s}</option>)}
                          </select>
                        </div>

                        {stone.settingStyle === 'Bezel' && (
                          <>
                            <div className="flex flex-col gap-1.5 justify-center">
                              <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wide">Bezel Color</span>
                              <select
                                disabled={isLinked}
                                value={stone.bezelColor || 'gold'}
                                onChange={(e) => updateStone(index, { bezelColor: e.target.value })}
                                className="w-full text-xs border border-gray-200 rounded text-gray-700 py-1.5 px-2 bg-gray-50 focus:ring-1 focus:ring-emerald-500 outline-none h-[28px] disabled:opacity-75 disabled:bg-gray-100"
                              >
                                <option value="gold">Gold</option>
                                <option value="silver">Silver</option>
                                <option value="black">Black</option>
                              </select>
                            </div>
                            <div className="flex flex-col justify-center translate-y-1">
                              <CompactControl
                                label="Bezel Size"
                                value={stone.bezelSize || 0.5}
                                min={0.1} max={2.0} step={0.1}
                                disabled={isLinked}
                                onChange={(v) => updateStone(index, { bezelSize: v })}
                              />
                            </div>
                          </>
                        )}
                      </div>

                      {stone.settingStyle === 'Halo' && (
                        <div className="col-span-full bg-gray-50 p-3 border border-gray-200 rounded mt-1">
                          <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wide mb-2 block">Halo Configuration</span>

                          <div className="grid grid-cols-2 gap-4 mb-3">
                            <CompactControl label="Halo Stone Size" value={stone.haloSize || 1.0} min={0.5} max={3.0} step={0.1} disabled={isLinked} onChange={(v) => updateStone(index, { haloSize: v })} />

                            <div className="flex flex-col gap-1.5">
                              <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wide">Base Halo Color</span>
                              <select
                                disabled={isLinked}
                                value={stone.haloPreset || 'Diamond'}
                                onChange={(e) => updateStone(index, { haloPreset: e.target.value, haloColor: PRESET_STONES[e.target.value] })}
                                className="w-full text-[11px] border border-gray-200 rounded text-gray-700 py-1.5 px-1 bg-white focus:ring-1 focus:ring-emerald-500 outline-none h-[28px]"
                              >
                                {Object.keys(PRESET_STONES).map(p => <option key={p} value={p}>{p}</option>)}
                              </select>
                            </div>
                          </div>

                          <div className="flex items-center gap-2 mb-2">
                            <input
                              type="checkbox"
                              id={`unique-${index}`}
                              disabled={isLinked}
                              checked={stone.haloUniqueStones || false}
                              onChange={e => updateStone(index, { haloUniqueStones: e.target.checked })}
                              className="w-3.5 h-3.5 text-emerald-600 bg-white border-gray-300 rounded focus:ring-emerald-500 cursor-pointer"
                            />
                            <label htmlFor={`unique-${index}`} className="text-xs font-semibold text-gray-700 cursor-pointer select-none">
                              Unique stones in halo
                            </label>
                          </div>

                          {stone.haloUniqueStones && haloData && (
                            <div className="flex gap-2 overflow-x-auto pb-2" style={{ scrollbarWidth: 'thin' }}>
                              {haloData.stones.map((_, hIdx) => (
                                <div key={hIdx} className="flex flex-col gap-1 shrink-0 bg-white p-1.5 border rounded items-center shadow-sm">
                                  <span className="text-[9px] font-bold text-gray-400">#{hIdx+1}</span>
                                  <select
                                    className="w-[70px] text-[10px] border border-gray-200 rounded py-0.5 outline-none bg-gray-50"
                                    disabled={isLinked}
                                    value={stone.haloOverrides?.[hIdx] || ''}
                                    onChange={(e) => {
                                      const newOverrides = { ...(stone.haloOverrides || {}) };
                                      if (e.target.value === '') delete newOverrides[hIdx];
                                      else newOverrides[hIdx] = e.target.value;
                                      updateStone(index, { haloOverrides: newOverrides });
                                    }}
                                  >
                                    <option value="">(Base Color)</option>
                                    {Object.keys(PRESET_STONES).map(p => <option key={p} value={PRESET_STONES[p]}>{p}</option>)}
                                  </select>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      )}

                      <div className="grid grid-cols-3 gap-3 pt-2">
                        <CompactControl label="Width" value={stone.width} min={1} max={15} step={0.25} disabled={isLinked} onChange={(v) => updateStone(index, { width: v })} />
                        <CompactControl label="Y-Offset" value={stone.heightOffset} min={-15} max={15} step={0.25} disabled={isLinked} onChange={(v) => updateStone(index, { heightOffset: v })} />
                        <CompactControl label="Rot (deg)" value={stone.rotation} min={0} max={360} step={1} disabled={isLinked} onChange={(v) => updateStone(index, { rotation: v })} />
                      </div>

                      <div className="pt-2 border-t border-gray-100 mt-2">
                        {layoutMode === 'scatter' ? (
                          <CompactControl label={index === 0 ? "Locked (Anchor)" : "Dist. From Neighbor"} value={index === 0 ? 0 : stone.gap} min={-10} max={15} step={0.25} disabled={index === 0 || isLinked} onChange={(v) => updateStone(index, { gap: v })} />
                        ) : (
                          index === 0 ? (
                            <div className="w-full text-center py-2 bg-gray-50 rounded border border-gray-100 text-xs font-bold text-gray-400 uppercase tracking-wide">
                              Center Anchor (Locked)
                            </div>
                          ) : (
                            <div className="grid grid-cols-2 gap-4">
                              <div className="flex flex-col gap-1.5">
                                <span className="text-[10px] font-bold text-gray-500 uppercase tracking-wide">Side</span>
                                <div className={`flex bg-gray-100 p-0.5 rounded border border-gray-200 h-[26px] ${isLinked ? 'opacity-75' : ''}`}>
                                  <button
                                    disabled={isLinked}
                                    className={`flex-1 text-[10px] font-bold rounded uppercase transition-colors ${stone.side === 'left' ? 'bg-white shadow-sm text-emerald-600' : 'text-gray-500 hover:text-gray-700'}`}
                                    onClick={() => updateStone(index, { side: 'left' })}
                                  >Left</button>
                                  <button
                                    disabled={isLinked}
                                    className={`flex-1 text-[10px] font-bold rounded uppercase transition-colors ${stone.side === 'right' ? 'bg-white shadow-sm text-emerald-600' : 'text-gray-500 hover:text-gray-700'}`}
                                    onClick={() => updateStone(index, { side: 'right' })}
                                  >Right</button>
                                </div>
                              </div>
                              <CompactControl label="Dist From Center" value={stone.centerOffset} min={0} max={30} step={0.25} disabled={isLinked} onChange={(v) => updateStone(index, { centerOffset: v })} />
                            </div>
                          )
                        )}
                      </div>
                    </div>
                  </div>
                );
              })}

              <button
                onClick={addStone}
                className="flex flex-col items-center justify-center min-h-[320px] bg-white/60 hover:bg-white border-2 border-dashed border-emerald-300 hover:border-emerald-500 rounded-xl p-6 text-emerald-600 hover:text-emerald-700 transition-all shadow-sm hover:shadow group cursor-pointer"
              >
                <div className="w-12 h-12 rounded-full bg-emerald-50 group-hover:bg-emerald-100 flex items-center justify-center transition-colors mb-3">
                  <Plus className="w-6 h-6" />
                </div>
                <span className="font-bold text-base">Add Stone</span>
                <span className="text-xs text-gray-400 mt-1">Append new gemstone to ring</span>
              </button>
            </div>
          </section>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>

</body></html>
