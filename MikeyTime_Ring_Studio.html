const compareVersions = (a, b) => {
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const d = (pa[i] || 0) - (pb[i] || 0);
    if (d !== 0) return d > 0 ? 1 : -1;
  }
  return 0;
};

// Typed entries are not capped by the slider's range: a slider's min/max is
// only its convenient span. Values below a non-negative min are raised to it
// (sizes and depths can't go below their floor); fields whose slider already
// runs negative (offsets) accept any number. The slider track stretches to
// include a typed value outside its span.
const commitTypedNumber = (value, min) => {
  const n = Number(value);
  if (value === '' || !Number.isFinite(n)) return min < 0 ? 0 : min;
  if (min >= 0 && n < min) return min;
  return n;
};

// Crescent Moon: a true crescent - a unit circle with an overlapping circle
// (radius CRESCENT_BITE_R, centered CRESCENT_BITE_D to its left) cut away.
// Both edges are circular arcs meeting at two sharp horns on the left. Its
// width (horn to back) is less than its height, so it has its own ratio.
const CRESCENT_BITE_D = 0.45;
const CRESCENT_BITE_R = 0.88;
const CRESCENT_GEOM = (() => {
  const tipX = (CRESCENT_BITE_R ** 2 - 1 - CRESCENT_BITE_D ** 2) / (2 * CRESCENT_BITE_D);
  const tipY = Math.sqrt(1 - tipX * tipX);
  return {
    tipX, tipY,
    outerAngle: Math.atan2(tipY, tipX),
    biteAngle: Math.atan2(tipY, tipX + CRESCENT_BITE_D),
    centerX: (tipX + 1) / 2,
    halfWidth: (1 - tipX) / 2
  };
})();

// Heart: the classic heart curve x = 16 sin^3 t,
// y = 13 cos t - 5 cos 2t - 2 cos 3t - cos 4t (two round lobes, a sharp notch
// at t = 0 and a point at t = pi), scaled to fill its box.
const heartCurve = (t) => ({
  x: 16 * Math.sin(t) ** 3,
  y: 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
});
const HEART_GEOM = (() => {
  let yMax = -Infinity;
  for (let i = 0; i <= 2000; i++) yMax = Math.max(yMax, heartCurve((i / 2000) * Math.PI).y);
  const yMin = heartCurve(Math.PI).y;
  return { yMid: (yMax + yMin) / 2, yHalf: (yMax - yMin) / 2 };
})();

const getShapeOutlinePoints = (shape, hw, hh, steps = 96) => {
  const pts = [];
  const buildPolygon = (corners, totalSteps) => {
    const p = [];
    const nCorners = corners.length;
    const baseSub = Math.max(2, Math.floor(totalSteps / nCorners));
    for (let c = 0; c < nCorners; c++) {
      const p1 = corners[c];
      const p2 = corners[(c + 1) % nCorners];
      for (let j = 0; j < baseSub; j++) {
        const t = j / baseSub;
        p.push({
          x: p1.x + (p2.x - p1.x) * t,
          y: p1.y + (p2.y - p1.y) * t,
          isCorner: j === 0,
          miterLimit: p1.miterLimit || 1.55
        });
      }
    }
    return p;
  };

  if (shape === 'Princess') {
    return buildPolygon(
      [
        { x: -hw, y: -hh, miterLimit: 1.45 },
        { x: hw, y: -hh, miterLimit: 1.45 },
        { x: hw, y: hh, miterLimit: 1.45 },
        { x: -hw, y: hh, miterLimit: 1.45 }
      ],
      steps
    );
  }
  if (shape === 'Emerald' || shape === 'Radiant' || shape === 'Asscher') {
    const ce = hw * (shape === 'Asscher' ? 0.5 : (shape === 'Radiant' ? 0.2 : 0.3));
    return buildPolygon(
      [
        { x: -hw + ce, y: -hh, miterLimit: 1.22 }, { x: hw - ce, y: -hh, miterLimit: 1.22 },
        { x: hw, y: -hh + ce, miterLimit: 1.22 }, { x: hw, y: hh - ce, miterLimit: 1.22 },
        { x: hw - ce, y: hh, miterLimit: 1.22 }, { x: -hw + ce, y: hh, miterLimit: 1.22 },
        { x: -hw, y: hh - ce, miterLimit: 1.22 }, { x: -hw, y: -hh + ce, miterLimit: 1.22 }
      ],
      steps
    );
  }
  if (shape === 'Hexagon') {
    const sx = hw * 0.866025;
    return buildPolygon(
      [
        { x: 0, y: -hh, miterLimit: 1.28 }, { x: sx, y: -hh * 0.5, miterLimit: 1.28 },
        { x: sx, y: hh * 0.5, miterLimit: 1.28 }, { x: 0, y: hh, miterLimit: 1.28 },
        { x: -sx, y: hh * 0.5, miterLimit: 1.28 }, { x: -sx, y: -hh * 0.5, miterLimit: 1.28 }
      ],
      steps
    );
  }
  if (shape === 'Cushion') {
    const rx = hw * 0.4, linX = hw - rx, linY = hh - rx;
    const seg = Math.max(4, Math.floor(steps / 8));
    for (let j = 0; j < seg; j++) pts.push({ x: -linX + (2 * linX * j / seg), y: -hh });
    for (let j = 0; j < seg; j++) { const a = -Math.PI / 2 + (Math.PI / 2 * j / seg); pts.push({ x: linX + rx * Math.cos(a), y: -linY + rx * Math.sin(a) }); }
    for (let j = 0; j < seg; j++) pts.push({ x: hw, y: -linY + (2 * linY * j / seg) });
    for (let j = 0; j < seg; j++) { const a = 0 + (Math.PI / 2 * j / seg); pts.push({ x: linX + rx * Math.cos(a), y: linY + rx * Math.sin(a) }); }
    for (let j = 0; j < seg; j++) pts.push({ x: linX - (2 * linX * j / seg), y: hh });
    for (let j = 0; j < seg; j++) { const a = Math.PI / 2 + (Math.PI / 2 * j / seg); pts.push({ x: -linX + rx * Math.cos(a), y: linY + rx * Math.sin(a) }); }
    for (let j = 0; j < seg; j++) pts.push({ x: -hw, y: linY - (2 * linY * j / seg) });
    for (let j = 0; j < seg; j++) { const a = Math.PI + (Math.PI / 2 * j / seg); pts.push({ x: -linX + rx * Math.cos(a), y: -linY + rx * Math.sin(a) }); }
    return pts;
  }

  const half = Math.floor(steps / 2);
  for (let i = 0; i < steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    let x = 0, y = 0;
    let isCorner = false;
    let miterLimit = 1.45;

    if (shape === 'Round Brilliant') {
      x = hw * Math.cos(t);
      y = hw * Math.sin(t);
    } else if (shape === 'Oval') {
      x = hw * Math.cos(t);
      y = hh * Math.sin(t);
    } else if (shape === 'Pear') {
      if (i < half) {
        const bt = i / half, u = 1 - bt;
        x = 3 * u * u * bt * (hw * 1.15) + 3 * u * bt * bt * (hw * 1.15);
        y = u * u * u * (-hh) + 3 * u * u * bt * (-hh * 0.1) + 3 * u * bt * bt * (hh) + bt * bt * bt * (hh);
      } else {
        const bt = (i - half) / (steps - half), u = 1 - bt;
        x = 3 * u * u * bt * (-hw * 1.15) + 3 * u * bt * bt * (-hw * 1.15);
        y = u * u * u * (hh) + 3 * u * u * bt * (hh) + 3 * u * bt * bt * (-hh * 0.1) + bt * bt * bt * (-hh);
      }
      isCorner = i === 0;
      miterLimit = i === 0 ? 1.35 : 1.15;
    } else if (shape === 'Marquise') {
      if (i < half) {
        const bt = i / half, u = 1 - bt;
        x = 3 * u * u * bt * (hw * 1.1) + 3 * u * bt * bt * (hw * 1.1);
        y = u * u * u * (-hh) + 3 * u * u * bt * (-hh * 0.3) + 3 * u * bt * bt * (hh * 0.3) + bt * bt * bt * (hh);
      } else {
        const bt = (i - half) / (steps - half), u = 1 - bt;
        x = 3 * u * u * bt * (-hw * 1.1) + 3 * u * bt * bt * (-hw * 1.1);
        y = u * u * u * (hh) + 3 * u * u * bt * (hh * 0.3) + 3 * u * bt * bt * (-hh * 0.3) + bt * bt * bt * (-hh);
      }
      isCorner = i === 0 || i === half;
      miterLimit = isCorner ? 1.38 : 1.15;
    } else if (shape === 'Heart') {
      // i = 0 is the notch between the lobes, i = half the bottom point.
      const c = heartCurve((i / steps) * Math.PI * 2);
      x = (c.x / 16) * hw;
      y = -((c.y - HEART_GEOM.yMid) / HEART_GEOM.yHalf) * hh;
      isCorner = i === 0 || i === half;
      miterLimit = i === 0 ? 1.05 : (i === half ? 1.32 : 1.15);
    } else if (shape === 'Crescent Moon') {
      // First half: outer arc from the top horn round the back to the bottom
      // horn. Second half: the bite's arc from the bottom horn back up.
      const g = CRESCENT_GEOM;
      let cx, cy;
      if (i < half) {
        const th = g.outerAngle - (2 * g.outerAngle * i) / half;
        cx = Math.cos(th); cy = Math.sin(th);
      } else {
        const ph = -g.biteAngle + (2 * g.biteAngle * (i - half)) / (steps - half);
        cx = -CRESCENT_BITE_D + CRESCENT_BITE_R * Math.cos(ph); cy = CRESCENT_BITE_R * Math.sin(ph);
      }
      x = ((cx - g.centerX) / g.halfWidth) * hw;
      y = -cy * hh;
      isCorner = i === 0 || i === half;
      miterLimit = isCorner ? 1.22 : 1.12;
    } else {
      x = hw * Math.cos(t);
      y = hw * Math.sin(t);
    }
    pts.push({ x, y, isCorner, miterLimit });
  }
  return pts;
};

// Offsetting past a sharp inward corner (a heart's notch, a crescent's horns)
// makes the new outline cross itself in a small loop. Each loop is collapsed
// onto the crossing point. The point count is kept, because bezel rings are
// built from index-matched outlines.
const segmentIntersection = (p1, p2, p3, p4) => {
  const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
  if (Math.abs(d) < 1e-12) return null;
  const t = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
  const u = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
  if (t <= 1e-9 || t >= 1 - 1e-9 || u <= 1e-9 || u >= 1 - 1e-9) return null;
  return { x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t };
};
const removeOffsetLoops = (pts) => {
  const n = pts.length;
  const out = pts.map(p => ({ ...p }));
  const window = Math.max(3, Math.floor(n / 3));
  for (let i = 0; i < n; i++) {
    const a1 = out[i], a2 = out[(i + 1) % n];
    for (let k = window; k >= 2; k--) {
      const j = i + k;
      const b1 = out[j % n], b2 = out[(j + 1) % n];
      const x = segmentIntersection(a1, a2, b1, b2);
      if (!x) continue;
      for (let m = i + 1; m <= j; m++) out[m % n] = { ...out[m % n], x: x.x, y: x.y };
      i = j - 1;
      break;
    }
  }
  return out;
};

const offsetPolygon2D = (pts, offsetDist, shape = 'Round Brilliant') => {
  const n = pts.length;
  if (n < 3 || Math.abs(offsetDist) < 1e-6) return pts.map(p => ({ x: p.x, y: p.y }));

  let area = 0;
  for (let i = 0; i < n; i++) {
    const p1 = pts[i];
    const p2 = pts[(i + 1) % n];
    area += (p1.x * p2.y - p2.x * p1.y);
  }
  const sign = area >= 0 ? 1 : -1;
  const half = Math.floor(n / 2);

  const offsetPts = [];
  for (let i = 0; i < n; i++) {
    const pPrev = pts[(i - 1 + n) % n];
    const pCurr = pts[i];
    const pNext = pts[(i + 1) % n];

    if (shape === 'Pear' && i === 0) {
      offsetPts.push({ x: pCurr.x, y: pCurr.y - offsetDist * 1.28 });
      continue;
    }
    if (shape === 'Marquise' && (i === 0 || i === half)) {
      const dirY = i === 0 ? -1 : 1;
      offsetPts.push({ x: pCurr.x, y: pCurr.y + dirY * offsetDist * 1.32 });
      continue;
    }
    if (shape === 'Heart' && (i === 0 || i === half)) {
      if (i === 0) {
        offsetPts.push({ x: pCurr.x, y: pCurr.y - offsetDist * 0.92 });
      } else {
        offsetPts.push({ x: pCurr.x, y: pCurr.y + offsetDist * 1.28 });
      }
      continue;
    }
    if (shape === 'Crescent Moon' && (i === 0 || i === half)) {
      const dirY = i === 0 ? -1 : 1;
      offsetPts.push({
        x: pCurr.x - offsetDist * 0.42,
        y: pCurr.y + dirY * offsetDist * 1.15
      });
      continue;
    }

    let dx1 = pCurr.x - pPrev.x, dy1 = pCurr.y - pPrev.y;
    const len1 = Math.hypot(dx1, dy1) || 1;
    dx1 /= len1; dy1 /= len1;

    let dx2 = pNext.x - pCurr.x, dy2 = pNext.y - pCurr.y;
    const len2 = Math.hypot(dx2, dy2) || 1;
    dx2 /= len2; dy2 /= len2;

    const n1x = sign * dy1, n1y = -sign * dx1;
    const n2x = sign * dy2, n2y = -sign * dx2;

    let mx = n1x + n2x;
    let my = n1y + n2y;
    const mLen = Math.hypot(mx, my);
    if (mLen < 1e-5) {
      mx = n1x;
      my = n1y;
    } else {
      mx /= mLen;
      my /= mLen;
    }

    const dot = mx * n1x + my * n1y;
    const maxMiter = pCurr.miterLimit || 1.45;
    const miterScale = Math.min(maxMiter, 1 / Math.max(0.42, dot));
    offsetPts.push({
      x: pCurr.x + mx * offsetDist * miterScale,
      y: pCurr.y + my * offsetDist * miterScale
    });
  }
  return removeOffsetLoops(offsetPts);
};

const pointsToSVGPath = (pts) => {
  if (!pts || pts.length === 0) return '';
  return pts.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(4)} ${p.y.toFixed(4)}`).join(' ') + ' Z';
};

// Facet lines for the 2D blueprint, built from the same outline the 3D model
// uses so every cut's facets stay inside its own edge. Scaling is about the
// outline's own center, not the drawing origin (a pear or heart isn't
// centered on its origin).
//   brilliant: table polygon + main facets (table corner -> girdle) + star
//              facets (girdle midpoint -> neighbouring table corners)
//   step:      nested outlines + corner lines through the actual cut corners
//   crescent:  bands that follow the crescent's curve (its center lies
//              outside its body, so scaling toward a center can't work)
const STEP_CUT_SHAPES = ['Emerald', 'Asscher', 'Hexagon'];
const getFacetGeometry = (shape, hw, hh) => {
  const outline = getShapeOutlinePoints(shape, hw, hh, 96);
  const n = outline.length;

  if (shape === 'Crescent Moon') {
    // First half of the outline is the outer arc (tip to tip), second half
    // the inner arc back again; pair them up and pull each toward the other.
    const half = Math.floor(n / 2);
    const outer = outline.slice(0, half + 1);
    const inner = outline.slice(half).concat([outline[0]]).reverse();
    const band = (f) => {
      const o = outer.map((p, i) => ({ x: p.x + (inner[i].x - p.x) * f, y: p.y + (inner[i].y - p.y) * f }));
      const inn = inner.map((p, i) => ({ x: p.x + (outer[i].x - p.x) * f, y: p.y + (outer[i].y - p.y) * f }));
      return o.concat(inn.slice().reverse());
    };
    const spokes = [0.2, 0.35, 0.5, 0.65, 0.8].map(t => {
      const i = Math.round(t * half);
      return [outer[i], inner[i]];
    });
    return { girdle: band(0.08), rings: [band(0.24)], table: band(0.38), lines: spokes };
  }

  const cx = outline.reduce((acc, p) => acc + p.x, 0) / n;
  const cy = outline.reduce((acc, p) => acc + p.y, 0) / n;
  const scalePt = (p, k) => ({ x: cx + (p.x - cx) * k, y: cy + (p.y - cy) * k });
  const scaleAt = (i, k) => scalePt(outline[((i % n) + n) % n], k);
  const scaled = (k) => outline.map(p => scalePt(p, k));

  if (STEP_CUT_SHAPES.includes(shape)) {
    const tableK = shape === 'Hexagon' ? 0.6 : 0.4;
    const steps = shape === 'Hexagon' ? [] : [0.8, 0.6];
    const corners = outline.map((p, i) => (p.isCorner ? i : -1)).filter(i => i >= 0);
    return {
      girdle: scaled(0.94),
      rings: steps.map(k => scaled(k)),
      table: scaled(tableK),
      lines: corners.map(i => [scaleAt(i, 0.94), scaleAt(i, tableK)])
    };
  }

  const K = 8;
  const anchors = Array.from({ length: K }, (_, k) => Math.round((k * n) / K));
  const table = anchors.map(i => scaleAt(i, 0.52));
  const lines = [];
  anchors.forEach((i, k) => {
    lines.push([table[k], scaleAt(i, 0.94)]);
    const star = scaleAt(Math.round(i + n / (2 * K)), 0.94);
    lines.push([table[k], star], [table[(k + 1) % K], star]);
  });
  return { girdle: scaled(0.94), rings: [], table, lines };
};

// Color of halo stone i: its own pick when "Unique stones in halo" is on,
// otherwise the halo's base color. Shared by the 2D blueprint and 3D model.
const getHaloStoneColor = (stone, i) =>
  (stone.haloUniqueStones && stone.haloOverrides?.[i]) || stone.haloColor || '#fbfbfb';

const getHaloData = (shape, hw, hh, haloSize) => {
  const pts = getShapeOutlinePoints(shape, hw, hh, 120);
  const offset = (haloSize / 2) + 0.15;
  const offsetPts = offsetPolygon2D(pts, offset, shape);
  const steps = offsetPts.length;

  let perim = 0;
  const dists = [0];
  for (let i = 1; i <= steps; i++) {
    const p1 = offsetPts[i - 1], p2 = offsetPts[i % steps];
    perim += Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
    dists.push(perim);
  }

  const stoneSpacing = haloSize + 0.05;
  let numStones = Math.floor(perim / stoneSpacing);
  if (numStones < 4) numStones = 4;
  const actualSpacing = perim / numStones;
  const stones = [];

  for (let i = 0; i < numStones; i++) {
    const target = i * actualSpacing;
    let idx = 0;
    while (idx < steps && dists[idx + 1] <= target) idx++;
    const p1 = offsetPts[idx % steps], p2 = offsetPts[(idx + 1) % steps];
    const seg = dists[idx + 1] - dists[idx];
    const t = seg > 0 ? (target - dists[idx]) / seg : 0;
    stones.push({ x: p1.x + (p2.x - p1.x) * t, y: p1.y + (p2.y - p1.y) * t });
  }

  return { stones, numStones, offsetPts };
};

// Spots on a crescent: `along` runs horn (0) to horn (1) round the back,
// `across` from the outer edge (0) to the inner edge (1).
const crescentSpot = (hw, hh, along, across) => {
  const n = 240, pts = getShapeOutlinePoints('Crescent Moon', hw, hh, n);
  const i = Math.round(along * (n / 2));
  const o = pts[i % n], inner = pts[(n - i) % n];
  return { x: o.x + (inner.x - o.x) * across, y: o.y + (inner.y - o.y) * across };
};
// A spot on the heart curve at parameter t (0 = notch, pi = point), pulled
// `inset` of the way toward the heart's center so a prong sits on the edge.
const heartSpot = (hw, hh, t, inset = 0.08) => {
  const c = heartCurve(t);
  const x = (c.x / 16) * hw;
  const y = -((c.y - HEART_GEOM.yMid) / HEART_GEOM.yHalf) * hh;
  const cy = hh * 0.08;
  return { x: x * (1 - inset), y: y + (cy - y) * inset };
};

const getProngPositions = (style, shape, hw, hh) => {
  if (style === '4-Prong') {
    if (shape === 'Pear') return [{ x: 0, y: -hh * 0.9 }, { x: -hw * 0.85, y: 0 }, { x: hw * 0.85, y: 0 }, { x: 0, y: hh * 0.9 }];
    if (shape === 'Marquise') return [{ x: -hw * 0.65, y: -hh * 0.35 }, { x: hw * 0.65, y: -hh * 0.35 }, { x: -hw * 0.65, y: hh * 0.35 }, { x: hw * 0.65, y: hh * 0.35 }];
    if (shape === 'Heart') return [heartSpot(hw, hh, 0.62), heartSpot(hw, hh, -0.62), heartSpot(hw, hh, 2.25), heartSpot(hw, hh, -2.25)];
    if (shape === 'Crescent Moon') return [crescentSpot(hw, hh, 0.1, 0.45), crescentSpot(hw, hh, 0.9, 0.45), crescentSpot(hw, hh, 0.4, 0.1), crescentSpot(hw, hh, 0.6, 0.1)];
    if (shape === 'Hexagon') {
      const sx = hw * 0.866025;
      return [{ x: -sx, y: -hh * 0.6 }, { x: sx, y: -hh * 0.6 }, { x: -sx, y: hh * 0.6 }, { x: sx, y: hh * 0.6 }];
    }
    if (['Emerald', 'Radiant', 'Asscher', 'Cushion', 'Princess'].includes(shape)) {
      return [{ x: -hw * 0.85, y: -hh * 0.85 }, { x: hw * 0.85, y: -hh * 0.85 }, { x: -hw * 0.85, y: hh * 0.85 }, { x: hw * 0.85, y: hh * 0.85 }];
    }
    return [{ x: -hw * 0.65, y: -hh * 0.65 }, { x: hw * 0.65, y: -hh * 0.65 }, { x: -hw * 0.65, y: hh * 0.65 }, { x: hw * 0.65, y: hh * 0.65 }];
  }

  if (style === '6-Prong') {
    if (shape === 'Heart') {
      return [
        heartSpot(hw, hh, 0, 0.12), heartSpot(hw, hh, Math.PI, 0.1),
        heartSpot(hw, hh, 0.75), heartSpot(hw, hh, -0.75),
        heartSpot(hw, hh, 1.95), heartSpot(hw, hh, -1.95)
      ];
    }
    if (shape === 'Crescent Moon') {
      return [
        crescentSpot(hw, hh, 0.08, 0.45), crescentSpot(hw, hh, 0.92, 0.45),
        crescentSpot(hw, hh, 0.3, 0.1), crescentSpot(hw, hh, 0.7, 0.1),
        crescentSpot(hw, hh, 0.5, 0.08), crescentSpot(hw, hh, 0.5, 0.92)
      ];
    }
    if (shape === 'Hexagon') {
      const sx = hw * 0.866025;
      return [
        { x: 0, y: -hh * 0.95 }, { x: sx * 0.95, y: -hh * 0.475 }, { x: sx * 0.95, y: hh * 0.475 },
        { x: 0, y: hh * 0.95 }, { x: -sx * 0.95, y: hh * 0.475 }, { x: -sx * 0.95, y: -hh * 0.475 }
      ];
    }
    if (shape === 'Pear') {
      return [
        { x: 0, y: -hh * 0.95 }, { x: -hw * 0.55, y: -hh * 0.45 }, { x: hw * 0.55, y: -hh * 0.45 },
        { x: -hw * 0.85, y: hh * 0.35 }, { x: hw * 0.85, y: hh * 0.35 }, { x: 0, y: hh * 0.95 }
      ];
    }
    if (shape === 'Marquise') {
      return [
        { x: 0, y: -hh * 0.95 }, { x: 0, y: hh * 0.95 }, { x: -hw * 0.75, y: -hh * 0.25 },
        { x: hw * 0.75, y: -hh * 0.25 }, { x: -hw * 0.75, y: hh * 0.25 }, { x: hw * 0.75, y: hh * 0.25 }
      ];
    }
    if (['Emerald', 'Radiant', 'Asscher', 'Princess', 'Cushion'].includes(shape)) {
      return [
        { x: -hw * 0.4, y: -hh * 0.95 }, { x: hw * 0.4, y: -hh * 0.95 },
        { x: -hw * 0.4, y: hh * 0.95 }, { x: hw * 0.4, y: hh * 0.95 },
        { x: -hw * 0.95, y: 0 }, { x: hw * 0.95, y: 0 }
      ];
    }
    return [30, 90, 150, 210, 270, 330].map(angle => {
      const rad = (angle * Math.PI) / 180;
      return { x: Math.cos(rad) * hw * 0.95, y: Math.sin(rad) * hh * 0.95 };
    });
  }

  return [];
};

const getVProngData = (shape, hw, hh) => {
  const vSize = hw * 0.35;
  const isSquare = ['Princess', 'Asscher', 'Emerald', 'Radiant', 'Cushion'].includes(shape);

  if (isSquare) {
    return {
      chevrons: [
        { a: { x: -hw, y: -hh + vSize }, v: { x: -hw, y: -hh }, b: { x: -hw + vSize, y: -hh } },
        { a: { x: hw - vSize, y: -hh }, v: { x: hw, y: -hh }, b: { x: hw, y: -hh + vSize } },
        { a: { x: hw, y: hh - vSize }, v: { x: hw, y: hh }, b: { x: hw - vSize, y: hh } },
        { a: { x: -hw + vSize, y: hh }, v: { x: -hw, y: hh }, b: { x: -hw, y: hh - vSize } }
      ],
      roundProngs: []
    };
  }

  if (shape === 'Hexagon') {
    const sx = hw * 0.866025;
    return {
      chevrons: [
        { a: { x: -sx * 0.32, y: -hh + hh * 0.16 }, v: { x: 0, y: -hh }, b: { x: sx * 0.32, y: -hh + hh * 0.16 } },
        { a: { x: sx * 0.32, y: hh - hh * 0.16 }, v: { x: 0, y: hh }, b: { x: -sx * 0.32, y: hh - hh * 0.16 } }
      ],
      roundProngs: [
        { x: -sx * 0.85, y: -hh * 0.425 },
        { x: sx * 0.85, y: -hh * 0.425 },
        { x: -sx * 0.85, y: hh * 0.425 },
        { x: sx * 0.85, y: hh * 0.425 }
      ]
    };
  }

  if (shape === 'Marquise') {
    return {
      chevrons: [
        { a: { x: -hw * 0.32, y: -hh + hw * 0.32 }, v: { x: 0, y: -hh }, b: { x: hw * 0.32, y: -hh + hw * 0.32 } },
        { a: { x: hw * 0.32, y: hh - hw * 0.32 }, v: { x: 0, y: hh }, b: { x: -hw * 0.32, y: hh - hw * 0.32 } }
      ],
      roundProngs: [
        { x: -hw * 0.75, y: -hh * 0.3 },
        { x: hw * 0.75, y: -hh * 0.3 },
        { x: -hw * 0.75, y: hh * 0.3 },
        { x: hw * 0.75, y: hh * 0.3 }
      ]
    };
  }

  if (shape === 'Pear') {
    return {
      chevrons: [
        { a: { x: -hw * 0.32, y: -hh + hw * 0.32 }, v: { x: 0, y: -hh }, b: { x: hw * 0.32, y: -hh + hw * 0.32 } }
      ],
      roundProngs: [
        { x: -hw * 0.65, y: hh * 0.65 },
        { x: hw * 0.65, y: hh * 0.65 }
      ]
    };
  }

  if (shape === 'Heart') {
    // One claw cupping the point, round prongs on the lobes.
    return {
      chevrons: [
        { a: heartSpot(hw, hh, Math.PI - 0.32, 0), v: heartSpot(hw, hh, Math.PI, 0), b: heartSpot(hw, hh, Math.PI + 0.32, 0) }
      ],
      roundProngs: [heartSpot(hw, hh, 0.9), heartSpot(hw, hh, -0.9)]
    };
  }

  if (shape === 'Crescent Moon') {
    // A claw over each horn, round prongs on the outer curve.
    const tip = (along) => crescentSpot(hw, hh, along, 0);
    return {
      chevrons: [
        { a: crescentSpot(hw, hh, 0.09, 0), v: tip(0), b: crescentSpot(hw, hh, 0.09, 1) },
        { a: crescentSpot(hw, hh, 0.91, 1), v: tip(1), b: crescentSpot(hw, hh, 0.91, 0) }
      ],
      roundProngs: [crescentSpot(hw, hh, 0.38, 0.1), crescentSpot(hw, hh, 0.62, 0.1)]
    };
  }

  const cx = hw * 0.7071;
  const cy = hh * 0.7071;
  const arm = Math.min(hw, hh) * 0.28;
  return {
    chevrons: [
      { a: { x: -cx - arm * 0.2, y: -cy + arm }, v: { x: -cx, y: -cy }, b: { x: -cx + arm, y: -cy - arm * 0.2 } },
      { a: { x: cx - arm, y: -cy - arm * 0.2 }, v: { x: cx, y: -cy }, b: { x: cx + arm * 0.2, y: -cy + arm } },
      { a: { x: cx + arm * 0.2, y: cy - arm }, v: { x: cx, y: cy }, b: { x: cx - arm, y: cy + arm * 0.2 } },
      { a: { x: -cx + arm, y: cy + arm * 0.2 }, v: { x: -cx, y: cy }, b: { x: -cx - arm * 0.2, y: cy - arm } }
    ],
    roundProngs: []
  };
};

const signedDistanceToPolygon2D = (u, v, poly) => {
  let inside = false;
  let minDistSq = Infinity;
  const n = poly.length;

  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = poly[i].u, yi = poly[i].v;
    const xj = poly[j].u, yj = poly[j].v;

    const intersect = ((yi > v) !== (yj > v)) && (u < ((xj - xi) * (v - yi)) / ((yj - yi) || 1e-9) + xi);
    if (intersect) inside = !inside;

    const dx = xj - xi, dy = yj - yi;
    const lenSq = dx * dx + dy * dy || 1e-9;
    let t = ((u - xi) * dx + (v - yi) * dy) / lenSq;
    if (t < 0) t = 0;
    else if (t > 1) t = 1;
    const px = xi + t * dx, py = yi + t * dy;
    const distSq = (u - px) * (u - px) + (v - py) * (v - py);
    if (distSq < minDistSq) minDistSq = distSq;
  }

  const dist = Math.sqrt(minDistSq);
  return inside ? -dist : dist;
};

const projectPointToPolygonContour2D = (u, v, poly) => {
  let bestX = u, bestY = v, minDistSq = Infinity;
  const n = poly.length;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = poly[i].u, yi = poly[i].v;
    const xj = poly[j].u, yj = poly[j].v;
    const dx = xj - xi, dy = yj - yi;
    const lenSq = dx * dx + dy * dy || 1e-9;
    let t = ((u - xi) * dx + (v - yi) * dy) / lenSq;
    if (t < 0) t = 0;
    else if (t > 1) t = 1;
    const px = xi + t * dx, py = yi + t * dy;
    const dSq = (u - px) * (u - px) + (v - py) * (v - py);
    if (dSq < minDistSq) {
      minDistSq = dSq;
      bestX = px;
      bestY = py;
    }
  }
  return { u: bestX, v: bestY };
};

// Triangulates a simple polygon (array of {x, y}) by ear clipping and
// returns index triples in the polygon's own winding. Unlike a fan from the
// center, this is correct for shapes the center can't see all of, such as a
// crescent (its center sits in the hollow).
const earClipPolygon = (poly) => {
  const n = poly.length;
  if (n < 3) return [];
  let area = 0;
  for (let i = 0; i < n; i++) {
    const a = poly[i], b = poly[(i + 1) % n];
    area += a.x * b.y - b.x * a.y;
  }
  const sign = area >= 0 ? 1 : -1;
  const cross = (a, b, c) => ((b.x - a.x) * (c.y - a.y) - (b.y - a.y) * (c.x - a.x)) * sign;
  const inTri = (p, a, b, c) => cross(a, b, p) > 1e-12 && cross(b, c, p) > 1e-12 && cross(c, a, p) > 1e-12;
  const idx = Array.from({ length: n }, (_, i) => i);
  const tris = [];
  let guard = 0;
  while (idx.length > 3 && guard++ < n * n) {
    let clipped = false;
    for (let k = 0; k < idx.length; k++) {
      const i0 = idx[(k + idx.length - 1) % idx.length], i1 = idx[k], i2 = idx[(k + 1) % idx.length];
      const a = poly[i0], b = poly[i1], c = poly[i2];
      if (cross(a, b, c) <= 1e-12) continue;
      let blocked = false;
      for (const j of idx) {
        if (j === i0 || j === i1 || j === i2) continue;
        if (inTri(poly[j], a, b, c)) { blocked = true; break; }
      }
      if (blocked) continue;
      tris.push([i0, i1, i2]);
      idx.splice(k, 1);
      clipped = true;
      break;
    }
    if (!clipped) {
      // Only collinear runs remain: clip one anyway (zero-area) to finish.
      tris.push([idx[idx.length - 1], idx[0], idx[1]]);
      idx.splice(0, 1);
    }
  }
  if (idx.length === 3) tris.push([idx[0], idx[1], idx[2]]);
  return tris;
};

// Shrinks a stone outline for its table facet. Most shapes scale toward the
// center; a crescent instead thins toward its own midline (scaling would push
// the table into its hollow). Outer point i pairs with inner point n - i.
const insetStoneOutline = (shape, pts, k) => {
  if (shape !== 'Crescent Moon') return pts.map(p => ({ ...p, x: p.x * k, y: p.y * k }));
  const n = pts.length;
  const f = (1 - k) / 2;
  return pts.map((p, i) => {
    const q = pts[(n - i) % n];
    return { ...p, x: p.x + (q.x - p.x) * f, y: p.y + (q.y - p.y) * f };
  });
};

// Band cross-section. drop(v) is how far the outer surface sits below the
// band's crown at position v across the band (v = 0 is the centerline, the
// edges are at +/-halfW). Shared by the 3D model and the 2D blueprint shading.
//   flat:  no drop - square edges.
//   bevel: flat top with a 45-degree chamfer of width `edge` on both sides.
//   round: domed top (quarter-ellipse to each side) dropping `edge` at the rims.
const BAND_PROFILES = [
  { id: 'flat', label: 'Flat' },
  { id: 'bevel', label: 'Beveled' },
  { id: 'round', label: 'Rounded' }
];
// `size` (mm) overrides the automatic bevel width / dome height; it is capped
// so the band always keeps a flat strip (bevel) and solid metal at the rims.
const getAutoProfileSize = (profile, halfW, thickness) => (
  profile === 'bevel' ? Math.min(0.6, halfW * 0.3, thickness * 0.35)
    : profile === 'round' ? Math.min(thickness * 0.45, halfW * 0.5)
      : 0
);
const getMaxProfileSize = (profile, halfW, thickness) => (
  profile === 'bevel' ? Math.min(halfW * 0.9, thickness * 0.8)
    : profile === 'round' ? Math.min(thickness * 0.8, halfW)
      : 0
);
const getBandProfile = (profile, halfW, thickness, size = null) => {
  const auto = getAutoProfileSize(profile, halfW, thickness);
  const wanted = size === null || size === '' || !Number.isFinite(Number(size)) ? auto : Math.max(0.05, Number(size));
  const sized = Math.min(wanted, getMaxProfileSize(profile, halfW, thickness));
  if (profile === 'bevel') {
    const edge = sized;
    return { edge, breakV: halfW - edge, drop: (v) => Math.max(0, Math.abs(v) - (halfW - edge)) };
  }
  if (profile === 'round') {
    const edge = sized;
    return {
      edge,
      breakV: 0,
      drop: (v) => {
        const t = Math.min(1, Math.abs(v) / halfW);
        return edge * (1 - Math.sqrt(1 - t * t));
      }
    };
  }
  return { edge: 0, breakV: halfW, drop: () => 0 };
};

const build3DRingShells = ({
  renderedStones,
  bandWidth,
  bandColor,
  ringSize,
  bandThickness,
  gemRelief,
  pocketDepthInput,
  uniqueStone3D,
  include3DSettings,
  cutoutMode = 'pocket_and_gem',
  bandProfile = 'flat',
  bandProfileSize = null
}) => {
  const innerDiameter = RING_SIZES_MM[ringSize] || (11.63 + Number(ringSize) * 0.8128);
  const innerRadius = innerDiameter / 2;
  const thickness = Math.max(1.2, Number(bandThickness) || 1.8);
  const outerRadius = innerRadius + thickness;
  const bw = Number(bandWidth) || 4;
  const halfW = bw / 2;
  const safeRimV = Math.max(0.2, halfW - 0.18);
  const globalRelief = Number(gemRelief ?? 1.2);
  const globalPocketDepth = Math.min(thickness * 0.72, Math.max(0.2, Number(pocketDepthInput) || 0.75));
  const defaultRFloor = outerRadius - globalPocketDepth;
  const profile = getBandProfile(bandProfile, halfW, thickness, bandProfileSize);
  // Radius of the band's outer surface at position v across the band.
  const surfR = (v) => outerRadius - profile.drop(v);

  // Cylindrical wrap used ONLY for the band shell itself (outer surface, pocket
  // floors/walls, inner bore): one shared reference radius (outerRadius) keeps
  // every layer of the band perfectly concentric and watertight.
  const wrapPoint = (u, v, h) => {
    const theta = u / outerRadius;
    return {
      x: h * Math.sin(theta),
      y: -v,
      z: h * Math.cos(theta)
    };
  };

  const computeNormal = (v1, v2, v3) => {
    const ux = v2.x - v1.x, uy = v2.y - v1.y, uz = v2.z - v1.z;
    const vx = v3.x - v1.x, vy = v3.y - v1.y, vz = v3.z - v1.z;
    let nx = uy * vz - uz * vy;
    let ny = uz * vx - ux * vz;
    let nz = ux * vy - uy * vx;
    const len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
    return { x: nx / len, y: ny / len, z: nz / len };
  };

  // Flat tangent-plane placement for gems and prong/V-Prong metal, used
  // instead of wrapPoint for anything that should sit on the band as a rigid
  // rounded/flat object rather than bend to follow its curvature.
  //
  // wrapPoint(u, v, h) computes an angle theta = u / outerRadius from a FIXED
  // reference radius, then places the point at radius h. Whenever h differs
  // from outerRadius (which is every gem facet above/below the band surface),
  // the tangential (tangent u) direction gets scaled by (h / outerRadius)
  // while the v (band-width) direction is untouched - an anisotropic stretch
  // that turns round outlines into ovals and bends every flat facet into an
  // arc. Using theta = u / h instead (a per-point local wrap) fixes the
  // stretching but reintroduces curvature, since each ring at a different h
  // ends up bent by a different amount and the layers drift apart.
  //
  // The actual fix: build ONE flat 3D coordinate frame per stone, tangent to
  // the band at that stone's own center point, then place every vertex of
  // that stone/setting (root, girdle, table - every layer) inside that same
  // flat plane, offsetting only along the frame's outward normal for
  // elevation. The whole piece stays perfectly flat/rigid and undistorted,
  // and is simply positioned + tilted once to sit at the right spot on the
  // ring - exactly like a real stone glued onto a domed surface.
  // On a beveled or rounded band the frame drops to the band's surface at the
  // stone's center, so a stone set off-center sits on the band rather than
  // floating at the crown's height. All heights stay relative to the crown.
  const makeFlatFrame = (centerU, centerV) => {
    const theta0 = centerU / outerRadius;
    const sinT = Math.sin(theta0), cosT = Math.cos(theta0);
    const rC = surfR(centerV);
    return {
      center: { x: rC * sinT, y: -centerV, z: rC * cosT },
      tangent: { x: cosT, y: 0, z: -sinT },
      vAxis: { x: 0, y: -1, z: 0 },
      normal: { x: sinT, y: 0, z: cosT },
      centerU, centerV
    };
  };

  const placeFlat = (frame, u, v, h) => {
    const du = u - frame.centerU;
    const dv = v - frame.centerV;
    const e = h - outerRadius;
    return {
      x: frame.center.x + du * frame.tangent.x + dv * frame.vAxis.x + e * frame.normal.x,
      y: frame.center.y + du * frame.tangent.y + dv * frame.vAxis.y + e * frame.normal.y,
      z: frame.center.z + du * frame.tangent.z + dv * frame.vAxis.z + e * frame.normal.z
    };
  };

  // How far a prong's foot must slide across the band so a prong whose tip
  // sits past the band edge still plants its foot on the band (it leans in).
  const footOffsetV = (v, footRadius) => {
    const limit = Math.max(0, halfW - footRadius - 0.1);
    return Math.max(-limit, Math.min(limit, v)) - v;
  };

  const preparedStones = renderedStones.map((stone) => {
    const w = Number(stone.width) || 4;
    const shape = stone.shape || 'Round Brilliant';
    const ratio = SHAPE_RATIOS[shape] || 1;
    const h = w * ratio;
    const hw = w / 2;
    const hh = h / 2;
    const rot = Number(stone.rotation) || 0;
    const rad = (rot * Math.PI) / 180;
    const cosR = Math.cos(rad), sinR = Math.sin(rad);

    const outlinePts = getShapeOutlinePoints(shape, hw, hh, 96);

    const resolvedRelief = (uniqueStone3D && stone.reliefOverride !== undefined && stone.reliefOverride !== null && stone.reliefOverride !== '')
      ? Number(stone.reliefOverride)
      : globalRelief;

    const resolvedPocketDepthRaw = (uniqueStone3D && stone.pocketDepthOverride !== undefined && stone.pocketDepthOverride !== null && stone.pocketDepthOverride !== '')
      ? Number(stone.pocketDepthOverride)
      : globalPocketDepth;

    const stonePocketDepth = Math.min(thickness * 0.78, Math.max(0.2, resolvedPocketDepthRaw));
    const stoneRFloor = surfR(stone.y) - stonePocketDepth;

    const isFlushStone = stone.settingStyle === 'Flush' || resolvedRelief <= 0.01;
    const effectiveRelief = stone.settingStyle === 'Flush' ? 0 : resolvedRelief;
    const pocketCutScale = isFlushStone ? ((hw + 0.12) / Math.max(0.2, hw)) : 1.015;

    const toWorldUV = (pt, scale = 1) => {
      const sx = pt.x * scale;
      const sy = pt.y * scale;
      const rawU = stone.x + (sx * cosR - sy * sinR);
      const rawV = stone.y + (sx * sinR + sy * cosR);
      return {
        u: rawU,
        v: Math.max(-safeRimV, Math.min(safeRimV, rawV)),
        isCorner: pt.isCorner
      };
    };

    // Socket + plug. When the stone fits across the band, the socket is the
    // stone's outline (slightly enlarged) around its center, as before.
    // Otherwise the plug - the part of the stone that sits down in the band -
    // is a shrunken copy of the outline placed over the part of the stone
    // that actually overlaps the band: an offset or angled stone, or a long
    // marquise, keeps its plug on the band instead of centered on a stone
    // middle that may hang off it. It is the largest copy that fits inside
    // both the stone and the band while leaving a solid rim on each side.
    const rimMin = Math.max(0.35, bw * 0.1);
    const seatHalfV = halfW - rimMin;
    const worldPts = outlinePts.map(pt => ({
      u: stone.x + (pt.x * cosR - pt.y * sinR),
      v: stone.y + (pt.x * sinR + pt.y * cosR)
    }));
    const vMin = Math.min(...worldPts.map(p => p.v));
    const vMax = Math.max(...worldPts.map(p => p.v));

    // Feasible plug-center heights (v) for scale s: the plug's v-extent
    // c(1-s) + s*[vMin, vMax] must stay within the rims, and the center must
    // lie inside the stone.
    const plugCenterRange = (sc) => {
      if (sc >= 1) return (vMin >= -seatHalfV && vMax <= seatHalfV) ? [vMin, vMax] : null;
      const lo = Math.max(vMin, (-seatHalfV - sc * vMin) / (1 - sc));
      const hi = Math.min(vMax, (seatHalfV - sc * vMax) / (1 - sc));
      return lo <= hi ? [lo, hi] : null;
    };
    // Center of the stone's chord at height v (keeps the plug inside the stone).
    const chordMidU = (v) => {
      let uLo = Infinity, uHi = -Infinity;
      for (let i = 0; i < worldPts.length; i++) {
        const p1 = worldPts[i], p2 = worldPts[(i + 1) % worldPts.length];
        if ((p1.v - v) * (p2.v - v) > 0 || p1.v === p2.v) continue;
        const t = (v - p1.v) / (p2.v - p1.v);
        const u = p1.u + (p2.u - p1.u) * t;
        uLo = Math.min(uLo, u); uHi = Math.max(uHi, u);
      }
      return Number.isFinite(uLo) ? (uLo + uHi) / 2 : stone.x;
    };

    const fullRange = (vMin * pocketCutScale - stone.y * (pocketCutScale - 1) >= -seatHalfV &&
      vMax * pocketCutScale - stone.y * (pocketCutScale - 1) <= seatHalfV);
    let plugScale = 0;
    let plugCenter = { u: stone.x, v: stone.y };
    if (!fullRange) {
      let lo = 0, hi = 1;
      for (let step = 0; step < 30; step++) {
        const mid = (lo + hi) / 2;
        if (plugCenterRange(mid)) lo = mid; else hi = mid;
      }
      plugScale = lo;
      const range = plugCenterRange(plugScale);
      if (range) {
        const cv = Math.max(range[0], Math.min(range[1], stone.y));
        plugCenter = { u: chordMidU(cv), v: cv };
      }
    }
    const isNarrowSeat = !fullRange;
    const hasSocket = !isNarrowSeat || plugScale >= 0.2;
    const plugAround = (k) => worldPts.map((p, i) => ({
      u: plugCenter.u + (p.u - plugCenter.u) * k,
      v: plugCenter.v + (p.v - plugCenter.v) * k,
      isCorner: outlinePts[i].isCorner
    }));
    // The stone's root, in its own unrotated 2D frame, for the 3D builder.
    const toLocal = (p) => {
      const du = p.u - stone.x, dv = p.v - stone.y;
      return { x: du * cosR + dv * sinR, y: -du * sinR + dv * cosR };
    };
    const plugRootPts2D = isNarrowSeat && hasSocket ? plugAround(plugScale * 0.985).map(toLocal) : null;

    const cutContourUV = isNarrowSeat
      ? plugAround(Math.max(plugScale, 0.2)).map(p => ({ ...p, v: Math.max(-safeRimV, Math.min(safeRimV, p.v)) }))
      : outlinePts.map(pt => toWorldUV(pt, pocketCutScale));
    const cornerUVs = cutContourUV.filter(pt => pt.isCorner);

    return {
      ...stone,
      w, h, hw, hh, rot,
      cosR, sinR,
      maxRadius: Math.max(...cutContourUV.map(p => Math.hypot(p.u - stone.x, p.v - stone.y))) + 0.45,
      hasSocket,
      overlapsBand: vMin < seatHalfV && vMax > -seatHalfV,
      isNarrowSeat: isNarrowSeat && hasSocket,
      plugRootPts2D,
      outlinePts,
      cutContourUV,
      cornerUVs,
      isFlushStone,
      effectiveRelief,
      stonePocketDepth,
      stoneRFloor,
      plugScale,
      requestedPocketDepth: (uniqueStone3D && stone.pocketDepthOverride !== undefined && stone.pocketDepthOverride !== null && stone.pocketDepthOverride !== '')
        ? Number(stone.pocketDepthOverride)
        : Number(pocketDepthInput)
    };
  });

  // Notes shown on each stone's card when the model adjusts the design or a
  // part may be hard to print. level: 'warn' needs attention, 'info' explains.
  const MIN_METAL_UNDER_SOCKET = 0.6;
  const stoneNotes = {};
  const addNote = (stone, level, text) => {
    const key = stone.id ?? stone.originalIndex;
    (stoneNotes[key] = stoneNotes[key] || []).push({ level, text });
  };
  const leaningStones = new Set();
  const noteLean = (stone, offset) => {
    if (Math.abs(offset) > 0.01) leaningStones.add(stone);
    return offset;
  };

  const carveBandPockets = cutoutMode !== 'solid_band' && preparedStones.length > 0;

  const evalPocketSignedDist = (u, v) => {
    if (!carveBandPockets) return { d: 10, stone: null };
    const rimDist = safeRimV - Math.abs(v);
    if (rimDist < 0) return { d: -rimDist + 0.05, stone: null };

    let minD = Infinity;
    let closestStone = null;
    for (let i = 0; i < preparedStones.length; i++) {
      const st = preparedStones[i];
      if (!st.hasSocket) continue;
      const dx = u - st.x, dy = v - st.y;
      const boundD = Math.sqrt(dx * dx + dy * dy) - st.maxRadius;
      if (boundD > minD) continue;
      const d = signedDistanceToPolygon2D(u, v, st.cutContourUV);
      if (d < minD) {
        minD = d;
        closestStone = st;
      }
    }
    return { d: Math.max(Number.isFinite(minD) ? minD : 10, -rimDist), stone: closestStone };
  };

  const shells = [];

  const bandTris = [];
  const samePoint = (a, b) => Math.abs(a.x - b.x) < 1e-9 && Math.abs(a.y - b.y) < 1e-9 && Math.abs(a.z - b.z) < 1e-9;
  const pushBandTri = (p1, p2, p3, shadeTag = 'band') => {
    // Grid points snapped onto a socket contour can coincide with an edge
    // crossing; the zero-area triangles that produces would double up edges
    // and break the watertight mesh, so they are dropped.
    if (samePoint(p1, p2) || samePoint(p2, p3) || samePoint(p1, p3)) return;
    bandTris.push({
      v1: p1,
      v2: p2,
      v3: p3,
      normal: computeNormal(p1, p2, p3),
      shadeTag
    });
  };

  const circumference = 2 * Math.PI * outerRadius;
  const halfCirc = circumference / 2;

  let minStoneU = -8, maxStoneU = 8;
  if (preparedStones.length > 0) {
    minStoneU = Math.min(...preparedStones.map(s => s.x - s.maxRadius - 0.9));
    maxStoneU = Math.max(...preparedStones.map(s => s.x + s.maxRadius + 0.9));
  }
  minStoneU = Math.max(-halfCirc + 1, minStoneU);
  maxStoneU = Math.min(halfCirc - 1, maxStoneU);

  const uSamples = [];
  const backLeftSteps = 30;
  for (let i = 0; i < backLeftSteps; i++) {
    uSamples.push(-halfCirc + ((minStoneU - (-halfCirc)) * i) / backLeftSteps);
  }
  const crownStepSize = carveBandPockets ? 0.16 : 0.65;
  const crownSteps = Math.max(36, Math.min(260, Math.ceil((maxStoneU - minStoneU) / crownStepSize)));
  for (let i = 0; i < crownSteps; i++) {
    uSamples.push(minStoneU + ((maxStoneU - minStoneU) * i) / crownSteps);
  }
  const backRightSteps = 30;
  for (let i = 0; i < backRightSteps; i++) {
    uSamples.push(maxStoneU + ((halfCirc - maxStoneU) * i) / backRightSteps);
  }

  // Rows across the band. A shaped profile needs enough rows to follow its
  // curve, plus rows exactly on a bevel's fold lines so the chamfer is crisp
  // and extra rows near a domed band's rims where it curves fastest.
  let baseVSteps = carveBandPockets ? Math.max(28, Math.min(56, Math.ceil(bw / 0.14))) : 4;
  if (bandProfile !== 'flat') baseVSteps = Math.max(baseVSteps, 24);
  const vSet = [];
  for (let j = 0; j <= baseVSteps; j++) vSet.push(-halfW + (bw * j) / baseVSteps);
  if (bandProfile === 'bevel') {
    // Move the nearest row onto each fold line rather than adding one beside
    // it: two rows closer than the socket snapping distance fold onto each
    // other and break the mesh.
    [-profile.breakV, profile.breakV].forEach((fold) => {
      let best = 1;
      for (let j = 2; j < vSet.length - 1; j++) {
        if (Math.abs(vSet[j] - fold) < Math.abs(vSet[best] - fold)) best = j;
      }
      vSet[best] = fold;
    });
  }
  // Fold rows keep their exact position (no snapping onto a socket edge), so
  // a socket edge lying along a fold can't pull a whole row onto itself.
  const isFoldRow = (v) => bandProfile === 'bevel' && Math.abs(Math.abs(v) - profile.breakV) < 1e-9;
  if (bandProfile === 'round') [0.93, 0.975, 0.995].forEach(f => vSet.push(-halfW * f, halfW * f));
  vSet.sort((a, b) => a - b);
  const vSamples = vSet.filter((v, j) => j === 0 || v - vSet[j - 1] > 1e-6);
  const vSteps = vSamples.length - 1;

  const numU = uSamples.length;
  const numV = vSteps + 1;

  const gridUV = new Array(numU * numV);
  const gridDist = new Float32Array(numU * numV);
  const gridOutVerts = new Array(numU * numV);
  const gridFlrVerts = new Array(numU * numV);
  const gridInVerts = new Array(numU * numV);

  for (let i = 0; i < numU; i++) {
    const baseU = uSamples[i];
    const inCrown = carveBandPockets && baseU >= minStoneU && baseU <= maxStoneU;
    for (let j = 0; j < numV; j++) {
      const idx = i * numV + j;
      let u = baseU;
      let v = vSamples[j];
      let d = 10;
      let localRFloor = defaultRFloor;

      if (inCrown && j > 0 && j < vSteps) {
        const res = evalPocketSignedDist(u, v);
        d = res.d;
        if (res.stone) {
          localRFloor = res.stone.stoneRFloor;
        }
        if (Math.abs(d) < 0.032 && res.stone && !isFoldRow(v)) {
          let snapped = projectPointToPolygonContour2D(u, v, res.stone.cutContourUV);
          for (let c = 0; c < res.stone.cornerUVs.length; c++) {
            const cPt = res.stone.cornerUVs[c];
            if (Math.hypot(u - cPt.u, v - cPt.v) < 0.09) {
              snapped = { u: cPt.u, v: cPt.v };
              break;
            }
          }
          u = snapped.u;
          v = Math.max(-safeRimV, Math.min(safeRimV, snapped.v));
          d = 0;
        }
      }

      gridUV[idx] = { u, v, idx, rFloor: localRFloor };
      gridDist[idx] = d;
      gridOutVerts[idx] = wrapPoint(u, v, surfR(v));
      gridFlrVerts[idx] = wrapPoint(u, v, Math.min(localRFloor, surfR(v) - 0.12));
      if (j === 0 || j === vSteps) {
        gridInVerts[idx] = wrapPoint(u, v, innerRadius);
      }
    }
  }

  const edgeCrossingCache = new Map();
  const getCanonicalEdgeCrossing = (idxA, idxB) => {
    const minId = idxA < idxB ? idxA : idxB;
    const maxId = idxA < idxB ? idxB : idxA;
    const key = `${minId}_${maxId}`;
    let cached = edgeCrossingCache.get(key);
    if (cached) return cached;

    const uvA = gridUV[minId], uvB = gridUV[maxId];
    const dA = gridDist[minId], dB = gridDist[maxId];
    const denom = dA - dB;
    let t = Math.abs(denom) > 1e-8 ? (dA / denom) : 0.5;
    if (t < 0) t = 0;
    else if (t > 1) t = 1;

    let lo = 0, hi = 1;
    for (let step = 0; step < 6; step++) {
      const mid = 0.5 * (lo + hi);
      const mu = uvA.u + (uvB.u - uvA.u) * mid;
      const mv = uvA.v + (uvB.v - uvA.v) * mid;
      const md = evalPocketSignedDist(mu, mv).d;
      if ((dA >= 0 && md >= 0) || (dA < 0 && md < 0)) lo = mid;
      else hi = mid;
      t = 0.5 * (lo + hi);
    }

    let cu = uvA.u + (uvB.u - uvA.u) * t;
    let cv = uvA.v + (uvB.v - uvA.v) * t;
    const hint = evalPocketSignedDist(cu, cv).stone;
    const crossRFloor = hint ? hint.stoneRFloor : defaultRFloor;
    if (hint && hint.cutContourUV) {
      const proj = projectPointToPolygonContour2D(cu, cv, hint.cutContourUV);
      cu = proj.u;
      cv = Math.max(-safeRimV, Math.min(safeRimV, proj.v));
      // Snap to a sharp corner the same way grid points do, so a crossing and
      // a snapped grid point at that corner become one vertex, not two
      // almost-coincident ones that leave a pinhole in the mesh.
      for (let c = 0; c < hint.cornerUVs.length; c++) {
        const cPt = hint.cornerUVs[c];
        if (Math.hypot(cu - cPt.u, cv - cPt.v) < 0.09) {
          cu = cPt.u;
          cv = Math.max(-safeRimV, Math.min(safeRimV, cPt.v));
          break;
        }
      }
    }

    cached = {
      out: wrapPoint(cu, cv, surfR(cv)),
      flr: wrapPoint(cu, cv, Math.min(crossRFloor, surfR(cv) - 0.12))
    };
    edgeCrossingCache.set(key, cached);
    return cached;
  };

  const emitWeldedCrownTriangle = (id0, id1, id2) => {
    const d0 = gridDist[id0], d1 = gridDist[id1], d2 = gridDist[id2];
    const out0 = d0 >= 0, out1 = d1 >= 0, out2 = d2 >= 0;
    const outCount = (out0 ? 1 : 0) + (out1 ? 1 : 0) + (out2 ? 1 : 0);

    if (outCount === 3) {
      pushBandTri(gridOutVerts[id0], gridOutVerts[id1], gridOutVerts[id2], 'band');
      return;
    }
    if (outCount === 0) {
      pushBandTri(gridFlrVerts[id0], gridFlrVerts[id1], gridFlrVerts[id2], 'pocket_floor');
      return;
    }

    const ids = [id0, id1, id2];
    const outs = [out0, out1, out2];

    if (outCount === 1) {
      const k0 = outs.indexOf(true);
      const k1 = (k0 + 1) % 3;
      const k2 = (k0 + 2) % 3;
      const v0 = ids[k0], v1 = ids[k1], v2 = ids[k2];

      const c01 = getCanonicalEdgeCrossing(v0, v1);
      const c02 = getCanonicalEdgeCrossing(v0, v2);

      pushBandTri(gridOutVerts[v0], c01.out, c02.out, 'band');
      pushBandTri(c01.out, c02.out, c02.flr, 'pocket_wall');
      pushBandTri(c01.out, c02.flr, c01.flr, 'pocket_wall');
      pushBandTri(c01.flr, gridFlrVerts[v1], gridFlrVerts[v2], 'pocket_floor');
      pushBandTri(c01.flr, gridFlrVerts[v2], c02.flr, 'pocket_floor');
    } else {
      const kIn = outs.indexOf(false);
      const k1 = (kIn + 1) % 3;
      const k2 = (kIn + 2) % 3;
      const vIn = ids[kIn], v1 = ids[k1], v2 = ids[k2];

      const c1 = getCanonicalEdgeCrossing(v1, vIn);
      const c2 = getCanonicalEdgeCrossing(v2, vIn);

      pushBandTri(gridOutVerts[v1], gridOutVerts[v2], c2.out, 'band');
      pushBandTri(gridOutVerts[v1], c2.out, c1.out, 'band');
      pushBandTri(c2.out, c1.out, c1.flr, 'pocket_wall');
      pushBandTri(c2.out, c1.flr, c2.flr, 'pocket_wall');
      pushBandTri(gridFlrVerts[vIn], c1.flr, c2.flr, 'pocket_floor');
    }
  };

  for (let i = 0; i < numU; i++) {
    const iNext = (i + 1) % numU;
    for (let j = 0; j < vSteps; j++) {
      const id11 = i * numV + j;
      const id21 = iNext * numV + j;
      const id22 = iNext * numV + (j + 1);
      const id12 = i * numV + (j + 1);

      emitWeldedCrownTriangle(id11, id22, id21);
      emitWeldedCrownTriangle(id11, id12, id22);
    }

    const in1Top = gridInVerts[i * numV];
    const in2Top = gridInVerts[iNext * numV];
    const in2Bot = gridInVerts[iNext * numV + vSteps];
    const in1Bot = gridInVerts[i * numV + vSteps];
    pushBandTri(in1Top, in2Top, in2Bot, 'band');
    pushBandTri(in1Top, in2Bot, in1Bot, 'band');

    const out1Top = gridOutVerts[i * numV];
    const out2Top = gridOutVerts[iNext * numV];
    pushBandTri(out1Top, out2Top, in2Top, 'band');
    pushBandTri(out1Top, in2Top, in1Top, 'band');

    const out1Bot = gridOutVerts[i * numV + vSteps];
    const out2Bot = gridOutVerts[iNext * numV + vSteps];
    pushBandTri(out2Bot, out1Bot, in1Bot, 'band');
    pushBandTri(out2Bot, in1Bot, in2Bot, 'band');
  }

  shells.push({
    name: 'Part_01_Ring_Band_With_Sockets',
    role: 'Band (Single Watertight Shell)',
    color: METAL_COLORS[bandColor]?.hex || '#d4af37',
    isMetal: true,
    triangles: bandTris
  });

  // Faceted gem/prong-ball builder: uses ONE flat frame centered on the
  // shape's own (centerU, centerV) so the crown/girdle/root layers of a
  // round stone (or a prong tip) stay a true rigid rounded shape - never
  // bent to follow the band curvature underneath it.
  //
  // opts.frameU/frameV: build in another shape's flat frame instead of this
  // shape's own - used so prongs and halo gems stay co-planar with the main
  // stone they hold rather than each tilting to its own spot on the band.
  // opts.wrapRoot: seat the root layer on the curved band (wrapPoint) so a
  // prong's foot stays planted in the metal wherever the band falls away.
  // opts.rootOffsetV: slide the root layer across the band (a prong whose tip
  // is past the band edge leans in so its foot still lands on the band).
  // opts.tablePts2D: the table outline (default: outline * tableScale).
  // opts.rootPts2D + opts.seatR: replace the root layer
  // with a plug outline (same point count, in this shape's own 2D frame) and
  // add a matching seat layer at seatR, so a stone wider than the band tapers
  // into its socket - wherever on the stone that socket sits - and only
  // reaches full width above the band surface. opts.rootScale shrinks the
  // root about the center instead (used when no plug outline is given).
  const buildFacetedCrownShell = (pts2D, centerU, centerV, rotDeg, rRoot, rGirdle, rTable, tableScale, opts = {}) => {
    const rad = (rotDeg * Math.PI) / 180;
    const cosR = Math.cos(rad), sinR = Math.sin(rad);
    const n = pts2D.length;
    const frame = makeFlatFrame(opts.frameU ?? centerU, opts.frameV ?? centerV);
    const placeRoot = opts.wrapRoot
      ? (u, v, h) => wrapPoint(u, v, Math.min(h, surfR(v) - 0.25))
      : (u, v, h) => placeFlat(frame, u, v, h);

    const transform2D = (pt, scale = 1) => {
      const sx = pt.x * scale;
      const sy = pt.y * scale;
      return {
        u: centerU + (sx * cosR - sy * sinR),
        v: centerV + (sx * sinR + sy * cosR)
      };
    };

    const rootScale = opts.rootScale ?? 1;
    const tablePts2D = opts.tablePts2D || pts2D.map(p => ({ x: p.x * tableScale, y: p.y * tableScale }));
    const bottomPts2D = opts.rootPts2D || pts2D.map(p => ({ x: p.x * rootScale, y: p.y * rootScale }));
    const bottomCaps = earClipPolygon(bottomPts2D);
    const topCaps = earClipPolygon(tablePts2D);
    const rootOffsetV = opts.rootOffsetV ?? 0;
    const hasSeat = opts.seatR !== undefined && opts.seatR !== null;

    const bottomRing = [];
    const seatRing = [];
    const girdleRing = [];
    const tableRing = [];

    for (let i = 0; i < n; i++) {
      const pFull = transform2D(pts2D[i], 1.0);
      const pRoot = opts.rootPts2D ? transform2D(opts.rootPts2D[i]) : transform2D(pts2D[i], rootScale);
      const pTable = transform2D(tablePts2D[i]);
      bottomRing.push(placeRoot(pRoot.u, pRoot.v + rootOffsetV, rRoot));
      if (hasSeat) seatRing.push(placeFlat(frame, pRoot.u, pRoot.v, opts.seatR));
      girdleRing.push(placeFlat(frame, pFull.u, pFull.v, rGirdle));
      tableRing.push(placeFlat(frame, pTable.u, pTable.v, rTable));
    }

    const lowerRing = hasSeat ? seatRing : bottomRing;
    const tris = [];

    for (let i = 0; i < n; i++) {
      const next = (i + 1) % n;
      if (hasSeat) {
        tris.push([bottomRing[i], seatRing[i], seatRing[next]]);
        tris.push([bottomRing[i], seatRing[next], bottomRing[next]]);
      }
      tris.push([lowerRing[i], girdleRing[i], girdleRing[next]]);
      tris.push([lowerRing[i], girdleRing[next], lowerRing[next]]);
      tris.push([girdleRing[i], tableRing[i], tableRing[next]]);
      tris.push([girdleRing[i], tableRing[next], girdleRing[next]]);
    }
    // Flat bottom and table caps, triangulated from their outlines.
    bottomCaps.forEach(([a, b, c]) => tris.push([bottomRing[a], bottomRing[b], bottomRing[c]]));
    topCaps.forEach(([a, b, c]) => tris.push([tableRing[c], tableRing[b], tableRing[a]]));

    return tris.map(t => ({ v1: t[0], v2: t[1], v3: t[2], normal: computeNormal(t[0], t[1], t[2]), shadeTag: 'gem' }));
  };

  // Bezel collar: a hybrid of both placements. The rings that meet the band
  // (outer root/seat, inner root) follow the band's curve via wrapPoint so the
  // collar stays welded to the shank. The rings that hold the stone (girdle,
  // top, lip, inner girdle) sit in the stone's own flat frame, so the lip
  // stays level with the flat gem all the way round. Fully wrapped, the lip
  // dropped away from the gem along the ring's circumference and left the
  // stone standing proud of its bezel there.
  const buildShapeSpecificBezelShell = (stone) => {
    const { shape, hw, hh, rot, x: centerU, y: centerV, outlinePts: pts2D, effectiveRelief, stoneRFloor } = stone;
    const bSize = Math.max(0.15, Number(stone.bezelSize) || 0.5);
    const rad = (rot * Math.PI) / 180;
    const cosR = Math.cos(rad), sinR = Math.sin(rad);
    const n = pts2D.length;
    const frame = makeFlatFrame(centerU, centerV);

    const toUV = (pt) => ({
      u: centerU + (pt.x * cosR - pt.y * sinR),
      v: centerV + (pt.x * sinR + pt.y * cosR)
    });

    const clampRootToBandV = (v, blend = 0.72) => {
      const maxBandV = halfW * 0.96;
      if (Math.abs(v) <= maxBandV) return v;
      const clamped = Math.sign(v) * maxBandV;
      return v * (1 - blend) + clamped * blend;
    };

    const lipInset = -Math.min(bSize * 0.34, Math.min(hw, hh) * 0.14);
    const innerSeatPts2D = offsetPolygon2D(pts2D, -0.02, shape);
    const innerLipPts2D = offsetPolygon2D(pts2D, lipInset, shape);
    const outerTopPts2D = offsetPolygon2D(pts2D, bSize * 0.88, shape);
    const outerGirdlePts2D = offsetPolygon2D(pts2D, bSize, shape);
    const outerSkirtPts2D = offsetPolygon2D(pts2D, bSize * 1.06, shape);

    const setRelief = Math.max(0.32, effectiveRelief);
    const rRoot = Math.min(stoneRFloor, outerRadius - 0.48);
    const rBandSeat = outerRadius - 0.14;
    const rGirdle = outerRadius + setRelief * 0.56;
    const rTopOuter = outerRadius + setRelief * 0.88;
    const rTopLip = outerRadius + setRelief * 0.92;
    const rInnerGirdle = outerRadius + setRelief * 0.52;

    const outRootRing = [];
    const outSeatRing = [];
    const outGirdleRing = [];
    const outTopRing = [];
    const inLipRing = [];
    const inGirdleRing = [];
    const inRootRing = [];

    for (let i = 0; i < n; i++) {
      const uvSeatIn = toUV(innerSeatPts2D[i]);
      const uvLipIn = toUV(innerLipPts2D[i]);
      const uvOutTop = toUV(outerTopPts2D[i]);
      const uvOutGirdle = toUV(outerGirdlePts2D[i]);
      const uvOutSkirt = toUV(outerSkirtPts2D[i]);

      // Root rings are pulled fully onto the band, and the seat ring stops at
      // the band edge, so a bezel wider than the band tucks in under itself
      // instead of hanging below the band surface off its sides.
      const baseRootV = clampRootToBandV(uvOutSkirt.v, 1);
      const inRootV = clampRootToBandV(uvSeatIn.v, 1);
      const seatV = Math.max(-halfW, Math.min(halfW, uvOutSkirt.v));

      outRootRing.push(wrapPoint(uvOutSkirt.u, baseRootV, Math.min(rRoot, surfR(baseRootV) - 0.25)));
      outSeatRing.push(wrapPoint(uvOutSkirt.u, seatV, rBandSeat - profile.drop(seatV)));
      outGirdleRing.push(placeFlat(frame, uvOutGirdle.u, uvOutGirdle.v, rGirdle));
      outTopRing.push(placeFlat(frame, uvOutTop.u, uvOutTop.v, rTopOuter));
      inLipRing.push(placeFlat(frame, uvLipIn.u, uvLipIn.v, rTopLip));
      inGirdleRing.push(placeFlat(frame, uvSeatIn.u, uvSeatIn.v, rInnerGirdle));
      inRootRing.push(wrapPoint(uvSeatIn.u, inRootV, Math.min(rRoot, surfR(inRootV) - 0.25)));
    }

    const tris = [];
    const pushQuad = (a1, a2, b2, b1) => {
      tris.push([a1, b1, b2], [a1, b2, a2]);
    };

    for (let i = 0; i < n; i++) {
      const next = (i + 1) % n;
      pushQuad(outRootRing[i], outRootRing[next], outSeatRing[next], outSeatRing[i]);
      pushQuad(outSeatRing[i], outSeatRing[next], outGirdleRing[next], outGirdleRing[i]);
      pushQuad(outGirdleRing[i], outGirdleRing[next], outTopRing[next], outTopRing[i]);
      pushQuad(outTopRing[i], outTopRing[next], inLipRing[next], inLipRing[i]);
      pushQuad(inLipRing[i], inLipRing[next], inGirdleRing[next], inGirdleRing[i]);
      pushQuad(inGirdleRing[i], inGirdleRing[next], inRootRing[next], inRootRing[i]);
      pushQuad(inRootRing[i], inRootRing[next], outRootRing[next], outRootRing[i]);
    }

    return tris.map(t => ({ v1: t[0], v2: t[1], v3: t[2], normal: computeNormal(t[0], t[1], t[2]), shadeTag: 'band' }));
  };

  // V-Prong chevron: uses ONE flat frame centered on the STONE's own center
  // (not each chevron's own corner) so all of a stone's V-shaped claws stay
  // rigidly co-planar with each other and with the gem they hold, instead of
  // each tip bending away from center at its own angle. Only the foot (root
  // ring) follows the band's curve, so claws at the ends of a long stone
  // don't float above a band that has curved away beneath them.
  const build3DVProngChevron = (chevron, stone, rRoot, rGirdle, rTop) => {
    const { x: centerU, y: centerV, rot, hw, hh } = stone;
    const rad = (rot * Math.PI) / 180;
    const cosR = Math.cos(rad), sinR = Math.sin(rad);
    const frame = makeFlatFrame(centerU, centerV);

    const toUV = (pt) => ({
      u: centerU + (pt.x * cosR - pt.y * sinR),
      v: centerV + (pt.x * sinR + pt.y * cosR)
    });

    const thickness = Math.max(0.24, Math.min(hw, hh) * 0.14);

    let uxA = chevron.a.x - chevron.v.x;
    let uyA = chevron.a.y - chevron.v.y;
    const lenA = Math.hypot(uxA, uyA) || 1;
    uxA /= lenA; uyA /= lenA;

    let uxB = chevron.b.x - chevron.v.x;
    let uyB = chevron.b.y - chevron.v.y;
    const lenB = Math.hypot(uxB, uyB) || 1;
    uxB /= lenB; uyB /= lenB;

    let outVx = chevron.v.x;
    let outVy = chevron.v.y;
    const outVLen = Math.hypot(outVx, outVy) || 1;
    outVx /= outVLen; outVy /= outVLen;

    let nAx = -uyA, nAy = uxA;
    if (nAx * outVx + nAy * outVy < 0) { nAx = -nAx; nAy = -nAy; }

    let nBx = -uyB, nBy = uxB;
    if (nBx * outVx + nBy * outVy < 0) { nBx = -nBx; nBy = -nBy; }

    let bisX = nAx + nBx;
    let bisY = nAy + nBy;
    const bisLen = Math.hypot(bisX, bisY);
    if (bisLen < 1e-4) {
      bisX = outVx; bisY = outVy;
    } else {
      bisX /= bisLen; bisY /= bisLen;
    }
    const miterFactor = Math.min(1.55, 1 / Math.max(0.45, bisX * nAx + bisY * nAy));

    const buildProfile2D = (inwardShift = 0, outScale = 1.0) => {
      const vIn = {
        x: chevron.v.x - bisX * inwardShift,
        y: chevron.v.y - bisY * inwardShift
      };
      const aIn = {
        x: chevron.a.x - nAx * (inwardShift * 0.85),
        y: chevron.a.y - nAy * (inwardShift * 0.85)
      };
      const bIn = {
        x: chevron.b.x - nBx * (inwardShift * 0.85),
        y: chevron.b.y - nBy * (inwardShift * 0.85)
      };

      const effT = thickness * outScale;
      const aOut = {
        x: chevron.a.x + nAx * effT + uxA * (effT * 0.25),
        y: chevron.a.y + nAy * effT + uyA * (effT * 0.25)
      };
      const vOut = {
        x: chevron.v.x + bisX * (effT * miterFactor),
        y: chevron.v.y + bisY * (effT * miterFactor)
      };
      const bOut = {
        x: chevron.b.x + nBx * effT + uxB * (effT * 0.25),
        y: chevron.b.y + nBy * effT + uyB * (effT * 0.25)
      };

      const pts = [aIn, vIn, bIn, bOut, vOut, aOut];
      let signedArea = 0;
      for (let i = 0; i < pts.length; i++) {
        const p1 = pts[i], p2 = pts[(i + 1) % pts.length];
        signedArea += (p1.x * p2.y - p2.x * p1.y);
      }
      if (signedArea < 0) pts.reverse();
      return pts;
    };

    const rootPts2D = buildProfile2D(0.02, 1.08);
    const girdlePts2D = buildProfile2D(0.03, 1.0);
    const topPts2D = buildProfile2D(thickness * 0.55, 0.82);

    const n = 6;
    const rootRing = [];
    const girdleRing = [];
    const topRing = [];

    for (let i = 0; i < n; i++) {
      const uvR = toUV(rootPts2D[i]);
      const uvG = toUV(girdlePts2D[i]);
      const uvT = toUV(topPts2D[i]);

      const clampedRootV = Math.abs(uvR.v) > halfW * 0.95
        ? uvR.v * 0.25 + Math.sign(uvR.v) * halfW * 0.95 * 0.75
        : uvR.v;
      if (clampedRootV !== uvR.v) leaningStones.add(stone);

      // Foot follows the band's curve so it stays planted in the shank.
      rootRing.push(wrapPoint(uvR.u, clampedRootV, Math.min(rRoot, surfR(clampedRootV) - 0.25)));
      girdleRing.push(placeFlat(frame, uvG.u, uvG.v, rGirdle));
      topRing.push(placeFlat(frame, uvT.u, uvT.v, rTop));
    }

    const tris = [];
    const pushQuad = (a1, a2, b2, b1) => {
      tris.push([a1, b1, b2], [a1, b2, a2]);
    };

    for (let i = 0; i < n; i++) {
      const next = (i + 1) % n;
      pushQuad(rootRing[i], rootRing[next], girdleRing[next], girdleRing[i]);
      pushQuad(girdleRing[i], girdleRing[next], topRing[next], topRing[i]);
    }

    tris.push(
      [topRing[0], topRing[1], topRing[4]],
      [topRing[0], topRing[4], topRing[5]],
      [topRing[1], topRing[2], topRing[3]],
      [topRing[1], topRing[3], topRing[4]]
    );
    tris.push(
      [rootRing[0], rootRing[4], rootRing[1]],
      [rootRing[0], rootRing[5], rootRing[4]],
      [rootRing[1], rootRing[3], rootRing[2]],
      [rootRing[1], rootRing[4], rootRing[3]]
    );

    return tris.map(t => ({ v1: t[0], v2: t[1], v3: t[2], normal: computeNormal(t[0], t[1], t[2]), shadeTag: 'band' }));
  };

  // Halo base collar: same hybrid as the bezel - the bottom follows the
  // band's curve so it stays seated on the shank, while the top deck sits in
  // the center stone's flat frame so it stays level with that stone and
  // gives the halo gems a flat bed all the way round.
  const buildHollowCollarShell = (pts2D, centerU, centerV, rotDeg, innerPts2D, outerPts2D, rRoot, rTop) => {
    const rad = (rotDeg * Math.PI) / 180;
    const cosR = Math.cos(rad), sinR = Math.sin(rad);
    const n = pts2D.length;
    const frame = makeFlatFrame(centerU, centerV);
    // Bottom stays on the band even when the halo is wider than the band.
    const clampToBandV = (v) => Math.max(-(halfW - 0.05), Math.min(halfW - 0.05, v));

    const transformPt2D = (pt) => ({
      u: centerU + (pt.x * cosR - pt.y * sinR),
      v: centerV + (pt.x * sinR + pt.y * cosR)
    });

    const inBot = [], inTop = [], outBot = [], outTop = [];
    for (let i = 0; i < n; i++) {
      const pIn = transformPt2D(innerPts2D[i]);
      const pOut = transformPt2D(outerPts2D[i]);
      inBot.push(wrapPoint(pIn.u, clampToBandV(pIn.v), Math.min(rRoot, surfR(clampToBandV(pIn.v)) - 0.25)));
      inTop.push(placeFlat(frame, pIn.u, pIn.v, rTop));
      outBot.push(wrapPoint(pOut.u, clampToBandV(pOut.v), Math.min(rRoot, surfR(clampToBandV(pOut.v)) - 0.25)));
      outTop.push(placeFlat(frame, pOut.u, pOut.v, rTop));
    }

    const tris = [];
    for (let i = 0; i < n; i++) {
      const next = (i + 1) % n;
      tris.push([outBot[i], outTop[i], outTop[next]], [outBot[i], outTop[next], outBot[next]]);
      tris.push([inBot[next], inTop[next], inTop[i]], [inBot[next], inTop[i], inBot[i]]);
      tris.push([inTop[i], inTop[next], outTop[next]], [inTop[i], outTop[next], outTop[i]]);
      tris.push([outBot[i], outBot[next], inBot[next]], [outBot[i], inBot[next], inBot[i]]);
    }
    return tris.map(t => ({ v1: t[0], v2: t[1], v3: t[2], normal: computeNormal(t[0], t[1], t[2]), shadeTag: 'band' }));
  };

  if (cutoutMode !== 'sockets_only') {
    preparedStones.forEach((stone, idx) => {
      const { hw, hh, rot, shape, outlinePts: pts, effectiveRelief, isFlushStone, stonePocketDepth, stoneRFloor } = stone;

      const rRoot = carveBandPockets
        ? (stoneRFloor + 0.015)
        : (outerRadius - 0.45);

      let rTable = isFlushStone
        ? (outerRadius + 0.03)
        : (outerRadius + effectiveRelief);
      let rGirdle = isFlushStone
        ? (outerRadius - stonePocketDepth * 0.35)
        : (outerRadius + effectiveRelief * 0.55);

      // Wider than the band: the pavilion narrows into the socket and the
      // stone only reaches full width just above the band surface. A flush
      // stone can't sit below a surface narrower than itself, so it rides
      // just above the band instead.
      let gemOpts = {};
      if (stone.isNarrowSeat) {
        const seatR = outerRadius + 0.02;
        rGirdle = Math.max(rGirdle, seatR + 0.12);
        rTable = Math.max(rTable, rGirdle + 0.2);
        gemOpts = { rootPts2D: stone.plugRootPts2D, seatR };
      }

      const tableK = isFlushStone ? 0.78 : 0.64;
      gemOpts.tablePts2D = insetStoneOutline(shape, pts, tableK);
      const gemTris = buildFacetedCrownShell(pts, stone.x, stone.y, rot, rRoot, rGirdle, rTable, tableK, gemOpts);
      shells.push({
        name: `Part_${String(shells.length + 1).padStart(2, '0')}_Stone_${idx + 1}_${shape.replace(/\s+/g, '')}`,
        role: `Stone ${idx + 1} (${stone.colorMode === 'preset' ? stone.preset : 'Custom'})`,
        color: stone.color || '#fbfbfb',
        isMetal: false,
        triangles: gemTris
      });

      if (include3DSettings && stone.settingStyle && !['None', 'Flush'].includes(stone.settingStyle)) {
        const style = stone.settingStyle;
        const setRelief = Math.max(0.4, effectiveRelief);
        if (style === 'Bezel') {
          const bezelColorHex = METAL_COLORS[stone.bezelColor || bandColor]?.hex || '#d4af37';
          const bezelTris = buildShapeSpecificBezelShell(stone);
          shells.push({
            name: `Part_${String(shells.length + 1).padStart(2, '0')}_Stone_${idx + 1}_Bezel`,
            role: `Stone ${idx + 1} Bezel`,
            color: bezelColorHex,
            isMetal: true,
            triangles: bezelTris
          });
        } else if (style === 'V-Prong') {
          const vProngSpec = getVProngData(shape, hw, hh);
          const allVProngTris = [];
          const prongRoot = Math.min(stoneRFloor, outerRadius - 0.42);
          const prongGirdle = outerRadius + setRelief * 0.68;
          const prongTop = outerRadius + setRelief * 1.06;

          vProngSpec.chevrons.forEach((chev) => {
            const cTris = build3DVProngChevron(chev, stone, prongRoot, prongGirdle, prongTop);
            allVProngTris.push(...cTris);
          });

          if (vProngSpec.roundProngs.length > 0) {
            const pRadius = Math.max(0.28, hw * 0.15);
            const prongOutline = getShapeOutlinePoints('Round Brilliant', pRadius, pRadius, 16);
            const rad = (rot * Math.PI) / 180;
            const cosR = Math.cos(rad), sinR = Math.sin(rad);
            vProngSpec.roundProngs.forEach((p) => {
              const pu = stone.x + (p.x * cosR - p.y * sinR);
              const pv = stone.y + (p.x * sinR + p.y * cosR);
              const pTris = buildFacetedCrownShell(
                prongOutline, pu, pv, 0,
                prongRoot, outerRadius + setRelief * 0.85, outerRadius + setRelief * 1.08, 0.7,
                { frameU: stone.x, frameV: stone.y, wrapRoot: true, rootOffsetV: noteLean(stone, footOffsetV(pv, pRadius)) }
              );
              allVProngTris.push(...pTris);
            });
          }

          if (allVProngTris.length > 0) {
            shells.push({
              name: `Part_${String(shells.length + 1).padStart(2, '0')}_Stone_${idx + 1}_VProngs`,
              role: `Stone ${idx + 1} V-Prongs`,
              color: METAL_COLORS[bandColor]?.hex || '#d4af37',
              isMetal: true,
              triangles: allVProngTris
            });
          }
        } else if (style === '4-Prong' || style === '6-Prong') {
          const prongs = getProngPositions(style, shape, hw, hh);
          const pRadius = Math.max(0.28, hw * 0.16);
          const prongOutline = getShapeOutlinePoints('Round Brilliant', pRadius, pRadius, 16);
          const rad = (rot * Math.PI) / 180;
          const cosR = Math.cos(rad), sinR = Math.sin(rad);
          const allProngTris = [];

          prongs.forEach((p) => {
            const pu = stone.x + (p.x * cosR - p.y * sinR);
            const pv = stone.y + (p.x * sinR + p.y * cosR);
            const pTris = buildFacetedCrownShell(
              prongOutline, pu, pv, 0,
              Math.min(stoneRFloor, outerRadius - 0.38), outerRadius + setRelief * 0.85, outerRadius + setRelief * 1.12, 0.7,
              { frameU: stone.x, frameV: stone.y, wrapRoot: true, rootOffsetV: noteLean(stone, footOffsetV(pv, pRadius)) }
            );
            allProngTris.push(...pTris);
          });

          if (allProngTris.length > 0) {
            shells.push({
              name: `Part_${String(shells.length + 1).padStart(2, '0')}_Stone_${idx + 1}_Prongs`,
              role: `Stone ${idx + 1} Prongs`,
              color: METAL_COLORS[bandColor]?.hex || '#d4af37',
              isMetal: true,
              triangles: allProngTris
            });
          }
        } else if (style === 'Halo') {
          const hSize = Number(stone.haloSize) || 1.0;
          const hData = getHaloData(shape, hw, hh, hSize);
          const hRadius = hSize / 2;
          const haloGemOutline = getShapeOutlinePoints('Round Brilliant', hRadius, hRadius, 18);
          const rad = (rot * Math.PI) / 180;
          const cosR = Math.cos(rad), sinR = Math.sin(rad);

          const seatInnerPts = offsetPolygon2D(pts, 0.05, shape);
          const seatOuterPts = offsetPolygon2D(pts, hSize + 0.25, shape);
          const seatTris = buildHollowCollarShell(
            pts, stone.x, stone.y, rot,
            seatInnerPts, seatOuterPts,
            Math.min(stoneRFloor, outerRadius - 0.38), outerRadius + setRelief * 0.42
          );
          shells.push({
            name: `Part_${String(shells.length + 1).padStart(2, '0')}_Stone_${idx + 1}_Halo_Base`,
            role: `Stone ${idx + 1} Halo Base`,
            color: METAL_COLORS[bandColor]?.hex || '#d4af37',
            isMetal: true,
            triangles: seatTris
          });

          // One part per halo color, so per-stone colors show in 3D and each
          // color exports as its own named object for multi-color printing.
          const haloGroups = new Map();
          hData.stones.forEach((hp, hIdx) => {
            const hColor = getHaloStoneColor(stone, hIdx);
            if (!haloGroups.has(hColor)) haloGroups.set(hColor, []);
            const haloTris = haloGroups.get(hColor);
            const hu = stone.x + (hp.x * cosR - hp.y * sinR);
            const hv = stone.y + (hp.x * sinR + hp.y * cosR);
            const hTris = buildFacetedCrownShell(
              haloGemOutline, hu, hv, 0,
              outerRadius + setRelief * 0.2, outerRadius + setRelief * 0.65, outerRadius + setRelief * 0.88, 0.65,
              { frameU: stone.x, frameV: stone.y }
            );
            haloTris.push(...hTris);
          });

          const baseHaloColor = getHaloStoneColor({ ...stone, haloUniqueStones: false }, 0);
          haloGroups.forEach((haloTris, hColor) => {
            const count = haloTris.length / (haloGemOutline.length * 6);
            const colorName = Object.keys(PRESET_STONES).find(k => PRESET_STONES[k] === hColor);
            const isBase = hColor === baseHaloColor;
            const suffix = isBase ? '' : `_${(colorName || hColor.replace('#', '')).replace(/\s+/g, '')}`;
            shells.push({
              name: `Part_${String(shells.length + 1).padStart(2, '0')}_Stone_${idx + 1}_Halo_Gems${suffix}`,
              role: `Stone ${idx + 1} Halo Gems${isBase ? '' : ` - ${colorName || hColor}`} (${count})`,
              color: hColor,
              isMetal: false,
              triangles: haloTris
            });
          });
        }
      }
    });
  }

  preparedStones.forEach((stone) => {
    const fmt = (n) => Number(n).toFixed(2).replace(/\.?0+$/, '');
    if (carveBandPockets) {
      if (!stone.hasSocket && !stone.overlapsBand) {
        addNote(stone, 'warn', 'This stone is off the band, so no socket is cut. Move it toward the band center or widen the band.');
      } else if (!stone.hasSocket) {
        addNote(stone, 'warn', `Too large for the ${fmt(bw)} mm band to hold: a plug that fits would be under 20% of the stone, so no socket is cut. Widen the band or use a smaller stone.`);
      } else if (stone.isNarrowSeat) {
        addNote(stone, 'info', `Wider than the ${fmt(bw)} mm band: its plug is narrowed to ${Math.round(stone.plugScale * 100)}% of the stone's outline so the band keeps solid rims.`);
      }
      if (stone.requestedPocketDepth - stone.stonePocketDepth > 0.005) {
        addNote(stone, 'warn', `Socket depth capped at ${fmt(stone.stonePocketDepth)} mm (requested ${fmt(stone.requestedPocketDepth)} mm) to keep the ${fmt(thickness)} mm band intact.`);
      }
      const metalUnder = stone.stoneRFloor - innerRadius;
      if (stone.hasSocket && metalUnder < MIN_METAL_UNDER_SOCKET) {
        addNote(stone, 'warn', `Only ${fmt(metalUnder)} mm of metal under this socket; ${MIN_METAL_UNDER_SOCKET} mm or more is safer to print. Use a shallower socket or a thicker band.`);
      }
    }
    if (stone.isFlushStone && stone.isNarrowSeat) {
      addNote(stone, 'info', 'Too wide to set flush in this band, so it sits just above the band surface.');
    }
    if (include3DSettings && leaningStones.has(stone)) {
      addNote(stone, 'info', 'Prongs past the band edge lean inward so their feet land on the band.');
    }
  });

  return { shells, innerDiameter, outerDiameter: outerRadius * 2, bandWidth: bw, stoneNotes };
};

const generateBinarySTLBlob = (shells, bandWidth = 4) => {
  let totalTriangles = 0;
  shells.forEach(s => { totalTriangles += s.triangles.length; });

  const bufferLength = 84 + totalTriangles * 50;
  const arrayBuffer = new ArrayBuffer(bufferLength);
  const view = new DataView(arrayBuffer);

  const headerText = `MikeyTime Ring Studio v${APP_VERSION} Welded Multi-Shell STL (${shells.length} Shells)`;
  for (let i = 0; i < 80; i++) {
    view.setUint8(i, i < headerText.length ? headerText.charCodeAt(i) : 32);
  }

  view.setUint32(80, totalTriangles, true);

  const zOffset = (Number(bandWidth) || 4) / 2;
  const toSTLCoord = (pt) => ({ x: pt.x, y: -pt.z, z: pt.y + zOffset });
  const toSTLNormal = (n) => ({ x: n.x, y: -n.z, z: n.y });

  let offset = 84;
  shells.forEach(shell => {
    shell.triangles.forEach(tri => {
      const n = toSTLNormal(tri.normal);
      const v1 = toSTLCoord(tri.v1);
      const v2 = toSTLCoord(tri.v2);
      const v3 = toSTLCoord(tri.v3);

      view.setFloat32(offset, n.x, true);
      view.setFloat32(offset + 4, n.y, true);
      view.setFloat32(offset + 8, n.z, true);

      view.setFloat32(offset + 12, v1.x, true);
      view.setFloat32(offset + 16, v1.y, true);
      view.setFloat32(offset + 20, v1.z, true);

      view.setFloat32(offset + 24, v2.x, true);
      view.setFloat32(offset + 28, v2.y, true);
      view.setFloat32(offset + 32, v2.z, true);

      view.setFloat32(offset + 36, v3.x, true);
      view.setFloat32(offset + 40, v3.y, true);
      view.setFloat32(offset + 44, v3.z, true);

      view.setUint16(offset + 48, 0, true);
      offset += 50;
    });
  });

  return new Blob([arrayBuffer], { type: 'application/octet-stream' });
};

const generate3MFBlob = (shells, bandWidth = 4) => {
  const zOffset = (Number(bandWidth) || 4) / 2;
  const to3MFCoord = (pt) => ({ x: pt.x, y: -pt.z, z: pt.y + zOffset });

  let objectsXml = '';
  let buildItemsXml = '';

  shells.forEach((shell, idx) => {
    const objId = idx + 1;
    const vertMap = new Map();
    const verts = [];
    const tris = [];

    const getVertIdx = (p) => {
      const tp = to3MFCoord(p);
      const key = `${tp.x.toFixed(5)},${tp.y.toFixed(5)},${tp.z.toFixed(5)}`;
      let vIdx = vertMap.get(key);
      if (vIdx === undefined) {
        vIdx = verts.length;
        vertMap.set(key, vIdx);
        verts.push(`<vertex x="${tp.x.toFixed(5)}" y="${tp.y.toFixed(5)}" z="${tp.z.toFixed(5)}" />`);
      }
      return vIdx;
    };

    shell.triangles.forEach((tri) => {
      const i1 = getVertIdx(tri.v1);
      const i2 = getVertIdx(tri.v2);
      const i3 = getVertIdx(tri.v3);
      if (i1 !== i2 && i2 !== i3 && i3 !== i1) {
        tris.push(`<triangle v1="${i1}" v2="${i2}" v3="${i3}" />`);
      }
    });

    objectsXml += `
    <object id="${objId}" name="${shell.name}" type="model">
      <mesh>
        <vertices>${verts.join('')}</vertices>
        <triangles>${tris.join('')}</triangles>
      </mesh>
    </object>`;
    buildItemsXml += `<item objectid="${objId}" />`;
  });

  const modelXml = `<?xml version="1.0" encoding="UTF-8"?>
<model unit="millimeter" xml:lang="en-US" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02">
  <metadata name="Application">MikeyTime Ring Studio v${APP_VERSION}</metadata>
